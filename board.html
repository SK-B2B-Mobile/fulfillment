<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Fulfillment · 총량피킹 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070D; --surface:#0D1220; --surface2:#131B30;
  --border:#212B45;
  --border2:#2A3555;
  --text:#EDF1F9; --text-dim:#8A93AC;
  --amber:#F59E0B; --amber-bg:rgba(245,158,11,0.12);
  --green:#22C55E; --green-bg:rgba(34,197,94,0.12);
  --gray:#3A4560; --gray-bg:rgba(58,69,96,0.25);
  --sans:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; height:100%; overflow:hidden;}

/* ═══════════════ 상단 헤더 ═══════════════ */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 40px; border-bottom:2px solid var(--border); background:var(--surface);}
.tb-left{display:flex; align-items:center; gap:20px;}
.tb-logo{width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg,#8B5CF6,#3B82F6); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px;}
.tb-title{font-size:26px; font-weight:800; letter-spacing:-0.01em;}
.tb-sub{font-family:var(--mono); font-size:14px; color:var(--text-dim); margin-top:2px;}
.tb-right{display:flex; align-items:center; gap:36px;}
.tb-stat{text-align:right;}
.tb-stat-label{font-family:var(--mono); font-size:12px; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase;}
.tb-stat-value{font-family:var(--mono); font-size:34px; font-weight:800; line-height:1.1;}
.tb-clock{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--text-dim); min-width:200px; text-align:right;}
.tb-progress-outer{width:280px;}
.tb-progress-bar{height:10px; background:var(--surface2); border-radius:5px; overflow:hidden; margin-top:6px;}
.tb-progress-bar > div{height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); transition:width 0.6s;}

.status-dot{width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:8px;}
.status-dot.live{background:var(--green); box-shadow:0 0 12px var(--green);}
.status-dot.off{background:var(--gray);}
.status-dot.manual{background:var(--amber); box-shadow:0 0 12px var(--amber);}

/* ★ 2026-07-23 신규 — TV 자체 "다른 배치 조회" 버튼/드롭다운
   (batch.html의 활성 배치 전환과 별개 · 여기서 배치를 골라도
   다른 기기/작업자 폰에는 전혀 영향 없음, TV 혼자만 조회) */
.tb-switch-wrap{position:relative; margin-left:14px;}
.tb-switch-btn{font-family:var(--sans); font-size:13px; font-weight:700; color:var(--text-dim); background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 14px; cursor:pointer;}
.tb-switch-btn:hover{background:var(--border); color:var(--text);}
.tb-switch-dd{display:none; position:absolute; top:calc(100% + 8px); left:0; z-index:200; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px; min-width:340px; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.tb-switch-dd.open{display:block;}
.tb-switch-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 8px; border-radius:8px; cursor:pointer;}
.tb-switch-row:hover{background:var(--surface2);}
.tb-switch-row .tb-sw-id{font-family:var(--mono); font-weight:800; font-size:14px;}
.tb-switch-row .tb-sw-meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
.tb-switch-row .tb-sw-tag{font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; white-space:nowrap;}
.tb-switch-empty{padding:12px 8px; font-size:12px; color:var(--text-dim);}
.manual-banner{display:none; align-items:center; flex-wrap:wrap; row-gap:6px; gap:10px; background:var(--amber-bg); border:1px solid var(--amber); color:var(--amber); font-family:var(--mono); font-weight:700; font-size:13px; padding:8px 16px; border-radius:8px; margin-top:8px;}
.manual-banner.show{display:flex;}
.manual-banner button{font-family:var(--sans); font-size:12px; font-weight:700; background:none; border:1px solid var(--amber); color:var(--amber); border-radius:6px; padding:4px 10px; cursor:pointer;}
.manual-banner button:hover{background:var(--amber); color:#1a1300;}

/* ═══════════════ 미배분 경보 배너 (★ 2026-08-05 신규) ═══════════════
   "다른 고객사에겐 스캔됐는데 이 고객사는 완전히 0인" 패턴을 발견하면 뜸.
   빨간 계열로 눈에 확 띄게 — 방치하면 며칠씩 안 채워진 채 숨어있던 문제라
   조용한 배지가 아니라 확실히 알아차릴 수 있는 배너가 필요함. */
.unfulfilled-banner{display:none; align-items:center; gap:10px; background:rgba(239,68,68,0.14); border:1px solid #FF4D6D; color:#FF4D6D; font-family:var(--mono); font-weight:700; font-size:13px; padding:8px 16px; border-radius:8px; margin-top:8px; cursor:pointer;}
.unfulfilled-banner.show{display:flex;}
.unfulfilled-banner:hover{background:rgba(239,68,68,0.22);}
.unfulfilled-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9000; align-items:center; justify-content:center;}
.unfulfilled-modal-overlay.show{display:flex;}
.unfulfilled-modal{background:var(--surface); border:1px solid #FF4D6D; border-radius:14px; width:min(720px, 92vw); max-height:80vh; display:flex; flex-direction:column; overflow:hidden;}
.unfulfilled-modal-head{padding:18px 22px; border-bottom:1px solid var(--border2); display:flex; align-items:center; justify-content:space-between;}
.unfulfilled-modal-head h3{margin:0; color:#FF4D6D; font-size:16px;}
.unfulfilled-modal-head button{background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1;}
.unfulfilled-modal-body{padding:14px 22px; overflow-y:auto;}
.unfulfilled-modal-note{font-size:12px; color:var(--text-dim); line-height:1.6; margin-bottom:14px; padding:10px 12px; background:var(--surface2); border-radius:8px;}
.unfulfilled-row{padding:10px 0; border-bottom:1px solid var(--border2); font-size:13px;}
.unfulfilled-row .ur-top{display:flex; justify-content:space-between; font-weight:700;}
.unfulfilled-row .ur-slot{color:var(--amber); font-family:var(--mono);}
.unfulfilled-row .ur-meta{color:var(--text-dim); font-size:12px; margin-top:3px; font-family:var(--mono);}

/* ═══════════════ 슬롯 그리드 ═══════════════ */
/* ★ 2026-08-18 신규 — 하단 여백(padding-bottom)을 넉넉히 줌. 배치 고객사가
   30개를 넘어 "추가 배정 구역"(31번 이상)이 생기면, 스크롤을 끝까지 내려도
   그 마지막 줄의 "패킹존 이동" 체크박스가 화면 맨 아래 가장자리에 거의 딱
   붙어버려서(여유 공간 없음) 터치가 잘 안 먹는 문제가 있었음. */
.board{padding:26px 36px 200px 36px; height:calc(100vh - 108px); overflow-y:auto;}
.zone-label{font-family:var(--mono); font-size:15px; color:var(--text-dim); letter-spacing:0.1em; margin:18px 0 12px; text-transform:uppercase;}
.zone-label:first-child{margin-top:0;}
.grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:16px;}
.grid.small{grid-template-columns:repeat(5, 1fr);}

.card{background:var(--surface); border:2px solid var(--border); border-radius:16px; padding:18px 20px; min-height:190px; display:flex; flex-direction:column; transition:all 0.4s;}
.card.waiting{opacity:0.55;}
.card.active{border-color:var(--amber); background:var(--amber-bg); animation:pulse 1.5s ease-in-out infinite;}
/* ★ 2026-07-13 변경: 완료 슬롯을 테두리만 초록으로 강조하던 것에서, 칸 전체를
   초록색으로 꽉 채우도록 변경 — 멀리서도(TV 화면 특성상) 한눈에 "다 됐다"가
   확 들어오도록. 텍스트는 초록 배경 위에서 잘 읽히는 진한 색으로 전부 맞춤. */
.card.done{border-color:var(--green); background:var(--green);}
.card.flash{animation:flashDone 1.8s ease-out 2;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.4);} 50%{box-shadow:0 0 0 10px rgba(245,158,11,0);}}
@keyframes flashDone{0%{box-shadow:0 0 40px var(--green);} 100%{box-shadow:0 0 0 rgba(34,197,94,0);}}

.card-top{display:flex; justify-content:space-between; align-items:flex-start;}
.card-slot{font-family:var(--mono); font-size:48px; font-weight:800; color:var(--text-dim);}
.card.active .card-slot{color:var(--amber);}
.card.done .card-slot{color:#04140D;}
.card-ship{font-family:var(--mono); font-size:19px; font-weight:800; padding:6px 12px; border-radius:6px; letter-spacing:0.04em;}
/* ★ 2026-07-13 신규: 배송타입(UPS/PU/TK)별 색상 구분 — batch.html과 동일한 배색 사용 */
.card-ship.ship-UPS{background:rgba(139,92,246,0.18); color:#B39CFF;}
.card-ship.ship-PU{background:rgba(34,211,238,0.18); color:#67E4F5;}
.card-ship.ship-TK{background:rgba(245,158,11,0.18); color:#FBBF4E;}
.card-ship.ship-other{background:rgba(58,69,96,0.35); color:var(--text-dim);}
.card.done .card-ship{background:rgba(4,20,13,0.18); color:#04140D;}
.card-cust{font-size:30px; font-weight:700; margin-top:10px; line-height:1.2; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.card.done .card-cust{color:#04140D;}
/* ★ 2026-07-23 신규 — 인보이스 번호는 실물 박스 라벨과 대조하는 용도라 TV에도 필요하다는
   현장 요청으로 추가. card-cust(고객사명)보다는 작지만, 다른 메타 정보보다는 눈에 띄게. */
.card-invoice{font-family:var(--mono); font-size:20px; font-weight:800; color:var(--text-dim); margin-top:2px; letter-spacing:0.02em;}
.card.done .card-invoice{color:#04140D; opacity:0.85;}
.card-bottom{margin-top:12px;}
.card-qty{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
.card.active .card-qty, .card.done .card-qty{color:var(--text);}
.card.done .card-qty{color:#04140D;}
.card-metarow{display:flex; justify-content:space-between; font-family:var(--mono); font-size:24px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
.card.active .card-metarow, .card.done .card-metarow{color:var(--text);}
.card.done .card-metarow{color:#04140D;}
.card-sku{opacity:0.85;}
.card-bar{height:11px; background:rgba(255,255,255,0.08); border-radius:5px; overflow:hidden;}
.card-bar > div{height:100%; background:var(--amber); transition:width 0.5s;}
.card.done .card-bar{background:rgba(4,20,13,0.18);}
.card.done .card-bar > div{background:#04140D;}
/* ★ 2026-07-23 신규 — "패킹존 이동" 체크박스 (구 .card-done-tag 정적 문구를 대체).
   clearSlot(슬롯비우기)과 무관한 순수 표시용 상태. 체크하면 카드 전체가 블루로
   바뀌어서, 초록(=완료했지만 아직 패킹존으로 안 옮김, 신경 써야 함)과 한눈에 구분됨. */
.card-pack-check{display:none; align-items:center; gap:8px; cursor:pointer; margin-top:10px;}
.card.done .card-pack-check{display:flex;}
.card.done .card-pack-check .label{font-family:var(--mono); font-size:18px; font-weight:800; color:#04140D; white-space:nowrap;}
/* ★ 2026-07-24 수정 — 완료(초록) 카드와 똑같은 방식: 테두리만이 아니라
   카드 전체 배경을 진한 핑크로 꽉 채움(라인=배경 완전히 통일). 텍스트도
   초록카드처럼 어두운 색으로. 애니메이션도 훨씬 강하고 눈에 띄게(밝기+그림자
   크게 진동, 주기도 짧게). */
.card.done.moved{background:#EC4899; border-color:#EC4899;
  animation: packMovedGlow 1.6s ease-in-out infinite;
}
@keyframes packMovedGlow{
  0%, 100%{ background:#EC4899; border-color:#EC4899; box-shadow: 0 0 10px 2px rgba(236,72,153,0.35); }
  50%{ background:#FF6FBF; border-color:#FFB3DD; box-shadow: 0 0 45px 12px rgba(255,111,191,0.95); }
}
.card.done.moved .card-slot, .card.done.moved .card-cust, .card.done.moved .card-invoice,
.card.done.moved .card-metarow, .card.done.moved .card-sku{color:#04140D !important;}
.card-pack-check .box{width:22px; height:22px; border-radius:5px; border:2px solid #04140D; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.card.done.moved .card-pack-check .box{border-color:#04140D; background:#04140D;}
.card-pack-check .box svg{display:none; width:14px; height:14px;}
.card.done.moved .card-pack-check .box svg{display:block;}
.card.done.moved .card-pack-check .label{color:#04140D !important;}
/* ★ 2026-08-04 신규 — 3단계째: 출고 작업자가 실제로 가져간 상태(taken).
   핑크 카드를 한 번 더 누르면 이 상태가 됨. 초록/핑크와 같은 설계 언어
   (밝은 배경 + 진한 글자)를 유지해서 글씨·숫자가 확실히 보이게 함.
   요청대로 애니메이션 없음 — 가만히 있는 고정 파란색. */
.card.done.taken{background:#3EB8F5; border-color:#3EB8F5; animation:none;}
.card.done.taken .card-slot, .card.done.taken .card-cust, .card.done.taken .card-invoice,
.card.done.taken .card-metarow, .card.done.taken .card-sku{color:#04140D !important;}
.card.done.taken .card-bar{background:rgba(4,20,13,0.18);}
.card.done.taken .card-bar > div{background:#04140D;}
.card.done.taken .card-issue-badge{color:#04140D; background:rgba(4,20,13,0.18); border-color:rgba(4,20,13,0.4);}
.card.done.taken .card-pack-check .box{border-color:#04140D; background:#04140D;}
.card.done.taken .card-pack-check .box svg{display:block;}
.card.done.taken .card-pack-check .label{color:#04140D !important;}
/* ★ 2026-08-24 신규 — 오출고 방지: 최종 4단계째 "2ND VERIFICATION COMPLETE"(보라).
   ★★★ 파랑(taken)의 기존 의미는 절대 안 바뀜 — .card.done.taken 클래스는 그대로
   유지된 채, 이 규칙이 그 위에 색만 오버라이드해서 얹힘(선택자 우선순위로 이김).
   파랑 다음의 마지막 단계이며, 검증이 끝나야만 붙는 class="verified"로만 켜짐.
   ★ 주황(진행중 active 상태와 색이 겹쳐 헷갈릴 수 있음)이 아니라 보라를 사용 —
   기존 5색(회색/주황/초록/핑크/파랑) 어디와도 안 겹치는 "인증 완료" 느낌의 색. */
.card.done.taken.verified{background:#8B5CF6; border-color:#8B5CF6; animation:none;}
.card.done.taken.verified .card-slot, .card.done.taken.verified .card-cust, .card.done.taken.verified .card-invoice,
.card.done.taken.verified .card-metarow, .card.done.taken.verified .card-sku{color:#FFFFFF !important;}
.card.done.taken.verified .card-bar{background:rgba(255,255,255,0.22);}
.card.done.taken.verified .card-bar > div{background:#FFFFFF;}
.card.done.taken.verified .card-issue-badge{color:#FFFFFF; background:rgba(255,255,255,0.2); border-color:rgba(255,255,255,0.45);}
.card.done.taken.verified .card-pack-check .box{border-color:#FFFFFF; background:#FFFFFF;}
.card.done.taken.verified .card-pack-check .box svg{display:block; stroke:#8B5CF6 !important;}
.card.done.taken.verified .card-pack-check .label{color:#FFFFFF !important;}
.card-empty{display:flex; align-items:center; justify-content:center; height:100%; font-family:var(--mono); font-size:20px; color:var(--text-dim); opacity:0.4;}

.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; gap:16px;}
.empty-state h2{font-size:28px; color:var(--text-dim);}
.empty-state p{font-family:var(--mono); font-size:16px; color:var(--text-dim); opacity:0.6;}

/* ★ 2026-07-16 신규 — 이슈(EXP/NF/Damaged/OOS) 뱃지 + 상세 모달 */
.card-top-right{display:flex; align-items:center; gap:8px;}
.card-issue-badge{font-family:var(--mono); font-size:16px; font-weight:800; color:#FF4D6D; background:rgba(255,77,109,0.15); border:1.5px solid rgba(255,77,109,0.5); border-radius:8px; padding:3px 9px; cursor:pointer;}
.card-issue-badge:hover{background:rgba(255,77,109,0.28);}
.card.done .card-issue-badge{color:#04140D; background:rgba(4,20,13,0.18); border-color:rgba(4,20,13,0.4);}

.issue-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:100; align-items:center; justify-content:center;}
.issue-modal-overlay.open{display:flex;}
.issue-modal{background:var(--surface); border:2px solid var(--border); border-radius:18px; width:min(920px, 94vw); max-height:86vh; display:flex; flex-direction:column; overflow:hidden;}
.issue-modal-head{display:flex; justify-content:space-between; align-items:center; padding:22px 26px; border-bottom:2px solid var(--border);}
.issue-modal-head h3{font-size:24px; font-weight:800;}
.issue-modal-close{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:38px; height:38px; border-radius:10px; font-size:16px; cursor:pointer;}
.issue-modal-body{padding:18px 26px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;}
.issue-modal-row{background:rgba(255,77,109,0.06); border:1px solid rgba(255,77,109,0.3); border-radius:12px; padding:14px 18px;}
.issue-modal-row-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.issue-modal-reason{font-family:var(--mono); font-size:15px; font-weight:800; color:#FF4D6D;}
.issue-modal-qty{font-family:var(--mono); font-size:20px; font-weight:800;}
.issue-modal-name{font-size:17px; font-weight:700; margin-bottom:4px;}
.issue-modal-meta{font-family:var(--mono); font-size:13px; color:var(--text-dim);}
.issue-modal-note{margin-top:6px; font-size:14px; color:var(--text-dim); font-style:italic;}
.issue-modal-edit-btn{margin-top:10px; width:100%; padding:9px; background:none; border:1px solid var(--border2); border-radius:8px; color:var(--text-dim); font-size:13px; font-weight:700; cursor:pointer;}
.issue-modal-edit-btn:hover{background:rgba(255,255,255,0.06); color:var(--text);}

<script>
// ═══════════════════════════════════════════════════════════
// ★★★ CONFIG — 반드시 채워야 작동합니다 (batch.html과 동일한 값) ★★★
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbykK9DWjem9ORHxfR_mpdZl5DVh-en0D6JpCdIuel305QmfqxoNU_NqSnjkhFk401hI/exec',
};
const GAS_READY = CONFIG.GAS_URL.startsWith('https://script.google.com/');
// ★ 2026-08-19 수정(현장 확인) — 서버(Apps Script)에 여러 기기의 요청이
//   몰려 간헐적으로 응답 실패하는 게 확인돼서, 8초→12초로 완화. TV는 실시간성이
//   더 중요하긴 하지만, 12초 정도는 체감 차이가 크지 않고 서버 부담은 확실히 줄어듦.
const POLL_MS = 12000;

/* ★ 2026-08-11 신규 — TV를 새로고침했을 때 즉시 화면이 뜨도록,
 * 마지막으로 보던 배치 번호를 이 기기에 기억해둠. 데이터가 아니라
 * "어느 배치를 보고 있었는가"만 저장하므로 안전함(하루 지나면 자동 폐기). */
const LAST_BATCH_KEY = 'tvLastBatchId';
let BOOT_FAST = true;
let LAST_BATCH_ID = null;
try{
  const raw = JSON.parse(localStorage.getItem(LAST_BATCH_KEY) || 'null');
  if(raw && raw.id && (Date.now() - raw.at) < 24*60*60*1000) LAST_BATCH_ID = raw.id;
}catch(e){}
function rememberBatch(id){
  try{ localStorage.setItem(LAST_BATCH_KEY, JSON.stringify({ id: id, at: Date.now() })); }catch(e){}
}

// ★ 2026-08-19 신규(긴급) — 오늘 하루 종일 batch.html/board.html/sk-worker
//   전부에서 "Access to fetch ... blocked by CORS policy" 에러가 간헐적으로
//   발생. 직접 주소 접속(navigation)은 항상 정상 응답하는데 fetch()만 계속
//   막히는 걸로 봐서, Apps Script의 script.google.com→script.googleusercontent.com
//   리다이렉트 구간에서 CORS 허용 헤더가 불안정하게 실리는 구글 쪽 고질적인
//   문제로 보임(서버 자체는 정상 — 직접 접속하면 항상 200 OK가 나옴).
//   <script> 태그로 데이터를 받아오는 JSONP 방식은 애초에 CORS 검사 대상이
//   아니라서 이 문제를 원천적으로 피해감. sk-worker에 이미 있던 방식과 동일.
//   서버(Code.gs json_())가 이미 callback= 파라미터를 지원하고 있어서 별도
//   서버 수정 없이 바로 적용 가능.
let _jsonpCounter = 0;
function jsonpGet(url, timeoutMs){
  return new Promise((res, rej) => {
    const cbName = '__jsonp_' + (++_jsonpCounter) + '_' + Date.now();
    const timer = setTimeout(() => { cleanup(); rej(new Error('jsonp timeout')); }, timeoutMs || 15000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cbName]; }catch(e){}
      const s = document.getElementById(cbName);
      if(s && s.parentNode) s.parentNode.removeChild(s);
    }
    window[cbName] = (data) => { cleanup(); res(data); };
    const script = document.createElement('script');
    script.id = cbName;
    script.onerror = () => { cleanup(); rej(new Error('jsonp error')); };
    const sep = url.indexOf('?') >= 0 ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

async function gasQueryWithRetry(op, params, retries){
  // ★ 2026-08-19 재수정(긴급) — 재시도 2번(총 3번 시도)이 혼잡할 때 요청을
  //   과도하게 증폭시키는 게 확인돼서, 1번(총 2번 시도)으로 줄이고 지터를
  //   크게 넣어서 여러 기기가 정확히 같은 타이밍에 몰려서 재시도하지 않게 함.
  //   이제 이 함수는 "사람이 직접 누른 동작"(다른 배치 선택, 슬롯 클릭 등)에만
  //   쓰임 — 반복 폴링 안에서는 안 씀(그쪽은 다음 폴링이 알아서 재시도 역할을 함).
  const maxRetries = (retries === undefined) ? 1 : retries;
  let res = await gasQuery(op, params);
  for(let attempt = 1; !res.ok && attempt <= maxRetries; attempt++){
    const jitter = Math.floor(Math.random() * 2000);
    await new Promise(r => setTimeout(r, 3000 * attempt + jitter)); // 3초+지터
    res = await gasQuery(op, params);
  }
  return res;
}

async function gasQuery(op, params){
  if(!GAS_READY) return { ok:false, error:'GAS_URL 미설정' };
  const qs = new URLSearchParams(Object.assign({op, _ts: Date.now()}, params||{})).toString();
  try{
    // ★ 2026-07-17 수정: TV처럼 오래 켜두는 화면에서 브라우저가 예전 응답을
    //   캐싱해서 재사용하는 바람에 데이터가 안 바뀌는 것처럼 보이던 문제 수정.
    //   매번 다른 타임스탬프를 붙이고, fetch 자체도 캐시를 쓰지 말라고 명시.
    const res = await fetch(`${CONFIG.GAS_URL}?${qs}`, { cache: 'no-store' });
    return await res.json();
  }catch(e){
    // ★ 2026-08-19 신규 — fetch가 CORS 등으로 실패하면 JSONP로 한 번 더 시도
    console.warn('gasQuery fetch 실패, JSONP로 재시도:', op, e);
    try{
      return await jsonpGet(`${CONFIG.GAS_URL}?${qs}`);
    }catch(e2){
      console.error('gasQuery 완전 실패(fetch+JSONP 둘다):', op, e2);
      return { ok:false, error:String(e2) };
    }
  }
}
// ★ 2026-07-22 신규 — 이슈 되돌리기(undoIssue) 등 저장/변경 작업용 POST 호출
async function gasCall(op, data){
  if(!GAS_READY) return { ok:false, error:'GAS_URL 미설정' };
  try{
    const fd = new FormData();
    fd.append('op', op);
    fd.append('data', JSON.stringify(data || {}));
    // ★ 2026-07-22 신규: 타임아웃이 없어서 서버 응답이 늦으면 "처리 중..."
    //   상태로 무한정 멈춰있던 문제 수정 — 20초 넘으면 실패로 보고 사용자가
    //   다시 시도할 수 있게 함.
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    const res = await fetch(CONFIG.GAS_URL, { method:'POST', body: fd, signal: controller.signal });
    clearTimeout(timer);
    return await res.json();
  }catch(e){
    console.error('gasCall failed:', op, e);
    const msg = (e && e.name === 'AbortError') ? '서버 응답이 너무 늦어서 중단했습니다(20초 초과). 다시 시도해주세요.' : String(e);
    return { ok:false, error: msg };
  }
}

let _slotsByInvoice = {}; // ★ 2026-07-16 신규: 이슈 뱃지 클릭 시 상세 조회용
// ★ 2026-07-28 신규 — 패킹존 이동 체크가 8초 폴링에 되돌아가던 경쟁상태 버그 수정용.

//   탭의 "출고 대기" 안내는 서버 원본을 그대로 읽어서 정직하게 "27건 미출고"라고

//   기록하고, PENDING_MAX_MS(30초)가 지나도록 서버가 못 따라오면 더는 우기지
//   않고 서버의 실제 값을 그대로 인정한다(+콘솔에 경고 남김, 진단용).
let _pendingPackMoves = {}; // invoice -> { stage:'moved'|'taken', ts:Number }
const PENDING_PACK_MAX_MS = 30000; // 이 시간 넘도록 서버가 확인 안 해주면 서버 값을 신뢰

// ★ 2026-08-14 신규 — 패킹존 이동 상태가 서버와 30초 넘게 안 맞을 때 눈에 보이게 알림.

// ★ 2026-08-04 신규 — 슬롯의 현재 패킹 단계: none(초록) / moved(핑크) / taken(파랑)
function packStageOf(slot){
  return slot.takenOut ? 'taken' : slot.movedToPacking ? 'moved' : 'none';
}

// ★ 2026-07-23 신규 — "패킹존 이동" 체크박스 토글. clearSlot(슬롯비우기)과 무관한
// 순수 표시용 상태 변경이라, 서버에 저장만 하고 슬롯 재배정 로직은 전혀 안 건드림.
// ★ 2026-08-04 확장 — 2단계(초록↔핑크 토글)에서 3단계로 확장:
//   초록(완료) →클릭→ 핑크("패킹존 이동 필요" = 출고팀이 가져가야 함)
//   →클릭→ 파랑("패킹존 이동 완료" = 출고팀이 실제로 가져감) — ★ 기존 의미 그대로
//   서버에는 stage('moved'|'taken')로 전달 — 기존 setPackingMoved op를 확장한 것이라
//   Code.gs 라우팅 수정 없이 동작. (moved 파라미터만 보내는 옛 클라이언트도 계속 호환됨)
// ★ 2026-08-24 재설계(오출고 방지) — 파랑(taken) 상태에서 한 번 더 누르는 동작은
//   이제 이 함수를 거치지 않고(document click 위임에서 먼저 가로채서) 대신
//   "최종 2차 검증" 모달을 엶. 이 함수는 오직 none→moved, moved→taken 두 전진
//   방향만 담당 — 아래 cur==='taken' 되돌리기 확인 분기는 이 함수가 그 상태로
//   호출되는 경로가 없어져서 사실상 도달 불가능하지만, 혹시 모를 예외적 호출
//   경로에 대비해 안전장치로 그대로 남겨둠(제거해도 되지만 방어적으로 유지).
async function togglePackingMoved(invoice){
  const slot = _slotsByInvoice[invoice];
  if(!slot) return;
  const cur = packStageOf(slot);
  const next = (cur === 'none') ? 'moved' : (cur === 'moved') ? 'taken' : 'moved';
  // ★ 2026-08-14 신규(매니저 요청) — 파랑("이동 완료" = 출고팀이 실제로 가져감)
  //   상태에서 그 자리를 한 번 더 누르면 아무 확인 없이 조용히 핑크로 되돌아갔음.
  //   TV가 터치스크린이라 지나가던 사람이 스치듯 건드리거나 확인차 한 번 더
  //   눌러도 그대로 취소돼버린 사고가 실제로 있었음(8/12). "이미 출고 완료로
  //   표시된 걸 취소"하는 방향만 확인을 받고, 앞으로 진행하는 방향(초록→핑크,
  //   핑크→블루)은 지금처럼 그대로 바로 처리되게 둠.
  if(cur === 'taken'){
    if(!confirm(`정말 되돌리시겠습니까?\n\n"${slot.customer || invoice}"는 이미 출고팀이 가져간 것으로(블루) 표시돼 있습니다.\n다시 누르면 "이동 필요"(핑크) 상태로 돌아가서, 출고팀이 다시 가져가야 하는 것처럼 보이게 됩니다.`)) return;
  }
  const prevMoved = slot.movedToPacking, prevTaken = slot.takenOut;
  _pendingPackMoves[invoice] = { stage: next, ts: Date.now() }; // ★ 폴링이 이 값을 되돌리지 못하게 보류 등록(만료시간 포함)
  slot.movedToPacking = true;               // moved/taken 둘 다 "이동 표시는 켜진" 상태
  slot.takenOut = (next === 'taken');
  renderBoard(Object.values(_slotsByInvoice)); // 낙관적 갱신 — 서버 응답 기다리지 않고 즉시 화면 반영
  // ★ 2026-08-18 신규 — 배치 막바지에 여러 슬롯이 짧은 시간 안에 몰려서 눌리면,
  //   서버 쪽 문서 락 경합으로 첫 시도가 "일시적으로" 실패하는 경우가 있었음
  //   (32개가 거의 동시에 완료되며 실제로 발생). 곧바로 초록으로 되돌리지 않고,
  //   짧은 간격을 두고 최대 2번 더 자동 재시도한 뒤에도 계속 실패해야만
  //   원래 값으로 되돌림 — 대부분의 일시적 경합은 재시도 안에서 조용히 복구됨.
  let res = await gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: next });
  for(let attempt = 1; !res.ok && attempt <= 2; attempt++){
    await new Promise(r => setTimeout(r, 1200 * attempt)); // 1.2초, 2.4초 대기 후 재시도
    res = await gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: next });
  }
  if(!res.ok){
    console.warn('⚠ setPackingMoved 재시도 후에도 실패:', invoice, res.error);
    delete _pendingPackMoves[invoice]; // 실패 시 보류 해제하고 원상복구
    slot.movedToPacking = prevMoved;
    slot.takenOut = prevTaken;
    renderBoard(Object.values(_slotsByInvoice));
  }
  // 성공 시엔 _pendingPackMoves를 여기서 지우지 않음 — 다음 폴링이 서버 값을 읽어와서
  // 이 값과 실제로 일치하는 걸 renderBoard 안에서 확인하는 순간 자동으로 정리됨.
  // 이렇게 해야 폴링 타이밍과 무관하게 항상 정확한(그리고 절대 되돌아가지 않는) 화면 유지.
}

function cardHtml(slot){
  if(!slot){
    return `<div class="card"><div class="card-empty">비어있음</div></div>`;
  }
  // ★ 2026-07-23 신규 — 예전엔 여기서 slot.totalQty(이슈 반영 전 원래 수량)를 분모로
  //   썼는데, 완료(초록) 판정 자체는 서버가 effectiveTotal(이슈로 빠진 수량 뺀 실제
  //   필요수량) 기준으로 이미 계산해서 보내주고 있어서, "초록불인데 숫자는 100%가
  //   아닌" 것처럼 보이거나 batch.html(웹)과 분모 숫자가 서로 달라 혼란스러웠음.
  //   이제 TV도 effectiveTotal을 분모로 써서 웹과 항상 같은 숫자를 보여줌.
  const target = (slot.effectiveTotal !== undefined && slot.effectiveTotal !== null) ? slot.effectiveTotal : slot.totalQty;
  const pct = target > 0 ? Math.min(100, slot.scanned / target * 100) : 0;
  const flashClass = (prevStatus[slot.slotNum] && prevStatus[slot.slotNum] !== 'done' && slot.status === 'done') ? ' flash' : '';
  const numLabel = /^\d+$/.test(String(slot.slotNum)) ? String(slot.slotNum).padStart(2,'0') : String(slot.slotNum);
  // ★ 2026-07-16 신규: 이슈(EXP/NF/Damaged/OOS)가 하나라도 있으면 뱃지 표시.
  //   클릭하면 어떤 바코드가 몇 개 빠졌는지 상세 목록 팝업.
  const issueBadge = slot.issueQty > 0
    ? `<span class="card-issue-badge" data-invoice="${slot.invoice}">⚠ ${slot.issueQty.toLocaleString()}</span>`
    : '';
  // ★ 2026-08-24 신규(오출고 방지 재설계) — 초록/핑크/파랑의 기존 의미와 전환
  //   방식은 절대 안 바꿈(takenOut = "패킹존으로 물리적으로 가져감", 원래 그대로).
  //   주황(verified)은 파랑 위에 "얹는" 마지막 단계일 뿐 — 클래스도 taken은
  //   그대로 유지하고 verified만 추가로 붙여서 색만 오버라이드함.
  const packStage = slot.packVerified ? 'verified' : (slot.takenOut ? 'taken' : slot.movedToPacking ? 'moved' : 'none');
  const verifiedClass = slot.packVerified ? ' verified' : '';
  let packLabel = '검수완료 · 이동준비';
  if(packStage === 'moved') packLabel = '패킹존 이동 필요';
  else if(packStage === 'taken') packLabel = '패킹존 이동 완료'; // ★ 2026-08-24 원복 — 원래 짧은 문구 그대로(길게 붙였다가 카드 높이가 들쭉날쭉해져서 레이아웃이 깨졌음). 2차 검증은 눌러보면 바로 알 수 있음.
  else if(packStage === 'verified') packLabel = '최종 2차 검증완료'; // ★ 짧은 한글 라벨로 변경(영문 긴 문구도 같은 문제 유발)
  return `<div class="card ${slot.status}${slot.takenOut?' taken':slot.movedToPacking?' moved':''}${verifiedClass}${flashClass}" data-invoice="${slot.invoice}">
    <div class="card-top">
      <span class="card-slot">${numLabel}</span>
      <div class="card-top-right">
        ${issueBadge}
        <span class="card-ship ${shipClass(slot.shipVia)}">${shipLabel(slot.shipVia)}</span>
      </div>
    </div>
    <div class="card-cust">${slot.customer || ''}</div>
    <div class="card-invoice">${slot.invoice || ''}</div>
    <div class="card-bottom">
      <div class="card-metarow">
        <span class="card-sku">SKU ${slot.doneSku||0}/${slot.totalSku||0}</span>
        <span>${slot.scanned.toLocaleString()} / ${target.toLocaleString()} pcs</span>
      </div>
      <div class="card-bar"><div style="width:${pct}%"></div></div>
      <div class="card-pack-check" data-pack-invoice="${slot.invoice}" data-pack-stage="${packStage}">
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></span>
        <span class="label">${packLabel}</span>
      </div>
    </div>
  </div>`;
}

// ★ 2026-07-16 신규 — 이슈 뱃지 클릭 시 상세 팝업
const ISSUE_REASON_OPTS = [
  {v:'EXP', label:'EXP · 유통기한'}, {v:'NF', label:'NF · 재고없음'},
  {v:'DMG', label:'DMG · 파손'}, {v:'OOS', label:'OOS · 품절'},
  {v:'SKUMIS', label:'SKUMIS · SKU 불일치'},
  // ★ 2026-07-24 신규 — 실제로는 정상 출고됐는데 작업자가 스캔만 깜빡한 경우.
  //   진짜 결품/품질 문제와 헷갈리지 않게 별도 사유로 구분.
  {v:'MISS', label:'MISS · 스캔 누락(실제 출고됨)'},

  //   요청하는 경우. 이미 피킹은 됐지만 출고는 안 되고 회수(go-back)해야
  //   하는 물건이라, 다른 사유들과 동일하게 필요수량에서 제외됨.
  {v:'CANC', label:'CANC · 세일즈 취소요청(피킹 후 회수)'},
];
// ★ 2026-07-23 신규 — 배치 전체 아이템(고객사별 SKU 목록)을 한 번만 받아서 캐싱.
//   "새 이슈 등록" 폼의 SKU 드롭다운을 채우는 데만 씀 (진행률 폴링과는 별개).
let _batchItemsCache = { batchId: null, byInvoice: {} };
// ★ 2026-07-24 신규 — "작업자(발견자)"를 직접 타이핑하지 않고, 이미 등록된
// 작업자 명단(batch.html "Workers" 탭에서 관리하는 것과 동일한 명단)에서
// 골라 쓰도록 함. 오타 방지 + 나중에 KPI 집계할 때 이름이 정확히 일치하게.
let _workersCache = null; // null=아직 안 불러옴, [] 이상은 불러온 것
async function ensureWorkersLoaded(){
  if(_workersCache !== null) return; // 이미 한 번 불러왔으면 재사용 (배치 중 자주 안 바뀜)
  // ★ 2026-08-19 수정(현장 확인) — 재시도까지 다 실패했을 때 빈 배열을 그대로
  //   캐싱해버리면, _workersCache가 null이 아니게 되어 이후로 다시는 재시도를
  //   안 함(서버가 나중에 정상으로 돌아와도 영구히 "작업자 없음" 상태로 고정됨).
  //   실패했을 땐 캐싱하지 않고 그대로 둬서, 다음에 모달을 열 때 다시 시도되게 함.
  try{
    const res = await gasQueryWithRetry('getBatchWorkers', {});
    if(res.ok && Array.isArray(res.workers)){
      _workersCache = res.workers;
    }
  }catch(e){ /* 캐싱 안 함 — 다음 시도에서 재조회 */ }
}
let _newIssueItemsSorted = []; // ★ 2026-07-24 신규: 검색창 필터링을 위해 정렬된 전체 목록을 따로 보관

// ★ 2026-07-24 신규 — SKU를 상품명보다 앞에 표시(요청사항). items는 이미 SKU
// 알파벳순으로 정렬되어 들어온다고 가정(renderIssueModalBody에서 정렬).
function renderSkuOptionsHtml(items){
  if(!items.length) return '<option>상품 목록을 불러올 수 없습니다</option>';
  return items.map(it => {
    const st = _invoiceItemStatusByBarcode[String(it.barcode)+'|'+String(it.sku)];
    let statusTxt = `${it.req_qty}pcs`;
    let prefix = '';
    let color = ''; // ★ 2026-07-24 신규: 부족/이슈처리/완료를 색으로도 구분(빨강=부족, 눈에 확 띄게)
    if(st){
      const short = (st.short != null) ? st.short : Math.max(0, (st.reqQty||0) - (st.scannedQty||0) - (st.issueQty||0));
      const issueQty = st.issueQty || 0;
      if(short > 0){
        statusTxt = `⚠ ${st.scannedQty||0}/${st.reqQty||it.req_qty} · 미스캔(${short}개) → 실물 찾아 스캔하세요`;
        prefix = '⚠ ';
        color = '#FF4D6D'; // 빨강 — 아직 스캔 안 된, 진짜 확인이 필요한 상품
      } else if(issueQty > 0){
        // ★ 2026-07-24 신규 — 스캔이 아니라 이슈(EXP 등)로 필요수량이 이미 채워진
        //   경우를 "완료"와 구분해서 명확히 보여줌 (계속 헷갈렸던 부분)
        statusTxt = `✓ 이슈로 처리됨(${issueQty}pcs)`;
        prefix = '✓ ';
        color = '#F59E0B'; // 앰버 — 스캔은 아니지만 이슈로 이미 결론난 상품
      } else {
        statusTxt = `✓ 완료`;
        prefix = '✓ ';
        color = '#6B8F87'; // 차분한 초록 — 정상 스캔 완료(눈에 안 띄어도 됨, 이미 끝난 것)
      }
    }
    const styleAttr = color ? ` style="color:${color};${color==='#FF4D6D'?' font-weight:800;':''}"` : '';
    return `<option value="${it.barcode}" data-name="${String(it.name||'').replace(/"/g,'&quot;')}" data-sku="${it.sku||''}"${styleAttr}>${prefix}${it.sku || '(SKU없음)'} · ${it.name} · ${statusTxt}</option>`;
  }).join('');
}
// ★ 2026-07-24 신규 — 검색창에 입력할 때마다 SKU/상품명/바코드 전체를 대상으로
// 실시간 필터링(가장 정확한 건 SKU라고 안내드렸지만, 못 외운 경우 대비 전체 검색).
function filterNewIssueSkuOptions(query){
  const sel = document.getElementById('newIssueSku');
  if(!sel) return;
  const q = (query || '').trim().toLowerCase();
  const filtered = !q ? _newIssueItemsSorted : _newIssueItemsSorted.filter(it =>
    String(it.sku||'').toLowerCase().includes(q) ||
    String(it.name||'').toLowerCase().includes(q) ||
    String(it.barcode||'').toLowerCase().includes(q)
  );
  sel.innerHTML = filtered.length ? renderSkuOptionsHtml(filtered) : '<option>검색 결과 없음</option>';
}
async function ensureBatchItemsLoaded(){
  if(_batchItemsCache.batchId === currentBatchId) return; // 이미 이 배치 걸로 캐싱됨
  // ★ 2026-08-19 수정(현장 확인) — 실패해도 그대로 캐싱해버려서, 서버가 나중에
  //   정상으로 돌아와도 "상품 목록을 불러올 수 없습니다"가 영구히 고정되던 문제.
  //   재시도 적용 + 실패 시엔 캐싱하지 않아서 다음번엔 다시 시도되게 함.
  const res = await gasQueryWithRetry('getBatch', { batchId: currentBatchId });
  if(!res.ok) return; // 캐싱 안 함 — 다음 호출에서 재조회
  const byInvoice = {};
  if(Array.isArray(res.customers)){
    res.customers.forEach(c => { byInvoice[c.invoice] = c.items || []; });
  }
  _batchItemsCache = { batchId: currentBatchId, byInvoice };
}

async function submitNewIssueFromBoard(){
  const invoice = _issueModalInvoice;

  const skuSel = document.getElementById('newIssueSku');

  const name = opt ? opt.dataset.name : '';
  const sku = opt ? opt.dataset.sku : '';
  const reason = document.getElementById('newIssueReason').value;
  const qty = parseInt(document.getElementById('newIssueQty').value, 10);
  const workerSel = document.getElementById('newIssueWorker').value;
  const worker = (workerSel === '__manual__')
    ? document.getElementById('newIssueWorkerManual').value.trim()
    : workerSel.trim();
  const note = document.getElementById('newIssueNote').value.trim();

  if(!barcode){ alert('상품을 선택하세요'); return; }
  if(!qty || qty < 1){ alert('수량을 정확히 입력해주세요'); return; }
  if(!worker){ alert('작업자(발견자)를 입력해주세요'); return; }

  const btn = document.getElementById('newIssueSubmitBtn');
  btn.disabled = true; btn.textContent = '등록 중...';
  const res = await gasCall('logIssue', {
    batchId: currentBatchId, worker: worker,
    barcode: barcode, sku: sku, name: name,
    invoice: invoice, customer: slot.customer,
    reason: reason, qty: qty, note: note,
  });
  if(res.ok){
    // ★ 2026-08-21 긴급 신규 — 근본 원인 수정: 예전엔 등록 성공해도 아무 알림이
    //   없어서, 작업자가 "등록이 안 됐나?"하고 헷갈려 같은 내용을 처음부터 다시
    //   반복 입력하는 사고가 실제로 발생함(같은 이슈가 짧은 시간에 2~3번 중복
    //   등록됨). 이제 성공 시 눈에 띄는 초록색 알림을 잠깐 띄워서 명확히 알려줌.
    //   (서버 쪽에도 이중 안전장치로 최근 2분 내 완전 동일 이슈는 자동으로
    //   걸러내도록 별도 추가함 — logIssue 참고)
    showIssueToast(res.duplicate ? '이미 등록된 이슈입니다 (중복 방지됨)' : '✓ 이슈가 등록되었습니다', res.duplicate ? 'warn' : 'ok');
    await pollOnce();
    if(_issueModalInvoice) renderIssueModalBody();
  } else {
    btn.disabled = false; btn.textContent = '⚠ 이슈 등록';
    alert('등록 실패: ' + (res.error || '알 수 없는 오류'));
  }
}
// ★ 2026-08-21 신규 — 이슈 등록 성공/중복 알림용 간단 토스트
function showIssueToast(msg, type){
  let t = document.getElementById('issueToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'issueToast';
    t.style.cssText = 'position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px); z-index:99999; padding:12px 22px; border-radius:999px; font-size:14px; font-weight:700; white-space:nowrap; box-shadow:0 8px 28px rgba(0,0,0,0.5); opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = type === 'warn' ? '#3a2a10' : '#0f2e1a';
  t.style.border = type === 'warn' ? '1px solid #d97706' : '1px solid #22c55e';
  t.style.color = type === 'warn' ? '#fbbf24' : '#4ade80';
  requestAnimationFrame(() => {
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
  });
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2600);
}

//   필요수량에 포함되어(완료 판정에서 다시 빠짐), 현황판이 정확한 상태로 갱신됨.
async function deleteIssueFromBoard(issueId, idx){
  if(!confirm('이 이슈를 완전히 취소하시겠습니까?\n다시 이 고객사의 필요수량에 포함되어 완료 처리되지 않은 상태로 돌아갑니다.\n(수량/사유만 고치려면 "닫기"를 누르고 값을 수정한 뒤 저장하세요)')) return;
  const delBtn = document.querySelector(`.issue-edit-delete[data-idx="${idx}"]`);
  delBtn.disabled = true;
  delBtn.textContent = '취소하는 중...';
  const res = await gasCall('undoIssue', { issueId });
  if(res.ok){
    await pollOnce(); // 최신 상태 즉시 반영
    if(_issueModalInvoice) renderIssueModalBody(); // 모달도 최신 목록으로 다시 그림(이 건은 빠짐)
  } else {
    delBtn.disabled = false;
    delBtn.textContent = '🗑 이 이슈 전체 취소(삭제)';
    alert('취소 실패: ' + (res.error || '알 수 없는 오류'));
  }
}

/* ═══════════════════════════════════════════════════════════
 * ★ 2026-08-24 신규 — 패킹 검증 모달(오출고 방지 핵심 기능)
 * 검수(ScanLog)와 완전히 별개로, 패킹존에서 실제 물건을 바코드로 한 번 더
 * 확인한다. 서버(logPackScan)가 "이 인보이스 것이 맞는지/이미 다 찼는지"를
 * 즉시 판정해서 돌려주고, 100% 다 맞아야만(또는 관리자 강제확정) 파랑(출고
 * 가능)으로 넘어갈 수 있게 서버가 직접 막는다(setPackingMoved 참고).
 * ═══════════════════════════════════════════════════════════ */
let _packModalInvoice = null;
let _packModalState = null;
let _packAudioCtx = null;

async function openPackVerifyModal(invoice){
  const slot = _slotsByInvoice[invoice];
  if(!slot) return;
  // ★ 2026-08-24 신규 — 이 모달은 반드시 파랑(패킹존 이동완료) 이후에만 열려야 함.
  //   (문서 click 위임에서 이미 taken 상태일 때만 호출하지만, 방어적으로 한 번 더 확인)
  if(!slot.takenOut){ alert('먼저 패킹존 이동(파랑) 표시부터 완료해주세요'); return; }
  _packModalInvoice = invoice;
  _packModalState = null;
  document.getElementById('packModalTitle').textContent = `${slot.customer || invoice} · 최종 2차 검증`;
  document.getElementById('packModalSub').textContent = `${invoice} · SLOT ${slot.slotNum}`;
  document.getElementById('packModalBody').innerHTML = `<div class="issue-modal-empty">불러오는 중...</div>`;
  document.getElementById('packModalMsg').style.display = 'none';
  document.getElementById('packCompleteBtn').disabled = true;
  document.getElementById('packCompleteBtn').textContent = '🟠 최종 2차 검증완료 확정';
  document.getElementById('packModalOverlay').classList.add('open');
  await ensureWorkersLoaded();
  populatePackWorkerSelect();
  const input = document.getElementById('packScanInput');
  input.value = '';
  setTimeout(() => input.focus(), 60);
  await refreshPackModalState();
}

function populatePackWorkerSelect(){
  const sel = document.getElementById('packWorkerSelect');
  const opts = (_workersCache && _workersCache.length)
    ? _workersCache.map(w => `<option value="${w.name}">${w.name}</option>`).join('')
    : '<option value="">등록된 작업자 없음</option>';
  sel.innerHTML = opts + '<option value="__manual__">✎ 명단에 없음 — 직접 입력</option>';
}
function currentPackWorker(){
  const sel = document.getElementById('packWorkerSelect').value;
  if(sel === '__manual__') return document.getElementById('packWorkerManual').value.trim();
  return (sel || '').trim();
}

async function refreshPackModalState(){
  const invoice = _packModalInvoice;
  if(!invoice) return;
  const res = await gasQueryWithRetry('getPackScanState', { batchId: currentBatchId, invoice });
  if(!res.ok){
    document.getElementById('packModalBody').innerHTML = `<div class="issue-modal-empty">불러오기 실패: ${res.error||''}</div>`;
    return;
  }
  _packModalState = res;
  renderPackModalBody();
}

function renderPackModalBody(){
  const state = _packModalState;
  if(!state || _packModalInvoice === null) return;
  const pct = state.totalReq > 0 ? Math.min(100, Math.round(state.totalPacked / state.totalReq * 100)) : 0;
  document.getElementById('packProgressText').textContent = `${state.totalPacked.toLocaleString()} / ${state.totalReq.toLocaleString()} pcs`;
  document.getElementById('packProgressBar').style.width = pct + '%';
  document.getElementById('packCompleteBtn').disabled = !state.complete;

  const linesHtml = (state.lines || []).map(l => `
    <div class="pack-line ${l.complete ? 'done' : ''}">
      <div>
        <div class="pack-line-name">${l.name || l.sku}</div>
        <div class="pack-line-meta">${l.sku} · 바코드 ${l.barcode}${l.issueQty > 0 ? ` · 이슈차감 ${l.issueQty}` : ''}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="pack-line-qty">${l.packed}/${l.effectiveReq}</span>
        <span class="pack-line-check">${l.complete ? '✅' : '⏳'}</span>
      </div>
    </div>`).join('') || `<div class="issue-modal-empty">이 인보이스에 등록된 상품이 없습니다</div>`;

  const activeHistory = (state.history || []).filter(h => h.status !== 'undone');
  const historyHtml = activeHistory.length ? `
    <div class="pack-history-toggle" onclick="const b=this.nextElementSibling; b.style.display = b.style.display==='none' ? 'block' : 'none';">▾ 스캔 이력 보기 (${activeHistory.length}건)</div>
    <div style="display:none;">
      ${activeHistory.slice(0, 30).map(h => `
        <div class="pack-history-row ${h.result !== 'pass' ? h.result : ''}">
          <span>${(h.time||'').slice(5,16)} · ${h.worker||'-'} · 바코드 ${h.barcode}${h.result==='wrong'?' (다른 고객사 물건)':h.result==='over'?' (중복)':''}${h.qty>1?' x'+h.qty:''}</span>
          <span class="pack-history-undo" onclick="undoPackScanEntry('${h.packScanId}')">되돌리기</span>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('packModalBody').innerHTML = linesHtml + historyHtml;
}

async function submitPackScan(){
  const input = document.getElementById('packScanInput');
  const barcode = input.value.trim();
  if(!barcode) return;
  input.value = '';
  const worker = currentPackWorker();
  if(!worker){ alert('작업자를 먼저 선택하세요'); input.focus(); return; }
  // ★ 2026-08-24 재설계 — qty를 더 이상 클라이언트가 보내지 않음. 서버가
  //   "이 바코드에 남은 필요수량 전체"를 알아서 계산해서 한 번에 채움
  //   (스캔 1번 = 그 상품 전체 수량 확인, 실제 물류 현장 표준 방식).
  const res = await gasCall('logPackScan', { batchId: currentBatchId, invoice: _packModalInvoice, worker, barcode });
  if(!res.ok){
    flashPackModal('bad'); beepPack(false);
    showPackModalMsg('오류: ' + (res.error || '알 수 없는 오류'), 'bad');
    input.focus();
    return;
  }
  if(res.result === 'pass'){
    flashPackModal('ok'); beepPack(true);
    showPackModalMsg(`✓ ${res.name || res.sku || barcode} ${(res.filled||0).toLocaleString()}개 확인됨`, 'ok');
  } else if(res.result === 'wrong'){
    flashPackModal('bad'); beepPack(false);
    const owners = (res.ownerInvoices && res.ownerInvoices.length) ? res.ownerInvoices.join(', ') : '알 수 없음';
    showPackModalMsg(`🚫 이 물건은 이 고객사 것이 아닙니다! → 실제로는 [${owners}] 것입니다. 상자에서 빼주세요.`, 'bad');
  } else if(res.result === 'over'){
    flashPackModal('bad'); beepPack(false);
    showPackModalMsg(res.note === 'excluded' ? '⚠ 이 상품은 이슈 처리되어 이제 필요수량이 없습니다' : '⚠ 이미 확인 완료된 상품입니다 (중복 스캔)', 'bad');
  }
  await refreshPackModalState();
  input.focus();
}

function flashPackModal(kind){
  const el = document.getElementById('packModalFlash');
  el.className = 'pack-modal-flash show-' + kind;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'pack-modal-flash'; }, 350);
}
function showPackModalMsg(msg, kind){
  const el = document.getElementById('packModalMsg');
  el.textContent = msg;
  el.className = 'pack-modal-msg ' + kind;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 4000);
}
// ★ 외부 오디오 파일 없이 WebAudio로 즉석 생성 — 성공(높은 짧은음) / 실패(낮은 두번음)
function beepPack(ok){
  try{
    const ctx = _packAudioCtx || (_packAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
    function tone(freq, start, dur){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.02);
    }
    if(ok){ tone(1200, 0, 0.12); } else { tone(280, 0, 0.16); tone(280, 0.19, 0.16); }
  }catch(e){ /* 오디오 실패해도 스캔 자체엔 지장 없음 */ }
}

async function undoPackScanEntry(packScanId){
  if(!confirm('이 스캔을 취소하시겠습니까?')) return;
  const res = await gasCall('undoPackScan', { packScanId });
  if(res.ok) await refreshPackModalState();
  else alert('취소 실패: ' + (res.error || '알 수 없는 오류'));
}

async function completePackVerify(){
  const invoice = _packModalInvoice;
  if(!invoice) return;
  const btn = document.getElementById('packCompleteBtn');
  btn.disabled = true; btn.textContent = '처리 중...';
  const res = await gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: 'verified' });
  if(res.ok){
    showPackModalMsg('🟣 최종 2차 검증완료 — 보라 상태로 전환됐습니다', 'ok');
    await pollOnce();
    printPackingSlip();
    setTimeout(() => closePackVerifyModal(), 900);
  } else {
    btn.disabled = false; btn.textContent = '🟣 최종 2차 검증완료 확정';
    alert('전환 실패: ' + (res.error || '알 수 없는 오류'));
    await refreshPackModalState();
  }
}

async function forceCompletePackVerify(){
  const invoice = _packModalInvoice;
  if(!invoice) return;
  if(!confirm('⚠ 검증이 끝나지 않았는데 관리자 권한으로 강제로 "최종 2차 검증완료"로 넘기시겠습니까?\n\n이 동작은 오출고 방지 안전장치를 우회하는 것이므로, 실물을 이미 직접 확인한 경우에만 사용하세요.')) return;
  const res = await gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: 'verified', force: true });
  if(res.ok){
    showPackModalMsg('⚠ 관리자 강제확정으로 최종 검증완료 처리됐습니다', 'warn');
    await pollOnce(); // ★ slot.packVerified를 최신으로 받아와야 슬립에 정확한 상태가 찍힘
    printPackingSlip(); // ★ 2026-08-24 버그 수정 — 강제확정 때는 슬립 인쇄가 아예 빠져있었음
    setTimeout(() => closePackVerifyModal(), 900);
  } else {
    alert('처리 실패: ' + (res.error || '알 수 없는 오류'));
  }
}

function closePackVerifyModal(){
  document.getElementById('packModalOverlay').classList.remove('open');
  _packModalInvoice = null;
  _packModalState = null;
}

  //   (이슈 모달을 열지 않고 그 자리에서 바로 토글) — 카드 클릭 판정보다 먼저 처리.

    // ★ 2026-08-24 신규(오출고 방지 재설계) — 기존 약속(초록→핑크→파랑)은 절대
    //   안 바꿈: none→moved, moved→taken은 지금까지와 완전히 동일하게 클릭 한 번에
    //   즉시 전환(togglePackingMoved 그대로). 파랑(taken) 상태에서 한 번 더 누르면
    //   더 이상 곧장 핑크로 안 돌아가고, "최종 2차 검증" 모달이 열림 — 이 모달
    //   안에서 100% 스캔 확인이 끝나야만 주황(verified, 최종)으로 넘어감.
    //   주황 상태에서 누르면(실수 정정용) 파랑으로 되돌리는 확인창만 뜸.
    if(slot.packVerified){

      gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: 'taken' }).then(res => {
        if(res.ok) pollOnce();
        else alert('되돌리기 실패: ' + (res.error || '알 수 없는 오류'));
      });
      return;
    }
    if(packStageOf(slot) === 'taken'){ openPackVerifyModal(invoice); return; }
    togglePackingMoved(invoice); // none→moved, moved→taken은 기존 그대로

  const deleteBtn = e.target.closest('.issue-edit-delete');

  const newIssueBtn = e.target.closest('#newIssueSubmitBtn');
  if(newIssueBtn){ submitNewIssueFromBoard(); return; }
  if(e.target.id === 'issueModalOverlay') closeIssueModal();
});

function renderBoard(slots, fromPoll){
  const board = document.getElementById('board');
  // ★ 2026-07-16 신규: 이슈 뱃지 클릭 시 참조할 수 있도록 invoice 기준으로 캐싱
  _slotsByInvoice = {};
  (slots || []).forEach(s => {
    if(!s.invoice) return;
    // ★ 2026-07-28 신규 — 보류중인 패킹존 이동 값이 있으면(방금 클릭해서 서버에
    //   저장 요청을 보냈지만 아직 반영 안 됐을 수 있는 경우), 실제 서버 폴링
    //   데이터(fromPoll=true)일 때만 비교해서 정리함. 클릭 직후 자체 낙관적
    //   재렌더링(fromPoll 없음)에서는 절대 여기서 지우지 않음 — 그 호출은 항상
    //   방금 세팅한 값 그대로라 비교하면 즉시(너무 이르게) 지워져버리기 때문.
    // ★ 2026-08-04 확장 — boolean 대신 3단계(stage) 값으로 비교 (moved/taken)
    if(fromPoll && Object.prototype.hasOwnProperty.call(_pendingPackMoves, s.invoice)){
      const serverStage = s.takenOut ? 'taken' : s.movedToPacking ? 'moved' : 'none';
      const pendingEntry = _pendingPackMoves[s.invoice];
      const pending = pendingEntry.stage;
      const age = Date.now() - pendingEntry.ts;
      if(serverStage === pending){
        delete _pendingPackMoves[s.invoice]; // 서버가 따라옴 — 정상 종료
      } else if(age > PENDING_PACK_MAX_MS){
        // ★ 2026-08-14 신규 — 30초가 지나도록 서버가 이 값을 확인해주지 않음.
        //   저장이 실패했거나 나중에 다른 이유로 지워진 것 — 더는 우기지 않고
        //   서버의 실제 값을 그대로 인정한다(s.movedToPacking/s.takenOut을 안 건드림).
        console.warn('⚠ 패킹존 이동 상태 동기화 실패 — 서버 값으로 되돌림:', s.invoice, '기대값:', pending, '실제값:', serverStage);
        showSyncFailToast(s.customer || s.invoice);
        delete _pendingPackMoves[s.invoice];
      } else {
        s.movedToPacking = (pending !== 'none');
        s.takenOut = (pending === 'taken');
      }
    }
    _slotsByInvoice[s.invoice] = s;
  });
  if(!slots || slots.length === 0){
    board.innerHTML = `<div class="empty-state"><h2>오늘의 배치를 기다리는 중...</h2><p>슬롯이 배정되면 여기 자동으로 표시됩니다</p></div>`;
    return;
  }
  const large = slots.filter(s => s.slotNum <= 15).sort((a,b) => a.slotNum - b.slotNum);
  const small = slots.filter(s => s.slotNum > 15).sort((a,b) => a.slotNum - b.slotNum);

  let html = '';
  if(large.length){
    html += `<div class="zone-label">대량 오더 구역 · SLOT 01-15</div><div class="grid">`;
    for(let n=1; n<=15; n++){
      const s = large.find(x => x.slotNum === n);
      html += cardHtml(s);
    }
    html += `</div>`;
  }
  if(small.length){
    html += `<div class="zone-label">소량 오더 구역 · SLOT 16-30</div><div class="grid small">`;
    for(let n=16; n<=30; n++){
      const s = small.find(x => x.slotNum === n);
      html += cardHtml(s);
    }
    html += `</div>`;
  }

  // ★ 2026-07-13 신규: 30번을 초과하는 슬롯(31, 32... 또는 "임시A" 같은
  //   매니저 수동 배정 라벨)은 기존엔 TV 화면에서 통째로 누락됐음.
  //   고객사가 30개를 넘는 배치(예: 47개 고객사)에서 작업자가 31번째부터는
  //   TV로 확인할 방법이 아예 없던 문제 — 여기 세번째 구역으로 추가.
  const overflow = slots.filter(s => !(Number(s.slotNum) >= 1 && Number(s.slotNum) <= 30));
  overflow.sort((a,b) => String(a.slotNum).localeCompare(String(b.slotNum), undefined, {numeric:true}));
  if(overflow.length){
    html += `<div class="zone-label">추가 배정 구역 · 31번 이상 / 수동 배정 (${overflow.length}개)</div><div class="grid small">`;
    overflow.forEach(s => { html += cardHtml(s); });
    html += `</div>`;
  }

  board.innerHTML = html;

  // 완료 상태 기록 갱신 (다음 폴링에서 flash 판단용)
  const next = {};
  slots.forEach(s => { next[s.slotNum] = s.status; });
  prevStatus = next;
}

// ★ 2026-08-03 신규 — "다른 배치 조회"에서 배치를 고르면 즉시 pollOnce()를
// 한 번 더 부르는데(빠른 반영 목적), 이때 하필 그 직전에 시작된 "예전 배치
// 기준" 폴링 요청이 아직 응답을 안 받은 상태라면, 그 낡은 응답이 나중에
// 도착하면서 방금 고른 새 배치 화면을 예전 배치로 덮어써버리는 경쟁상태가
// 있었음(그래서 새 배치→예전 배치→다음 폴링에 다시 새 배치로 깜빡이는 것처럼
// 보였음). 매 polling마다 세대(generation) 번호를 매겨서, 응답이 왔을 때
// "그사이 더 최신 요청이 이미 시작됐으면" 그 낡은 응답은 화면에 반영하지
// 않고 조용히 버리도록 함.
let pollSeq = 0;
async function pollOnce(){
  const mySeq = ++pollSeq;
  try{
    if(!GAS_READY){
      document.getElementById('emptyMsg').textContent = 'CONFIG.GAS_URL이 설정되지 않았습니다';
      return;
    }
    // ★ 2026-07-23 신규: 매니저가 TV에서 직접 "다른 배치"를 골라 조회 중이면
    //   (manualBatchOverride) 활성 배치 자동 추적을 건너뛰고 그 배치만 고정 조회.
    //   이 모드는 다른 기기(작업자 폰 등)에는 전혀 영향을 주지 않는 TV 전용 조회.
    if(manualBatchOverride){
      currentBatchId = manualBatchOverride.batchId;
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot manual"></span>배치 ${currentBatchId} · ${manualBatchOverride.date}`;
    } else {
    // ★ 2026-07-23 신규: "오늘 배치"만 찾던 것을, 매니저가 서버에 기록해둔
    //   "활성 배치"를 우선 확인하도록 변경 — batch.html에서 매니저가 배치를
    //   새로 시작하거나 "이어서 작업하기"를 누르면 서버에 기록되는데, TV
    //   현황판도 그 기록을 그대로 따라감 (어제 배치든 오늘 배치든 무관).
    //   TV는 하루 종일 안 끄고 켜두는 경우가 많아서, 이미 배치를 하나 물고
    //   있어도 매 폴링(8초)마다 계속 재확인함 — 매니저가 중간에 다른 배치로
    //   전환하면 TV도 곧바로 자동으로 따라가게 하기 위함.
    // ★ 2026-08-11 속도 개선(매니저 지적) — 새로고침할 때마다 "연결 대기중..."이
    //   한참 이어지던 문제. 원인은 서버 왕복을 순서대로 기다렸기 때문:
    //     getActiveBatch → (없으면 getBatch → getOpenBatches) → getSlotProgress
    //   각 호출이 1~3초라 화면이 뜨기까지 최대 10초 가까이 걸렸음.
    //   → 마지막으로 본 배치 번호를 이 TV에 기억해두고, 새로고침 직후에는
    //     그 번호로 슬롯을 곧바로 불러와 화면을 먼저 채움. 활성 배치 확인은
    //     그다음에 이어서 하고, 배치가 바뀌었으면 그때 갱신함.
    if (BOOT_FAST && LAST_BATCH_ID){
      BOOT_FAST = false;
      currentBatchId = LAST_BATCH_ID;
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · 확인 중…`;
      // 슬롯을 먼저 그리고, 활성 배치 확인은 아래 폴링에서 이어감
      try{
        const fast = await gasQuery('getSlotProgress', { batchId: currentBatchId });
        if(mySeq === pollSeq && fast && fast.ok){
          document.getElementById('doneCount').textContent = `${fast.doneCount} / ${fast.totalCount}`;
          document.getElementById('doneBar').style.width =
            (fast.totalCount > 0 ? (fast.doneCount / fast.totalCount * 100) : 0) + '%';
          renderBoard(fast.slots, true);
        }
      }catch(e){ /* 실패해도 아래 정상 경로가 이어서 확인 */ }
    }
    const activeRes = await gasQuery('getActiveBatch', {});
    if(mySeq !== pollSeq) return; // ★ 신규: await 도중 더 최신 폴링이 시작됐으면 여기서 중단
    if(activeRes.ok && activeRes.batch && activeRes.batch.batchId !== currentBatchId){
      currentBatchId = activeRes.batch.batchId;
      rememberBatch(currentBatchId); // ★ 2026-08-11 — 다음 새로고침 때 즉시 띄우기 위해 기억
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · ${activeRes.batch.date}`;
    } else if(!currentBatchId){
      // 활성 배치 기록이 아직 없으면(아무도 안 정했으면) 예전처럼 오늘자 배치라도 확인
      const b = await gasQuery('getBatch', {});
      if(mySeq !== pollSeq) return; // ★ 신규
      if(!b.ok || !b.batch){
        // ★ 2026-08-04 신규 — batch.html에서 어제 적용한 것과 동일한 안전장치.
        //   활성 배치 기록도 없고 "오늘 생성된" 배치도 없으면(=날짜가 바뀐
        //   다음날 아침 등), 완료 안 된 배치가 정확히 1개뿐일 때만 자동으로
        //   그 배치를 TV에 띄움. 2개 이상이면 헷갈릴 수 있으니 절대 임의로
        //   고르지 않고 "진행중인 배치 없음"으로 두어 매니저가 다른 배치 버튼으로
        //   직접 고르게 함.
        let resolved = null;
        try{
          // ★ 2026-08-19 재수정(긴급) — 여기 재시도(gasQueryWithRetry)를 썼던 게
          //   오히려 서버 혼잡을 키운 원인으로 확인됨. 이 코드는 pollOnce() 안,
          //   즉 12초마다 자동으로 다시 실행되는 반복 폴링 경로라서, 그 안에서
          //   또 재시도(최대 3번)를 하면 혼잡한 순간에 요청이 3배로 늘어나며
          //   혼잡을 더 키우고 더 오래 끌게 만듦. 반복 폴링 경로는 "실패하면
          //   다음 폴링(12초 후)에 알아서 다시 시도된다"는 게 이미 보장돼
          //   있으므로, 여기서 자체 재시도는 불필요하고 오히려 해로움 — 일반
          //   호출로 되돌림. (사람이 직접 누르는 "다른 배치" 버튼 등은 반복
          //   폴링이 아니라서 재시도를 그대로 둠)
          const openRes = await gasQuery('getOpenBatches', {});
          if(mySeq !== pollSeq) return;
          // ★ 2026-08-05 신규 — getOpenBatches가 "완료된 지 1시간 안 된 배치"도
          //   같이 내려주므로, 이 자동표시 판단에서는 반드시 제외해야 함.
          const trulyOpen = (openRes.batches || []).filter(b => !b.recentlyCompleted);
          if(openRes.ok && trulyOpen.length === 1){
            resolved = trulyOpen[0];
          }
        }catch(e){ console.warn('미완료 배치 자동 확인 실패:', e); }
        if(!resolved){
          const dot0 = document.getElementById('liveDot');
          if(dot0) dot0.className = 'status-dot off';
          document.getElementById('batchLabel').innerHTML = '<span class="status-dot off"></span>진행중인 배치 없음';
          return;
        }
        currentBatchId = resolved.batchId;
        document.getElementById('batchLabel').innerHTML =
          `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · ${resolved.date}`;
      } else {
      currentBatchId = b.batch.batchId;
      rememberBatch(currentBatchId); // ★ 2026-08-11
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · ${b.batch.date}`;
      }
    }
    }

    const res = await gasQuery('getSlotProgress', { batchId: currentBatchId });
    if(mySeq !== pollSeq) return; // ★ 신규 — 핵심 가드: 이 응답이 도착하기 전에 더 최신 폴링(예: 방금 고른 다른 배치)이
                                  //   이미 시작됐다면, 이 낡은 응답은 절대 화면에 반영하지 않고 버림.
    if(!res.ok){
      const dot = document.getElementById('liveDot');
      if(dot) dot.className = 'status-dot off';
      return;
    }
    // ★ 2026-07-23 수정: manual 모드일 땐 batchLabel에 id='liveDot'인 도트가 없으므로
    //   (amber 'manual' 도트로 대체됨) null 체크 후 있을 때만 갱신.
    const dot = document.getElementById('liveDot');
    if(dot) dot.className = 'status-dot live';
    document.getElementById('doneCount').textContent = `${res.doneCount} / ${res.totalCount}`;
    document.getElementById('doneBar').style.width =
      (res.totalCount > 0 ? (res.doneCount / res.totalCount * 100) : 0) + '%';
    renderBoard(res.slots, true);
  }catch(e){
    // ★ 2026-07-17 신규: 폴링 중 예상 못한 오류가 나도 콘솔에만 남기고
    //   다음 8초 뒤 폴링은 그대로 이어지게 함(화면이 아예 멈추지 않도록)
    console.error('pollOnce failed:', e);
  }
}

pollOnce();
setInterval(pollOnce, POLL_MS);

// ★ 2026-08-13 신규(batch.html과 동일한 이유로 추가) — 이 TV 화면도 화면보호기/
//   디스플레이 절전, 원격 접속으로 다른 창을 보다 돌아오는 경우 등으로 브라우저
//   타이머가 늦어질 수 있음. 화면이 다시 보이는 즉시 강제로 한 번 더 갱신해서,
//   타이머가 알아서 돌아오길 기다리지 않게 함.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  console.log('👁 화면 복귀 감지 — 즉시 재동기화');
  pollOnce();
  if(typeof pollUnfulfilledAlerts === 'function' && GAS_READY && currentBatchId) pollUnfulfilledAlerts();
});

/* ═══════════════ ★ 2026-08-05 신규 — 미배분 경보 폴링 ═══════════════
 * "다른 고객사에겐 스캔됐는데 이 고객사만 완전히 0인" 패턴을 30초마다 확인.
 * 슬롯 진행률(pollOnce, 8초)보다 느리게 도는 이유: 이 조회는 배치 전체
 * BatchItems/ScanLog/IssueLog를 다 훑는 무거운 계산이라, 8초마다 돌리면
 * 서버 부담이 커짐 — 경보 성격상 30초 지연은 문제 없음.
 * ═══════════════════════════════════════════════════════════════ */
let _unfulfilledAlerts = [];
async function pollUnfulfilledAlerts(){
  if(!GAS_READY || !currentBatchId) return;
  try{
    const res = await gasQuery('getUnfulfilledSkuAlerts', { batchId: currentBatchId });
    if(!res.ok) return;
    _unfulfilledAlerts = res.alerts || [];
    const banner = document.getElementById('unfulfilledBanner');
    const text = document.getElementById('unfulfilledBannerText');
    if(_unfulfilledAlerts.length > 0){
      text.textContent = `미배분 제품 ${_unfulfilledAlerts.length}건 — 다른 고객사엔 이미 배분됐는데 이 제품만 빠짐 (클릭해서 확인)`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }catch(e){ console.error('pollUnfulfilledAlerts failed:', e); }
}
function renderUnfulfilledModal(){
  const body = document.getElementById('unfulfilledModalBody');
  if(_unfulfilledAlerts.length === 0){
    body.innerHTML = '<div class="unfulfilled-modal-note">현재 미배분 경보가 없습니다.</div>';
    return;
  }
  const rowsHtml = _unfulfilledAlerts.map(a => `
    <div class="unfulfilled-row">
      <div class="ur-top">
        <span>${a.customer || a.invoice} <span class="ur-slot">${a.slotNum ? '· 슬롯 ' + String(a.slotNum).padStart(2,'0') : ''}</span></span>
        <span>${a.reqQty}pcs 필요</span>
      </div>
      <div class="ur-meta">${a.sku} · ${a.name} · 바코드 ${a.barcode} · 인보이스 ${a.invoice}</div>
    </div>`).join('');
  body.innerHTML = `
    <div class="unfulfilled-modal-note">
      아래 제품들은 배치 안 <b>다른 고객사에게는 이미 정상적으로 스캔·배분됐지만</b>,
      나열된 고객사에는 스캔·이슈 기록이 전혀 없습니다. 실물 창고에 해당 상품이
      남아있는지 확인해 주세요.<br><br>
      · 재고가 있다면 → 마저 피킹해서 슬롯에 넣고 다시 스캔하면 정상 반영됩니다.<br>
      · 재고가 전혀 없다면(이미 다 나감) → 해당 슬롯 카드에서 "이슈 등록" →
      사유 <b>MISS·스캔 누락(실제 출고됨)</b>으로 등록하면 정산됩니다.
    </div>
    ${rowsHtml}`;
}
document.getElementById('unfulfilledBanner').addEventListener('click', () => {
  renderUnfulfilledModal();
  document.getElementById('unfulfilledModalOverlay').classList.add('show');
});
document.getElementById('btnCloseUnfulfilledModal').addEventListener('click', () => {
  document.getElementById('unfulfilledModalOverlay').classList.remove('show');
});
document.getElementById('unfulfilledModalOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'unfulfilledModalOverlay') document.getElementById('unfulfilledModalOverlay').classList.remove('show');
});
setTimeout(pollUnfulfilledAlerts, 2000); // 배치ID가 확정될 시간을 조금 준 뒤 첫 조회
setInterval(pollUnfulfilledAlerts, 45000); // ★ 2026-08-19 수정: 30초→45초(서버 부담 완화)

// ═══════════════════════════════════════════════════════════
// ★ 2026-07-23 신규 — TV "다른 배치 조회" 드롭다운
// ─────────────────────────────────────────────────────────────
// batch.html의 "⇄ 다른 배치"와 이름은 같지만 동작은 완전히 다름:
// 여기서 배치를 골라도 setActiveBatch를 호출하지 않으므로
// 작업자 폰/다른 TV 등 어떤 기기에도 영향을 주지 않는 순수 조회 전용.
// (완료 처리된 배치는 목록에 안 뜸 — getOpenBatches가 미완료 배치만 반환)
// ═══════════════════════════════════════════════════════════
document.getElementById('btnSwitchBatchTV').onclick = async (e) => {
  e.stopPropagation();
  const dd = document.getElementById('switchBatchDropdownTV');
  if(dd.classList.contains('open')){ dd.classList.remove('open'); return; }

  dd.innerHTML = `<div class="tb-switch-empty">불러오는 중...</div>`;
  dd.classList.add('open');

  const res = await gasQueryWithRetry('getOpenBatches', {});
  if(!res.ok){ dd.innerHTML = `<div class="tb-switch-empty" style="color:#FF4D6D">불러오기 실패</div>`; return; }
  const list = res.batches || [];
  if(!list.length){
    dd.innerHTML = `<div class="tb-switch-empty">조회 가능한 미완료 배치가 없습니다</div>`;
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  dd.innerHTML = list.map(b => {
    const isCurrent = manualBatchOverride ? b.batchId === manualBatchOverride.batchId : (!manualBatchOverride && b.batchId === currentBatchId);
    // ★ 2026-08-05 신규 — 완료된 지 1시간 안 된 배치는 "완료됨" 태그를 최우선으로
    //   보여줌(지금 보는 중이 아닌 한). 스캔 100% 끝난 직후 배치번호가 아무 표시
    //   없이 갑자기 목록에서 사라지던 것과 달리, 1시간 동안은 상태가 명확히
    //   보이다가 그 다음부터 목록에서 빠짐(서버 getOpenBatches가 그렇게 걸러줌).
    const tag = isCurrent
      ? `<span class="tb-sw-tag" style="background:var(--green-bg); color:var(--green)">지금 보는 중</span>`
      : b.recentlyCompleted
      ? (b.pendingTakeOut
          ? `<span class="tb-sw-tag" style="background:var(--pink-bg,rgba(236,72,153,0.15)); color:#F472B6">📦 출고 대기 ${b.pendingTakeOut}건</span>`
          : `<span class="tb-sw-tag" style="background:var(--green-bg); color:var(--green)">✅ 완료됨 · ${b.completedMinutesAgo}분 전</span>`)
      : (b.date === today ? `<span class="tb-sw-tag" style="background:var(--green-bg); color:var(--green)">오늘</span>` : `<span class="tb-sw-tag" style="background:var(--amber-bg); color:var(--amber)">다른 날짜</span>`);
    return `<div class="tb-switch-row" data-batch="${b.batchId}" data-date="${b.date}">
      <div>
        <div class="tb-sw-id">${b.batchId}</div>
        <div class="tb-sw-meta">${b.date} · ${Number(b.totalSku).toLocaleString()} SKU · 스캔 통과 ${Number(b.scannedPass||0).toLocaleString()}건</div>
      </div>
      ${tag}
    </div>`;
  }).join('');
  dd.querySelectorAll('[data-batch]').forEach(row => {
    row.onclick = () => {
      manualBatchOverride = { batchId: row.dataset.batch, date: row.dataset.date };
      document.getElementById('manualBanner').classList.add('show');
      dd.classList.remove('open');
      startViewOnlyTimer(); // ★ 2026-08-07 — 10분 뒤 자동 복귀 카운트다운 시작
      pollOnce(); // 고른 배치로 즉시 갱신
    };
  });
};
document.addEventListener('click', (e) => {
  const dd = document.getElementById('switchBatchDropdownTV');
  if(dd && dd.classList.contains('open') && !e.target.closest('#btnSwitchBatchTV') && !e.target.closest('#switchBatchDropdownTV')){
    dd.classList.remove('open');
  }
});

/* ★ 2026-08-07 신규(매니저 요청) — 지난 배치를 보는 상태로 TV를 켜둔 채
 * 잊어버리는 것을 막는 자동 복귀. TV 현황판은 작업자들이 보면서 물건을 넣는
 * 화면이라, 옛날 배치가 떠 있으면 엉뚱한 슬롯에 넣는 사고로 이어질 수 있음.
 *  · 10분이 지나면 자동으로 "지금 작업 중인 배치"로 돌아감
 *  · 남은 시간을 초 단위로 보여줘서 갑자기 바뀌어도 당황하지 않게 함
 *  · 화면을 만지면(클릭·터치·키·마우스 이동) 다시 10분으로 초기화 —
 *    사람이 보고 있는 동안에는 바뀌지 않음
 *  · 버튼을 누르면 기다리지 않고 즉시 복귀 (예전 그대로)
 * ★ 2026-08-24 신규 — 작업자가 "📌 계속 보기" 버튼으로 자동복귀를 아예 꺼둘 수
 *   있음(예: 옛날 배치 이슈를 오래 들여다봐야 할 때). TV 자체는 터치·마우스
 *   이동이 거의 없어서(사람이 그냥 서서 보기만 함) 위 "화면을 만지면 초기화"
 *   방식만으로는 실제로 매 10분마다 되돌아가는 불편이 있었음 — 그 보완책.
 *   켜져 있는 동안엔 배너에 "고정됨"이 계속 표시돼서, 매니저가 다른 배치 화면인
 *   걸 잊고 방치하는 원래 사고 방지 목적은 여전히 유지됨(그냥 숨기지 않음).
 */
const VIEW_ONLY_AUTO_BACK_MS = 10 * 60 * 1000; // 10분
let viewOnlyDeadline = 0;
let viewOnlyTimer = null;
let viewOnlyPinned = false; // ★ 2026-08-24 신규 — true면 자동복귀 카운트다운을 멈추고 계속 고정 표시

function backToLiveNow(){
  manualBatchOverride = null;
  currentBatchId = null; // ★ 강제 초기화해야 다음 폴링이 배치가 바뀐 걸로 인식해서 라벨을 다시 그림
  document.getElementById('manualBanner').classList.remove('show');
  stopViewOnlyTimer();
  viewOnlyPinned = false; // 복귀했으니 고정 상태도 초기화(다음에 다른 배치 볼 때 기본값부터 시작)
  updatePinButtonUI();
  pollOnce();
}

function stopViewOnlyTimer(){
  if(viewOnlyTimer){ clearInterval(viewOnlyTimer); viewOnlyTimer = null; }
  const el = document.getElementById('backToLiveCountdown');
  if(el) el.textContent = '';
}

function updatePinButtonUI(){
  const btn = document.getElementById('btnPinViewOnly');
  if(!btn) return;
  if(viewOnlyPinned){
    btn.textContent = '📌 고정됨(해제하기)';
    btn.style.background = 'var(--amber-bg)';
    btn.style.color = 'var(--amber)';
    btn.style.borderColor = 'var(--amber)';
  } else {
    btn.textContent = '📌 계속 보기';
    btn.style.background = 'var(--surface2)';
    btn.style.color = 'var(--text-dim)';
    btn.style.borderColor = 'var(--border2)';
  }
}

function togglePinViewOnly(){
  viewOnlyPinned = !viewOnlyPinned;
  updatePinButtonUI();
  if(viewOnlyPinned){
    const el = document.getElementById('backToLiveCountdown');
    if(el) el.textContent = '(고정됨 · 자동복귀 꺼짐)';
  } else {
    viewOnlyDeadline = Date.now() + VIEW_ONLY_AUTO_BACK_MS; // 다시 켜면 10분부터 재시작
  }
}
document.getElementById('btnPinViewOnly').onclick = togglePinViewOnly;

function startViewOnlyTimer(){
  viewOnlyDeadline = Date.now() + VIEW_ONLY_AUTO_BACK_MS;
  viewOnlyPinned = false; // 새로 다른 배치를 선택할 때마다 고정은 기본 꺼짐 상태로 시작
  updatePinButtonUI();
  if(viewOnlyTimer) clearInterval(viewOnlyTimer);
  viewOnlyTimer = setInterval(() => {
    if(!manualBatchOverride){ stopViewOnlyTimer(); return; }
    if(viewOnlyPinned) return; // ★ 고정된 동안은 카운트다운도, 자동복귀도 멈춤
    const left = viewOnlyDeadline - Date.now();
    const el = document.getElementById('backToLiveCountdown');
    if(left <= 0){ backToLiveNow(); return; }
    if(el){
      const m = Math.floor(left/60000), sec = Math.floor(left/1000)%60;
      el.textContent = '(' + m + ':' + String(sec).padStart(2,'0') + ' 후 자동 복귀)';
    }
  }, 1000);
}

// 사람이 화면을 보고 조작 중이면 자동 복귀를 미룸 (고정 중엔 어차피 카운트 안 하므로 무해)
['click','touchstart','keydown','mousemove'].forEach(ev => {
  document.addEventListener(ev, () => {
    if(manualBatchOverride && !viewOnlyPinned) viewOnlyDeadline = Date.now() + VIEW_ONLY_AUTO_BACK_MS;
  }, { passive: true });
});

document.getElementById('btnBackToLive').onclick = backToLiveNow;

</script>
</body>
</html>
