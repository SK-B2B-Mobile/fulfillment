// ── 저장 보내기(자동 재시도) ──
function _issIsRetriable(res){
  const e = String((res && res.error) || '');
  if(/GAS_URL|qty|required|batch_deleted|whole number|not found|no issues|exceeds|정수/i.test(e)) return false;
  return true; // 네트워크 끊김·20초 초과·server_busy·잠금 대기 초과 등
}
async function _issSend(op, data, p){
  const delays = [2000, 5000, 10000]; // 총 2분 안 — 서버의 2분 중복방지 안에서만 재시도
  let res;
  for(let t = 0; ; t++){
    p.tries = t + 1;
    if(t > 0) _issRerenderIf(p.invoice, p.batchId);
    try{ res = await gasCall(op, data); }catch(e){ res = { ok:false, error:String(e) }; }
    if(res && res.ok) return res;
    if(!_issIsRetriable(res) || t >= delays.length) return res || { ok:false, error:'알 수 없는 오류' };
    await _issSleep(delays[t] + Math.floor(Math.random() * 1000));
  }
}
let _issPollTimer = null;
function _issPollSoon(){
  clearTimeout(_issPollTimer);
  _issPollTimer = setTimeout(() => { try{ pollOnce(); }catch(e){} }, 400);
}
function _iisAfterSave(b, invoice){
  // 서버의 SKU 상태 캐시가 6초라서 7초 뒤에 최신 값을 다시 받음(열려 있을 때만)
  const c = _iis[_iisKey(b, invoice)]; if(c) c.at = 0;
  if(_issueModalInvoice === invoice && currentBatchId === b) _iisRefreshOpen(b, invoice, 7000);
}
function _issSavingCount(){
  let n = _issPend.adds.filter(a => a.st === 'saving').length;
  Object.values(_issPend.edits).forEach(e => { if(e.st === 'saving') n++; });
  Object.values(_issPend.dels).forEach(d => { if(d.st === 'saving') n++; });
  return n;
}
window.addEventListener('beforeunload', e => {
  if(_issSavingCount() > 0){ e.preventDefault(); e.returnValue = ''; return ''; }
});

function submitNewIssueFromBoard(){
  const invoice = _issueModalInvoice;
  const slot = _slotsByInvoice[invoice];
  if(!slot) return;
  if(_issItemsLoading) return;
  if(Date.now() - _issLastSubmitAt < 1200) return; // ★ 리뷰 반영 — 두 번 누름 무시(경고창 안 뜨게)
  const skuSel = document.getElementById('newIssueSku');
  const opt = skuSel.options[skuSel.selectedIndex];
  const barcode = skuSel.value;
  const name = opt ? opt.dataset.name : '';
  const sku = opt ? opt.dataset.sku : '';
  const reason = document.getElementById('newIssueReason').value;
  const qty = parseInt(document.getElementById('newIssueQty').value, 10);
  const workerSel = document.getElementById('newIssueWorker').value;
  const worker = (workerSel === '__manual__')
    ? document.getElementById('newIssueWorkerManual').value.trim()
    : workerSel.trim();
  const note = document.getElementById('newIssueNote').value.trim();

  if(!barcode || (opt && opt.disabled)){ alert('상품을 선택하세요'); return; }
  if(!qty || qty < 1){ alert('수량을 정확히 입력해주세요'); return; }
  if(!worker){ alert('작업자(발견자)를 입력해주세요'); return; }

  const a = {
    tmpId: 'tmp-' + Date.now() + '-' + (++_issSeq), batchId: currentBatchId, invoice,
    payload: { batchId: currentBatchId, worker, barcode, sku, name, invoice, customer: slot.customer, reason, qty, note },
    st: 'saving', at: Date.now(), tries: 0, err: '',
    knownIds: (slot.issues || []).map(i => String(i.issueId)),
    timeStr: (() => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; })(),
  };
  _issPend.adds.push(a);
  _issLastSubmitAt = Date.now();
  // ★ 같은 내용을 또 누르는 실수 방지 — 수량·메모·검색칸을 바로 비움(작업자·사유는 다음 등록 편하게 유지)
  ['newIssueQty','newIssueNote','newIssueSkuSearch'].forEach(id => { const e = document.getElementById(id); if(e) e.value = ''; });
  _issRerender(true);
  showIssueToast('⏳ 이슈 저장 중… 다른 작업 계속하셔도 됩니다', 'warn');
  _issRunAdd(a);
}
let _issLastSubmitAt = 0;
async function _issRunAdd(a){
  a.st = 'saving'; a.err = ''; a.at = Date.now();
  _issRerenderIf(a.invoice, a.batchId);
  let res = await _issSend('logIssue', a.payload, a);
  if(!_issPend.adds.includes(a)) return; // 그 사이 닫기(지우기)됨
  if(!res.ok && a.tries > 1){
    // ★ 리뷰 반영 — 재시도 중 "필요수량 초과" 등은 첫 시도가 실제로 저장돼서일 수 있음 → 보드 최신값으로 먼저 확인
    try{ await pollOnce(); }catch(e){}
    if(!_issPend.adds.includes(a)) return;
    const m = _issFindLanded(a);
    if(m) res = { ok: true, issueId: m, duplicate: true };
  }
  if(res.ok){
    a.st = 'saved'; a.issueId = res.issueId ? String(res.issueId) : ''; a.doneAt = Date.now();
    // 첫 시도에서 "중복"이면 2분 안에 같은 이슈가 이미 있었던 것(원래 안내 유지). 재시도 후 중복은 우리 첫 시도가 저장된 것 — 정상.
    if(res.duplicate && a.tries <= 1) showIssueToast('이미 등록된 이슈입니다 (중복 방지됨)', 'warn');
    else showIssueToast('✓ 이슈가 저장되었습니다', 'ok');
    _iisAfterSave(a.batchId, a.invoice);
    _issPollSoon();
  } else {
    a.st = 'fail'; a.err = res.error || '알 수 없는 오류';
    showIssueToast('⚠ 이슈 저장 실패 — 슬롯 팝업에서 "다시 시도"를 눌러주세요', 'err');
  }
  _issRerenderIf(a.invoice, a.batchId);
}

// ★ 2026-07-22 신규 — "✎ 수정": 사유/수량/메모를 그 자리에서 고쳐서 저장.
async function saveIssueEdit(issueId, idx){
  const reason = document.getElementById(`issueEditReason-${idx}`).value;
  const qty = parseInt(document.getElementById(`issueEditQty-${idx}`).value, 10);
  const note = document.getElementById(`issueEditNote-${idx}`).value.trim();
  if(!qty || qty < 1){ alert('수량을 정확히 입력해주세요'); return; }
  const prev = _issPend.edits[issueId];
  if(prev && prev.st === 'saving'){ showIssueToast('앞의 수정이 아직 저장 중입니다. 잠시 후 다시 눌러주세요', 'warn'); return; }
  const e = { batchId: currentBatchId, invoice: _issueModalInvoice, issueId, reason, qty, note, st: 'saving', at: Date.now(), tries: 0, err: '' };
  _issPend.edits[issueId] = e;
  const f = document.getElementById(`issueEditForm-${idx}`); if(f) f.style.display = 'none'; // 다시 그릴 때 수정창이 다시 열리지 않게
  _issRerender(true);
  _issRunEdit(e);
}
async function _issRunEdit(e){
  e.st = 'saving'; e.err = ''; e.at = Date.now();
  _issRerenderIf(e.invoice, e.batchId);
  const res = await _issSend('editIssue', { issueId: e.issueId, reason: e.reason, qty: e.qty, note: e.note }, e);
  if(_issPend.edits[e.issueId] !== e) return;
  if(res.ok){ e.st = 'saved'; e.doneAt = Date.now(); showIssueToast('✓ 수정이 저장되었습니다', 'ok'); _iisAfterSave(e.batchId, e.invoice); _issPollSoon(); }
  else { e.st = 'fail'; e.err = res.error || '알 수 없는 오류'; showIssueToast('⚠ 수정 저장 실패 — 슬롯 팝업에서 "다시 시도"를 눌러주세요', 'err'); }
  _issRerenderIf(e.invoice, e.batchId);
}

// ★ 2026-07-22 신규 — "🗑 이 이슈 전체 취소(삭제)"
async function deleteIssueFromBoard(issueId, idx){
  if(!confirm('이 이슈를 완전히 취소하시겠습니까?\n다시 이 고객사의 필요수량에 포함되어 완료 처리되지 않은 상태로 돌아갑니다.\n(수량/사유만 고치려면 "닫기"를 누르고 값을 수정한 뒤 저장하세요)')) return;
  const prev = _issPend.dels[issueId];
  if(prev && prev.st === 'saving') return;
  const d = { batchId: currentBatchId, invoice: _issueModalInvoice, issueId, st: 'saving', at: Date.now(), tries: 0, err: '' };
  _issPend.dels[issueId] = d;
  const f = document.getElementById(`issueEditForm-${idx}`); if(f) f.style.display = 'none';
  _issRerender(true);
  _issRunDel(d);
}
async function _issRunDel(d){
  d.st = 'saving'; d.err = ''; d.at = Date.now();
  _issRerenderIf(d.invoice, d.batchId);
  const res = await _issSend('undoIssue', { issueId: d.issueId }, d);
  if(_issPend.dels[d.issueId] !== d) return;
  if(res.ok){
    d.st = 'saved'; d.doneAt = Date.now();
    const e = _issPend.edits[d.issueId]; if(e && e.st !== 'saving') delete _issPend.edits[d.issueId];
    showIssueToast('✓ 이슈가 취소(삭제)되었습니다', 'ok'); _iisAfterSave(d.batchId, d.invoice); _issPollSoon();
  } else { d.st = 'fail'; d.err = res.error || '알 수 없는 오류'; showIssueToast('⚠ 삭제 실패 — 슬롯 팝업에서 "다시 시도"를 눌러주세요', 'err'); }
  _issRerenderIf(d.invoice, d.batchId);
}
// 실패 줄의 "다시 시도"/"닫기"
function _issPendAction(kind, key, retry){
  if(kind === 'add'){
    const a = _issPend.adds.find(x => x.tmpId === key); if(!a) return;
    if(!retry){ _issPend.adds = _issPend.adds.filter(x => x !== a); _issRerender(true); return; }
    if(a.st !== 'fail') return;
    // 재시도 전에: 사실은 서버에 저장됐는데 응답만 못 받은 경우(보드 목록에 이미 들어옴)면 다시 보내지 않음
    const m = _issFindLanded(a);
    if(m){ a.st = 'saved'; a.issueId = m; a.doneAt = Date.now(); _issRerender(); showIssueToast('✓ 이미 저장되어 있었습니다', 'ok'); return; }
    _issRunAdd(a);
  } else if(kind === 'edit'){
    const e = _issPend.edits[key]; if(!e) return;
    if(!retry){ delete _issPend.edits[key]; _issRerender(true); return; }
    if(e.st === 'fail') _issRunEdit(e);
  } else if(kind === 'del'){
    const d = _issPend.dels[key]; if(!d) return;
    if(!retry){ delete _issPend.dels[key]; _issRerender(true); return; }
    if(d.st === 'fail') _issRunDel(d);
  }
}
// 실패로 표시된 등록이 실제로는 서버에 들어갔는지(등록 전에 없던 같은 내용의 이슈가 새로 생겼는지)
function _issFindLanded(a){
  if(a.batchId !== currentBatchId) return '';
  const s = _slotsByInvoice[a.invoice]; if(!s) return '';
  const known = new Set(a.knownIds || []);
  const claimed = new Set(_issPend.adds.filter(x => x !== a && x.issueId).map(x => String(x.issueId)));
  const p = a.payload;
  const hit = (s.issues || []).find(i => !known.has(String(i.issueId)) && !claimed.has(String(i.issueId)) &&
    String(i.barcode || '') === String(p.barcode || '') && String(i.reason || '') === String(p.reason || '') &&
    Number(i.qty) === Number(p.qty) && String(i.worker || '') === String(p.worker || ''));
  return hit ? String(hit.issueId) : '';
}
// 보드 폴링 때마다: 서버 값이 따라온 표시는 정리(최대 90초 유지), 열린 팝업은 바뀐 게 있을 때만 다시 그림
function _issAfterPoll(){
  const now = Date.now(), b = currentBatchId;
  const slotOf = inv => _slotsByInvoice[inv];
  _issPend.adds = _issPend.adds.filter(a => {
    if(a.st === 'fail' && a.batchId === b){
      const m = _issFindLanded(a);
      if(m){ a.st = 'saved'; a.issueId = m; a.doneAt = now; }
    }
    if(a.st !== 'saved') return true;
    if(a.batchId === b){
      const s = slotOf(a.invoice);
      if(s && a.issueId && (s.issues || []).some(i => String(i.issueId) === String(a.issueId))) return false;
    }
    return now - (a.doneAt || now) < 90000;
  });
  Object.keys(_issPend.edits).forEach(k => {
    const e = _issPend.edits[k]; if(e.st !== 'saved') return;
    let done = now - (e.doneAt || now) >= 90000;
    if(!done && e.batchId === b){
      const s = slotOf(e.invoice);
      const i = s && (s.issues || []).find(x => String(x.issueId) === String(k));
      if(!i || (String(i.reason) === String(e.reason) && Number(i.qty) === Number(e.qty) && String(i.note || '') === String(e.note || ''))) done = true;
    }
    if(done) delete _issPend.edits[k];
  });
  Object.keys(_issPend.dels).forEach(k => {
    const d = _issPend.dels[k]; if(d.st !== 'saved') return;
    let done = now - (d.doneAt || now) >= 90000;
    if(!done && d.batchId === b){
      const s = slotOf(d.invoice);
      if(s && !(s.issues || []).some(x => String(x.issueId) === String(k))) done = true;
    }
    if(done) delete _issPend.dels[k];
  });
  _iisSchedulePrefetch();
  const inv = _issueModalInvoice;
  if(inv && _slotsByInvoice[inv]){
    const key = _iisKey(b, inv), c = _iis[key];
    if(c && c.sig !== _slotSig(_slotsByInvoice[inv]) && _iisRefreshing !== key && (now - c.at) > 5000) _iisRefreshOpen(b, inv);
    if(_issViewSig(inv) !== _issLastSig) _issRerender();
  }
}
// 저장 중 경과 초 표시만 그 자리에서 갱신(화면 전체를 다시 그리지 않음)
setInterval(() => {
  try{
    if(!_issueModalInvoice) return;
    // ★ 최종검사 반영 — 드롭다운에 포커스가 남아 있어도 3초 넘게 미루지 않음(저장됨/실패 표시가 늦지 않게)
    if(_issDeferred && Date.now() - _issDeferredAt > 3000){ _issRerender(true); return; }
    document.querySelectorAll('#issueModalBody .iss-pend-sec').forEach(el => {
      const sec = Math.floor((Date.now() - Number(el.dataset.at)) / 1000);
      el.textContent = sec >= 3 ? '· ' + sec + 's' : '';
    });
  }catch(e){}
}, 1000);

// ★ 2026-08-21 신규 — 이슈 등록 성공/중복 알림용 간단 토스트 (11-05: 실패용 빨강 'err' 추가)
function showIssueToast(msg, type){
  let t = document.getElementById('issueToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'issueToast';
    t.style.cssText = 'position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px); z-index:99999; padding:12px 22px; border-radius:999px; font-size:14px; font-weight:700; white-space:nowrap; box-shadow:0 8px 28px rgba(0,0,0,0.5); opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  const pal = type === 'err' ? ['#3a1016', '#ef4444', '#fca5a5'] : type === 'warn' ? ['#3a2a10', '#d97706', '#fbbf24'] : ['#0f2e1a', '#22c55e', '#4ade80'];
  t.style.background = pal[0];
  t.style.border = '1px solid ' + pal[1];
  t.style.color = pal[2];
  requestAnimationFrame(() => {
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
  });
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(-50%) translateY(20px)';
  }, type === 'err' ? 6000 : 2600);
}

 * 검수(ScanLog)와 완전히 별개로, 패킹존에서 실제 물건을 바코드로 한 번 더

let _packModalState = null;
let _packAudioCtx = null;

async function openPackVerifyModal(invoice){

  if(!slot) return;
  // ★ 2026-08-24 신규 — 이 모달은 반드시 파랑(패킹존 이동완료) 이후에만 열려야 함.
  //   (문서 click 위임에서 이미 taken 상태일 때만 호출하지만, 방어적으로 한 번 더 확인)

function populatePackWorkerSelect(){
  const sel = document.getElementById('packWorkerSelect');
  const opts = (_workersCache && _workersCache.length)
    ? _workersCache.map(w => `<option value="${w.name}">${w.name}</option>`).join('')
    : '<option value="">등록된 작업자 없음</option>';
  sel.innerHTML = opts + '<option value="__manual__">✎ 명단에 없음 — 직접 입력</option>';
}
function currentPackWorker(){
  const sel = document.getElementById('packWorkerSelect').value;
  if(sel === '__manual__') return document.getElementById('packWorkerManual').value.trim();
  return (sel || '').trim();
}

async function refreshPackModalState(){
  const invoice = _packModalInvoice;
  if(!invoice) return;
  const res = await gasQueryWithRetry('getPackScanState', { batchId: currentBatchId, invoice });
  if(!res.ok){
    document.getElementById('packModalBody').innerHTML = `<div class="issue-modal-empty">불러오기 실패: ${res.error||''}</div>`;
    return;
  }
  _packModalState = res;
  renderPackModalBody();
}

function renderPackModalBody(){
  const state = _packModalState;
  if(!state || _packModalInvoice === null) return;
  const pct = state.totalReq > 0 ? Math.min(100, Math.round(state.totalPacked / state.totalReq * 100)) : 0;
  document.getElementById('packProgressText').textContent = `${state.totalPacked.toLocaleString()} / ${state.totalReq.toLocaleString()} pcs`;
  document.getElementById('packProgressBar').style.width = pct + '%';
  document.getElementById('packCompleteBtn').disabled = !state.complete;

  const linesHtml = (state.lines || []).map(l => `
    <div class="pack-line ${l.complete ? 'done' : ''}">
      <div>
        <div class="pack-line-name">${l.name || l.sku}</div>
        <div class="pack-line-meta">${l.sku} · 바코드 ${l.barcode}${l.issueQty > 0 ? ` · 이슈차감 ${l.issueQty}` : ''}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="pack-line-qty">${l.packed}/${l.effectiveReq}</span>
        <span class="pack-line-check">${l.complete ? '✅' : '⏳'}</span>
      </div>
    </div>`).join('') || `<div class="issue-modal-empty">이 인보이스에 등록된 상품이 없습니다</div>`;

  const activeHistory = (state.history || []).filter(h => h.status !== 'undone');
  const historyHtml = activeHistory.length ? `
    <div class="pack-history-toggle" onclick="const b=this.nextElementSibling; b.style.display = b.style.display==='none' ? 'block' : 'none';">▾ 스캔 이력 보기 (${activeHistory.length}건)</div>
    <div style="display:none;">
      ${activeHistory.slice(0, 30).map(h => `
        <div class="pack-history-row ${h.result !== 'pass' ? h.result : ''}">
          <span>${_issEsc(_fmtShortTime(h.time))} · ${h.worker||'-'} · 바코드 ${h.barcode}${h.result==='wrong'?' (다른 고객사 물건)':h.result==='over'?' (중복)':''}${h.qty>1?' x'+h.qty:''}</span>
          <span class="pack-history-undo" onclick="undoPackScanEntry('${h.packScanId}')">되돌리기</span>
        </div>`).join('')}
    </div>` : '';

  document.getElementById('packModalBody').innerHTML = linesHtml + historyHtml;
}

async function submitPackScan(){
  const input = document.getElementById('packScanInput');
  const barcode = input.value.trim();
  if(!barcode) return;
  input.value = '';
  const worker = currentPackWorker();
  if(!worker){ alert('작업자를 먼저 선택하세요'); input.focus(); return; }
  // ★ 2026-08-24 재설계 — qty를 더 이상 클라이언트가 보내지 않음. 서버가
  //   "이 바코드에 남은 필요수량 전체"를 알아서 계산해서 한 번에 채움
  //   (스캔 1번 = 그 상품 전체 수량 확인, 실제 물류 현장 표준 방식).
  const res = await gasCall('logPackScan', { batchId: currentBatchId, invoice: _packModalInvoice, worker, barcode });
  if(!res.ok){
    flashPackModal('bad'); beepPack(false);
    showPackModalMsg('오류: ' + (res.error || '알 수 없는 오류'), 'bad');
    input.focus();
    return;
  }
  if(res.result === 'pass'){
    flashPackModal('ok'); beepPack(true);
    showPackModalMsg(`✓ ${res.name || res.sku || barcode} ${(res.filled||0).toLocaleString()}개 확인됨`, 'ok');
  } else if(res.result === 'wrong'){
    flashPackModal('bad'); beepPack(false);
    const owners = (res.ownerInvoices && res.ownerInvoices.length) ? res.ownerInvoices.join(', ') : '알 수 없음';
    showPackModalMsg(`🚫 이 물건은 이 고객사 것이 아닙니다! → 실제로는 [${owners}] 것입니다. 상자에서 빼주세요.`, 'bad');
  } else if(res.result === 'over'){
    flashPackModal('bad'); beepPack(false);
    showPackModalMsg(res.note === 'excluded' ? '⚠ 이 상품은 이슈 처리되어 이제 필요수량이 없습니다' : '⚠ 이미 확인 완료된 상품입니다 (중복 스캔)', 'bad');
  }
  await refreshPackModalState();
  input.focus();
}

// ★ 외부 오디오 파일 없이 WebAudio로 즉석 생성 — 성공(높은 짧은음) / 실패(낮은 두번음)
function beepPack(ok){
  try{
    const ctx = _packAudioCtx || (_packAudioCtx = new (window.AudioContext || window.webkitAudioContext)());
    function tone(freq, start, dur){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur + 0.02);
    }
    if(ok){ tone(1200, 0, 0.12); } else { tone(280, 0, 0.16); tone(280, 0.19, 0.16); }
  }catch(e){ /* 오디오 실패해도 스캔 자체엔 지장 없음 */ }
}

  else alert('취소 실패: ' + (res.error || '알 수 없는 오류'));
}

  } else {
    alert('처리 실패: ' + (res.error || '알 수 없는 오류'));
  }
}

// ★ 패킹 슬립 인쇄 — StyleKorean 헤더/주소 포함, 새 창에서 브라우저 인쇄 다이얼로그 사용
// (전용 프린터가 없어도 어디서나 동작하고, "PDF로 저장"도 그대로 가능)
// ★ 2026-08-24 신규 — 4x6 라벨 프린터 지원. format: 'letter'(기본) 또는 'label'.
function printPackingSlip(format){
  format = format || 'letter';
  const invoice = _packModalInvoice;
  const slot = _slotsByInvoice[invoice];
  const state = _packModalState;
  if(!slot){ alert('먼저 패킹 검증 모달을 여세요'); return; }
  const lines = (state && state.lines) ? state.lines : [];
  const issues = slot.issues || [];
  // ★ 2026-08-24 버그 수정 — 예전엔 스캔 진행률(state.complete)만 보고 판정해서,
  //   "관리자 강제확정"으로 넘어간 오더는 실제로 검증완료 상태인데도 스캔
  //   기록이 없으니 슬립엔 계속 "NOT FULLY VERIFIED"로 잘못 찍혔음.
  //   이제 slot.packVerified(실제 최종 상태, 강제확정 포함)를 최우선으로 보고,
  //   스캔 100%로 정상 검증된 것과 관리자가 강제로 넘긴 것을 구분해서 표시함.
  const scanComplete = state ? !!state.complete : false;
  const verified = !!slot.packVerified;
  const forcedVerify = verified && !scanComplete;
  const worker = currentPackWorker() || '-';
  const printedAt = new Date().toLocaleString('en-US');

  const badgeClass = verified ? (forcedVerify ? 'verify-forced' : 'verify-ok') : 'verify-bad';
  const badgeText = verified
    ? (forcedVerify ? '⚠ 2ND VERIFICATION — ADMIN OVERRIDE (not scan-checked)' : '✓ 2ND VERIFICATION COMPLETE — 100% SCAN-CHECKED')
    : '⚠ NOT FULLY VERIFIED (2nd check pending)';

  // ★ 2026-08-24 버그 수정 — 강제확정된 오더는 실제로 스캔을 안 했으니
  //   Packed 열에 "0"을 그대로 찍으면 "물건이 하나도 없다"처럼 오해될 수
  //   있음. 실제로는 물건이 있는데 개수 확인만 안 한 것이므로, "0"이 아니라
  //   "확인 안 됨"이라는 게 명확히 드러나도록 대시(—)로 표시.
  const rowsHtml = lines.map(l => `
    <tr>

  const forcedNote = ''; // ★ 2026-08-24 수정(매니저 판단) — 이 슬립은 결국 고객이 보는 문서라, 내부 스캔 여부 각주는 불필요한 의심만 줌. 하단의 ADMIN OVERRIDE 배지 하나로 감사 목적은 충분히 유지됨.

  const issuesHtml = issues.length ? `
    <h4 class="issues-h4">Issues / Shortages</h4>
    <table class="slip-table"><thead><tr><th>Reason</th><th>Product</th><th style="text-align:center;">Qty</th></tr></thead><tbody>
    ${issues.map(i => `<tr><td>${i.reason}</td><td>${i.name || i.sku || ''}</td><td style="text-align:center;">${i.qty}</td></tr>`).join('')}

  const letterCss = `

    .slip-logo{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
    .slip-addr{font-size:12px; color:#555; margin-top:4px; line-height:1.5;}

    .slip-info div b{display:block; font-size:11px; color:#777; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:2px;}

    .slip-footer{margin-top:28px; padding-top:14px; border-top:1px solid #ccc; font-size:11px; color:#777; display:flex; justify-content:space-between;}
  `;
  const labelCss = `
    /* ★ 2026-08-24 수정 — 라벨이 오른쪽으로 치우쳐 보이던 문제. margin:auto로
       "중앙정렬"에 맡기면 라벨 프린터마다 있는 좌우 인쇄 여백 편차 때문에

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Packing Slip · ${invoice}</title>

    .verify-forced{background:#fef3c7; color:#92400e; border:1px solid #f59e0b;}
    .verify-bad{background:#fee2e2; color:#991b1b; border:1px solid #dc2626;}

      </div>

    <div class="slip-info">
      <div><b>Customer</b>${slot.customer || '-'}</div>

  const win = window.open('', '_blank', 'width=820,height=1000');
  if(!win){ alert('팝업이 차단되었습니다. 이 사이트의 팝업을 허용해주세요.'); return; }

}

// ★ 2026-07-24 신규 — 이슈 등록 폼의 SKU 검색창은 매번 다시 그려지므로
// document 레벨 위임으로 입력 이벤트를 잡음 (직접 바인딩하면 재렌더링마다 유실됨)
document.addEventListener('input', e => {
  if(e.target.id === 'newIssueSkuSearch') filterNewIssueSkuOptions(e.target.value);
});
document.addEventListener('click', e => {
  // ★ 2026-07-23 신규: "패킹존 이동" 체크박스는 카드 안에 있지만 완전히 다른 동작
  //   (이슈 모달을 열지 않고 그 자리에서 바로 토글) — 카드 클릭 판정보다 먼저 처리.
  const packCheck = e.target.closest('.card-pack-check');
  if(packCheck){
    const invoice = packCheck.dataset.packInvoice;
    const slot = _slotsByInvoice[invoice];
    if(!slot) return;
    // ★ 2026-08-24 신규(오출고 방지 재설계) — 기존 약속(초록→핑크→파랑)은 절대
    //   안 바꿈: none→moved, moved→taken은 지금까지와 완전히 동일하게 클릭 한 번에
    //   즉시 전환(togglePackingMoved 그대로). 파랑(taken) 상태에서 한 번 더 누르면
    //   더 이상 곧장 핑크로 안 돌아가고, "최종 2차 검증" 모달이 열림 — 이 모달
    //   안에서 100% 스캔 확인이 끝나야만 주황(verified, 최종)으로 넘어감.
    //   주황 상태에서 누르면(실수 정정용) 파랑으로 되돌리는 확인창만 뜸.
    if(slot.packVerified){
      if(!confirm(`정말 되돌리시겠습니까?\n\n"${slot.customer || invoice}"는 이미 최종 2차 검증완료(주황)된 상태입니다.\n다시 누르면 검증 전(파랑) 상태로 돌아갑니다.`)) return;
      gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: 'taken' }).then(res => {
        if(res.ok) pollOnce();
        else alert('되돌리기 실패: ' + (res.error || '알 수 없는 오류'));
      });
      return;
    }
    if(packStageOf(slot) === 'taken'){ openPackVerifyModal(invoice); return; }
    togglePackingMoved(invoice); // none→moved, moved→taken은 기존 그대로
    return;
  }
  // ★ 2026-07-23 수정: 이슈 배지뿐 아니라 카드 전체 아무 곳이나 눌러도 모달이 열리도록 확장
  //   (이슈가 0건이어도 열려서 새로 등록할 수 있어야 하므로)
  const card = e.target.closest('.card[data-invoice]');
  if(card && !e.target.closest('.issue-modal, .issue-new-form')){ openIssueModal(card.dataset.invoice); return; }
  const editBtn = e.target.closest('.issue-modal-edit-btn');
  if(editBtn){
    const idx = editBtn.dataset.idx;
    document.getElementById(`issueEditForm-${idx}`).style.display = 'flex';
    editBtn.style.display = 'none';
    return;
  }
  const cancelBtn = e.target.closest('.issue-edit-cancel');
  if(cancelBtn){
    const idx = cancelBtn.dataset.idx;
    document.getElementById(`issueEditForm-${idx}`).style.display = 'none';
    document.querySelector(`.issue-modal-edit-btn[data-idx="${idx}"]`).style.display = '';
    return;
  }
  const saveBtn = e.target.closest('.issue-edit-save');
  if(saveBtn){ saveIssueEdit(saveBtn.dataset.issueId, saveBtn.dataset.idx); return; }
  const deleteBtn = e.target.closest('.issue-edit-delete');
  if(deleteBtn){ deleteIssueFromBoard(deleteBtn.dataset.issueId, deleteBtn.dataset.idx); return; }
  const newIssueBtn = e.target.closest('#newIssueSubmitBtn');
  if(newIssueBtn){ submitNewIssueFromBoard(); return; }
  // ★ 2026-11-05 신규 — 저장 실패 줄의 "다시 시도"/"닫기", 상품 목록 다시 불러오기
  const pendBtn = e.target.closest('.iss-pend-retry, .iss-pend-dismiss');
  if(pendBtn){ _issPendAction(pendBtn.dataset.kind, pendBtn.dataset.key, pendBtn.classList.contains('iss-pend-retry')); return; }
  if(e.target.closest('#issItemsRetry')){
    if(_issueModalInvoice){ _issItemsFailed = false; _issItemsLoading = !_iis[_iisKey(currentBatchId, _issueModalInvoice)]; _issRerender(); _iisRefreshOpen(currentBatchId, _issueModalInvoice); }
    return;
  }
  if(e.target.id === 'issueModalOverlay') closeIssueModal();
});


/* ★ 2026-11-10 — 고객명 끝에 붙어 오는 "Ship Via: PU" 등 제거(오더 PDF 양식이 바뀌어 고객명에 같이 읽혀 들어옴).
   끝에 붙은 "Ship Via: …"(짧은 배송방법 글자)만 지움. 지우고 나서 비면 원래 값 그대로. */
function cleanCust_(s){
  const t = String(s == null ? '' : s);
  const c = t.replace(/\s*\bShip\s*Via\s*:?\s*[A-Za-z0-9&\/\.\-\s]{0,24}$/i, '').trim();
  return c || t.trim();
}
/* ★ 2026-11-10 — SKU / PCS 두 줄(숫자 오른쪽 맞춤, "/" 세로 정렬). 화면이 좁아 한 줄에 안 들어가면 모든 카드를 같은 크기로 함께 줄임(줄바꿈 없음). */
function fitMetaRows_(rows, minPx){
  rows = Array.prototype.slice.call(rows || []);
  if(!rows.length) return;
  rows.forEach(r => { r.style.fontSize = ''; });
  const base = parseFloat(getComputedStyle(rows[0]).fontSize) || 16;
  let scale = 1;
  rows.forEach(r => { const have = r.clientWidth, need = r.scrollWidth; if(have > 0 && need > have + 0.5) scale = Math.min(scale, have / need); });
  if(scale < 1){ const px = Math.max(minPx || 9, Math.floor(base * scale * 0.98 * 2) / 2); rows.forEach(r => { r.style.fontSize = px + 'px'; }); }
}

function renderBoard(slots, fromPoll){
  const board = document.getElementById('board');
  // ★ 2026-07-16 신규: 이슈 뱃지 클릭 시 참조할 수 있도록 invoice 기준으로 캐싱
  _slotsByInvoice = {};
  (slots || []).forEach(s => {
    if(s && s.customer) s.customer = cleanCust_(s.customer); // ★ 2026-11-10 — 고객명 뒤 "Ship Via: …" 제거(카드·팝업·이슈 모두 같은 값 사용)
    if(!s.invoice) return;
    // ★ 2026-07-28 신규 — 보류중인 패킹존 이동 값이 있으면(방금 클릭해서 서버에
    //   저장 요청을 보냈지만 아직 반영 안 됐을 수 있는 경우), 실제 서버 폴링
    //   데이터(fromPoll=true)일 때만 비교해서 정리함. 클릭 직후 자체 낙관적
    //   재렌더링(fromPoll 없음)에서는 절대 여기서 지우지 않음 — 그 호출은 항상
    //   방금 세팅한 값 그대로라 비교하면 즉시(너무 이르게) 지워져버리기 때문.
    // ★ 2026-08-04 확장 — boolean 대신 3단계(stage) 값으로 비교 (moved/taken)
    if(fromPoll && Object.prototype.hasOwnProperty.call(_pendingPackMoves, s.invoice)){
      const serverStage = s.takenOut ? 'taken' : s.movedToPacking ? 'moved' : 'none';
      const pendingEntry = _pendingPackMoves[s.invoice];
      const pending = pendingEntry.stage;
      const age = Date.now() - pendingEntry.ts;
      if(serverStage === pending){
        delete _pendingPackMoves[s.invoice]; // 미러가 따라옴 — 정상 종료
      } else {
        // ★ 2026-09-30 수정(현장 사고 — "블루가 다시 핑크로 돌아간다") — 미러가
        //   아직 못 따라왔다고 해서 절대 섣불리 되돌리지 않는다. 화면은 계속
        //   낙관적 값(방금 누른 값)을 유지하고, PENDING_PACK_MAX_MS를 넘겼을
        //   때만(그것도 15초 간격으로만) 미러를 거치지 않는 직접 확인을 한 번
        //   보내서 진짜 실패인지 아닌지 가려낸다 — 실제로 되돌리는 건 그 직접
        //   확인이 "진짜 실패"라고 답했을 때뿐(_verifyPendingPackMoveDirectly_).
        s.movedToPacking = (pending !== 'none');
        s.takenOut = (pending === 'taken');
        if(age > PENDING_PACK_MAX_MS && (Date.now() - (pendingEntry.lastVerifyTs || 0)) > 15000){
          pendingEntry.lastVerifyTs = Date.now();
          _verifyPendingPackMoveDirectly_(s.invoice, pendingEntry, currentBatchId);
        }
      }
    }
    _slotsByInvoice[s.invoice] = s;
  });
  if(fromPoll){ try{ _issAfterPoll(); }catch(eIss){ console.warn('issue overlay sync skipped:', eIss); } } // ★ 2026-11-05 신규 — 이슈 즉시반영 정리·미리받기
  if(!slots || slots.length === 0){
    board.innerHTML = `<div class="empty-state"><h2>오늘의 배치를 기다리는 중...</h2><p>슬롯이 배정되면 여기 자동으로 표시됩니다</p></div>`;
    return;
  }
  const large = slots.filter(s => s.slotNum <= 15).sort((a,b) => a.slotNum - b.slotNum);
  const small = slots.filter(s => s.slotNum > 15).sort((a,b) => a.slotNum - b.slotNum);

  let html = '';
  if(large.length){
    html += `<div class="zone-label">대량 오더 구역 · SLOT 01-15</div><div class="grid">`;
    for(let n=1; n<=15; n++){
      const s = large.find(x => x.slotNum === n);
      html += cardHtml(s);
    }
    html += `</div>`;
  }
  if(small.length){
    html += `<div class="zone-label">소량 오더 구역 · SLOT 16-30</div><div class="grid small">`;
    for(let n=16; n<=30; n++){
      const s = small.find(x => x.slotNum === n);
      html += cardHtml(s);
    }
    html += `</div>`;
  }

  // ★ 2026-07-13 신규: 30번을 초과하는 슬롯(31, 32... 또는 "임시A" 같은
  //   매니저 수동 배정 라벨)은 기존엔 TV 화면에서 통째로 누락됐음.
  //   고객사가 30개를 넘는 배치(예: 47개 고객사)에서 작업자가 31번째부터는
  //   TV로 확인할 방법이 아예 없던 문제 — 여기 세번째 구역으로 추가.
  const overflow = slots.filter(s => !(Number(s.slotNum) >= 1 && Number(s.slotNum) <= 30));
  overflow.sort((a,b) => String(a.slotNum).localeCompare(String(b.slotNum), undefined, {numeric:true}));
  if(overflow.length){
    html += `<div class="zone-label">추가 배정 구역 · 31번 이상 / 수동 배정 (${overflow.length}개)</div><div class="grid small">`;
    overflow.forEach(s => { html += cardHtml(s); });
    html += `</div>`;
  }

  board.innerHTML = html;
  try { fitMetaRows_(board.querySelectorAll('.card-metarow.mr-grid'), 12); } catch(eFit){} // ★ 2026-11-10 — 좁은 화면이면 함께 줄여 한 줄 유지

  // 완료 상태 기록 갱신 (다음 폴링에서 flash 판단용)
  const next = {};
  slots.forEach(s => { next[s.slotNum] = s.status; });
  prevStatus = next;
}

// ★ 2026-08-03 신규 — "다른 배치 조회"에서 배치를 고르면 즉시 pollOnce()를
// 한 번 더 부르는데(빠른 반영 목적), 이때 하필 그 직전에 시작된 "예전 배치
// 기준" 폴링 요청이 아직 응답을 안 받은 상태라면, 그 낡은 응답이 나중에
// 도착하면서 방금 고른 새 배치 화면을 예전 배치로 덮어써버리는 경쟁상태가
// 있었음(그래서 새 배치→예전 배치→다음 폴링에 다시 새 배치로 깜빡이는 것처럼
// 보였음). 매 polling마다 세대(generation) 번호를 매겨서, 응답이 왔을 때
// "그사이 더 최신 요청이 이미 시작됐으면" 그 낡은 응답은 화면에 반영하지
// 않고 조용히 버리도록 함.
let pollSeq = 0;

// ★ 2026-09-30 신규(사장님 지시, 같은 날 블루 기준으로 정정) — "지금 보고
// 있는 배치의 모든 슬롯이 블루(패킹존 이동 "완료", takenOut===true)로 다
// 넘어갔는지" 확인해서, 그렇다면 이 기기를 자동으로 "다음 최신 배치"로
// 넘긴다. (핑크/movedToPacking은 "패킹존 이동이 필요하다"는 표시일 뿐 실제
// 완료 신호가 아니므로 기준에서 제외 — 실제 완료는 블루/takenOut.)
// 이 화면이 자동으로 바뀌는 트리거는 다음 세 가지뿐 — 그 외엔 절대 자동으로
// 안 바뀐다: ①새로고침, ②지금 보는 배치가 전부 블루로 완료되는 순간(여기),
// ③②의 순간에 넘어갈 다음 배치가 아직 없어서 대기 중이다가, 그 뒤 새 배치가
// 생기는 순간(pollOnce의 _waitingForNextBatchAfterCompletion 처리 참고).
// manualBatchOverride(수동으로 지난 배치 고정) 중에는 호출부에서 아예 안
// 부르므로 여기선 다시 확인 안 함. 넘어갈 다음 배치가 없으면 그대로 유지하되,
// "새 배치가 생기면 바로 넘어가야 하는 대기 상태"로 표시해둔다.
async function checkAutoAdvanceOnFullyTaken_(slots){
  const filled = (slots || []).filter(s => s && !s.empty);
  if(!filled.length) return; // 빈 슬롯뿐이면 판단 불가 — 그대로 둠
  const allTaken = filled.every(s => s.status === 'done' && s.takenOut === true);
  if(!allTaken) return;
  if(_waitingForNextBatchAfterCompletion) return; // 이미 대기 상태로 표시돼 있음 — pollOnce 쪽에서 새 배치 등장을 계속 확인 중이므로 중복 처리 방지
  try{
    const openRes = await getOpenBatchesData_();
    const trulyOpen = (openRes.batches || []).filter(b => !b.recentlyCompleted && String(b.batchId) !== String(currentBatchId));
    if(!openRes.ok || !trulyOpen.length){
      // 넘어갈 다음 배치가 지금은 없음 — 이 배치에 그대로 머무르되, 앞으로
      // 새 배치가 생기는 즉시 자동 전환되도록 "대기 상태"로 표시해둔다.
      _waitingForNextBatchAfterCompletion = true;
      console.log('ℹ️ 배치 ' + currentBatchId + ' 전체 슬롯이 블루(패킹존 이동 완료)로 전환됨 — 넘어갈 다음 배치 없음, 새 배치 생성 대기 상태로 전환');
      return;
    }
    const next = trulyOpen.slice().sort((a, b) => {
      let ta = new Date(a.createdAt).getTime(); if (isNaN(ta)) ta = new Date(a.date).getTime() || 0;
      let tb = new Date(b.createdAt).getTime(); if (isNaN(tb)) tb = new Date(b.date).getTime() || 0;
      return tb - ta;
    })[0];
    console.log('✅ 배치 ' + currentBatchId + ' 전체 슬롯이 블루(패킹존 이동 완료)로 전환됨 — 다음 최신 배치 ' + next.batchId + '로 자동 전환');
    currentBatchId = next.batchId;
    rememberBatch(currentBatchId);
    pollOnce(); // 새 배치 기준으로 즉시 다시 갱신
  }catch(e){ console.warn('전체 블루 전환 후 자동전환 확인 실패(다음 폴링에서 재시도):', e); }
}

async function pollOnce(){
  const mySeq = ++pollSeq;
  try{
    if(!GAS_READY){
      document.getElementById('emptyMsg').textContent = 'CONFIG.GAS_URL이 설정되지 않았습니다';
      return;
    }
    // ★ 2026-07-23 신규: 매니저가 TV에서 직접 "다른 배치"를 골라 조회 중이면
    //   (manualBatchOverride) 활성 배치 자동 추적을 건너뛰고 그 배치만 고정 조회.
    //   이 모드는 다른 기기(작업자 폰 등)에는 전혀 영향을 주지 않는 TV 전용 조회.
    if(manualBatchOverride){
      currentBatchId = manualBatchOverride.batchId;
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot manual"></span>배치 ${currentBatchId} · ${manualBatchOverride.date}`;
    } else {
    // ★ 2026-09-30 재설계(사장님 지시 — TV/컴퓨터 독립성, 기존 버그 수정) —
    //   예전엔 이 블록이 매 폴링(30초)마다 서버의 "활성 배치"(매니저가
    //   batch.html에서 지정)를 다시 따라갔다. 그래서 다른 기기의 조작이나 새
    //   배치 생성이 이 화면에 그대로 전파돼서 여러 대의 TV/컴퓨터가 서로
    //   영향을 주는 문제가 있었고, 열린 배치가 2개 이상이면 아예 아무것도 못
    //   골라서(옛 로직: trulyOpen.length===1 조건) 제목줄엔 최근 배치가 보이는데
    //   본문은 "오늘의 배치를 기다리는 중..."만 뜨는 불일치 버그(2026-09-30
    //   실제 현장에서 발견됨)로도 이어졌다.
    //
    //   이제 이 화면이 "어느 배치를 보여줄지"는 완전히 이 기기 혼자 결정하고,
    //   아래 세 경우에만 다시 정한다 — 그 사이엔 새 배치가 생기든, 매니저가
    //   활성 배치를 새로 지정하든, 다른 TV/컴퓨터가 뭘 보고 있든 이 화면은
    //   절대 안 바뀐다:
    //     ① 이 페이지를 처음 열었을 때, 또는 새로고침 직후(_defaultBatchLocked
    //        === false) → "완료되지 않은 배치 중 가장 최근에 생성된 것"을
    //        자동으로 선택
    //     ② 지금 보고 있는 배치의 모든 슬롯이 블루(패킹존 이동 완료,
    //        takenOut===true)로 다 넘어가서 아래 checkAutoAdvanceOnFullyTaken_()가
    //        스스로 다음 배치로 넘길 때
    //     ③ ②의 순간에 넘어갈 다음 배치가 아직 없어서 이 배치에 머물러
    //        있다가(_waitingForNextBatchAfterCompletion===true), 그 뒤 새
    //        배치가 생기는 순간 — 이 배치가 이미 완료 상태일 때만 적용되는
    //        예외이며, 아직 진행 중인 배치를 보고 있을 땐 새 배치가 생겨도
    //        절대 자동 전환되지 않는다(기존 원칙 그대로 유지)
    //   (작업자가 "다른 배치"/"지난 배치"에서 직접 고르는 경우는 이 블록과
    //   무관하게 manualBatchOverride 모드로 따로 들어가므로 여기 영향 없음)
    // ★ 2026-08-11 속도 개선(매니저 지적, 그대로 유지) — 새로고침할 때마다
    //   "연결 대기중..."이 한참 이어지던 문제. 마지막으로 본 배치 번호를 이
    //   기기에 기억해두고, 새로고침 직후엔 그 번호로 슬롯을 곧바로 불러와
    //   화면을 먼저 채운다. 진짜 "최신 배치" 판정은 그다음에 이어서 하고,
    //   달랐으면 그때 정정한다.
    if (BOOT_FAST && LAST_BATCH_ID){
      BOOT_FAST = false;
      currentBatchId = LAST_BATCH_ID;
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · 확인 중…`;
      // 슬롯을 먼저 그리고, 진짜 최신 배치 판정은 아래에서 이어감
      try{
        const fast = await gasQuery('getSlotProgress', { batchId: currentBatchId });
        if(mySeq === pollSeq && fast && fast.ok){
          document.getElementById('doneCount').textContent = `${fast.doneCount} / ${fast.totalCount}`;
          document.getElementById('doneBar').style.width =
            (fast.totalCount > 0 ? (fast.doneCount / fast.totalCount * 100) : 0) + '%';
          // ★ 2026-09-28 신규 — 이것도 Apps Script 직접 조회(방금 받은 정확한 값)라
          // board_scanFast 보정치를 또 얹으면 중복 가산될 수 있어 건너뜀(위 getSlotProgressForBatch_와 동일 원칙).
          renderBoard(fast.slots, true);
        }
      }catch(e){ /* 실패해도 아래 정상 경로가 이어서 확인 */ }
    }

    if(!_defaultBatchLocked){
      // ① 이 기기가 아직 "어느 배치를 볼지" 정하기 전 — 완료 안 된 배치 중
      //   가장 최근에 생성된 것을 고른다. 2개 이상 열려있어도(예전 버그
      //   원인) 문제없이 항상 하나를 고름.
      let resolved = null;
      let openListOk = false; // ★ 2026-10-19 — 목록 조회가 "성공했는데 비어 있는" 경우에만 화면을 비움(네트워크 실패로 화면이 지워지는 일 방지)
      try{
        const openRes = await getOpenBatchesData_();
        if(mySeq !== pollSeq) return;
        openListOk = !!(openRes && openRes.ok);
        try{ checkDeletedFromOpenList_(openRes); }catch(eDel){}
        if(mySeq !== pollSeq) return; // 삭제 정리로 새 폴링이 시작됐으면 이 폴링은 종료
        // getOpenBatches가 "완료된 지 1시간 안 된 배치"도 같이 내려주므로,
        // 이 자동표시 판단에서는 반드시 제외해야 함.
        const trulyOpen = (openRes.batches || []).filter(b => !b.recentlyCompleted && !_deletedBatchIds.has(String(b.batchId)));
        if(openRes.ok && trulyOpen.length){
          resolved = trulyOpen.slice().sort((a, b) => {
            let ta = new Date(a.createdAt).getTime(); if (isNaN(ta)) ta = new Date(a.date).getTime() || 0;
            let tb = new Date(b.createdAt).getTime(); if (isNaN(tb)) tb = new Date(b.date).getTime() || 0;
            return tb - ta; // 가장 최근 생성된 배치가 맨 앞
          })[0];
        }
      }catch(e){ console.warn('열린 배치 목록 확인 실패(다음 폴링에서 재시도):', e); }

      if(!resolved){
        // ★ 진행중인 배치가 정말 하나도 없는 경우에만 대기 화면 표시
        liveBatchId = null;
        const dot0 = document.getElementById('liveDot');
        if(dot0) dot0.className = 'status-dot off';
        // ★ 2026-10-19 — 목록 조회 "실패"(네트워크)일 땐 보던 배치 라벨을 유지(확인 못 한 걸 "없음"으로 단정하지 않음)
        if(openListOk || !currentBatchId) document.getElementById('batchLabel').innerHTML = '<span class="status-dot off"></span>진행중인 배치 없음';
        if(openListOk){
          // ★ 2026-10-19 버그 수정 — 예전엔 라벨만 "배치 없음"으로 바꾸고 이미 그려진 슬롯(새로고침 직후 기억해둔
          //   배치로 먼저 그린 것)은 그대로 남아서, 삭제된 배치가 TV에 계속 보였음. 이제 슬롯과 기억값을 함께 비움.
          forgetRememberedBatch_(null);
          currentBatchId = null;
          try{ _slotsByInvoice = {}; renderBoard([], false); }catch(eR){}
          try{ document.getElementById('doneCount').textContent = '0 / 0'; document.getElementById('doneBar').style.width = '0%'; }catch(eR2){}
        }
        return;
      }
      currentBatchId = resolved.batchId;
      rememberBatch(currentBatchId); // 다음 새로고침 때 즉시 띄우기 위해 기억
      document.getElementById('batchLabel').innerHTML =
        `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · ${resolved.date}`;
      _defaultBatchLocked = true; // ★ 이 페이지가 살아있는 동안 다시는 이 판정으로 안 돌아옴
      _waitingForNextBatchAfterCompletion = false; // 새로 고른 배치 기준으로 대기 상태 초기화
    } else {
      // 이미 "이 기기가 볼 배치"가 정해진 상태 — 라벨(날짜)만 가볍게 갱신하고
      // currentBatchId는 절대 다시 고르지 않음(새 배치가 생겨도 여기서 안 바뀜).
      // ★ 유일한 예외: 지금 보고 있는 배치가 이미 전부 블루로 완료돼서
      //   _waitingForNextBatchAfterCompletion === true인 상태라면, 그 사이에
      //   새 배치가 생겼는지 확인해서 생겼으면 그 배치로 자동 전환한다.
      try{
        const openRes2 = await getOpenBatchesData_();
        if(mySeq !== pollSeq) return;
        try{ checkDeletedFromOpenList_(openRes2); }catch(eDel2){}
        if(String(currentBatchId || '') === '' || _deletedBatchIds.has(String(currentBatchId))) return; // 방금 삭제로 정리됨 — 이 폴링은 여기서 종료(정리 후 새 폴링이 이어짐)
        let switched = false;
        if(_waitingForNextBatchAfterCompletion){
          const trulyOpen2 = (openRes2.batches || []).filter(b => !b.recentlyCompleted && String(b.batchId) !== String(currentBatchId));
          if(openRes2.ok && trulyOpen2.length){
            const next2 = trulyOpen2.slice().sort((a, b) => {
              let ta = new Date(a.createdAt).getTime(); if (isNaN(ta)) ta = new Date(a.date).getTime() || 0;
              let tb = new Date(b.createdAt).getTime(); if (isNaN(tb)) tb = new Date(b.date).getTime() || 0;
              return tb - ta;
            })[0];
            console.log('✅ 완료된 배치 ' + currentBatchId + ' 에서 대기 중 새 배치 ' + next2.batchId + ' 발견 — 자동 전환');
            currentBatchId = next2.batchId;
            rememberBatch(currentBatchId);
            _waitingForNextBatchAfterCompletion = false;
            document.getElementById('batchLabel').innerHTML =
              `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · ${next2.date}`;
            switched = true;
          }
        }
        if(!switched){
          const found2 = (openRes2.batches || []).find(bb => String(bb.batchId) === String(currentBatchId));
          if(found2){
            document.getElementById('batchLabel').innerHTML =
              `<span class="status-dot live" id="liveDot"></span>배치 ${currentBatchId} · ${found2.date}`;
          } else if(openRes2 && openRes2.ok){
            verifyBatchStillExists_(currentBatchId); // 열린 목록에 없음 — 정상 완료된 배치인지 삭제된 배치인지 확인(5분에 한 번)
          }
        }
      }catch(e){ /* 실패해도 다음 폴링에서 다시 시도됨 */ }
    }
    // ★ 확정된 currentBatchId를 "진짜 실제로 보고 있는 배치"로 항상 같이
    //   기억해둠. override 모드로 들어가도 이 값은 안 바뀌므로, "다른 배치"/
    //   "지난 배치" 목록에서 이 값과 같은 배치를 다시 클릭했을 때 "그건 이미
    //   지금 보고 있는 실제 배치니까 override 모드로 들어갈 필요 없다"를
    //   판단할 수 있음.
    liveBatchId = currentBatchId;
    }

    // ★ 2026-09-30 통합(버그 수정) — override 모드(TV에서 임의의 다른 배치를
    //   골라 보는 중)와 라이브 모드(평소) 모두 이제 getSlotProgressForBatch_
    //   하나로 통일 — 항상 "이 배치 전용" 미러(mirror/slotProgress_{batchId})를
    //   먼저 시도하고, 3초 안에 없거나 너무 오래됐으면 안전하게 직접 조회로
    //   대체함. 예전엔 라이브 모드만 서버가 정한 "단 하나의 활성 배치"용 전역
    //   문서(board_slotProgress)를 썼는데, 그 문서는 열린 배치가 2개 이상이고
    //   활성 배치도 안 정해져 있으면 빈 슬롯을 써버려서 "보던 화면이 갑자기
    //   죽었다 살아나는" 버그의 원인이었음 — 자세한 이유는 위
    //   getSlotProgressForBatch_ 함수 주석 참고.
    const res = await getSlotProgressForBatch_(currentBatchId);
    if(mySeq !== pollSeq) return; // ★ 신규 — 핵심 가드: 이 응답이 도착하기 전에 더 최신 폴링(예: 방금 고른 다른 배치)이
                                  //   이미 시작됐다면, 이 낡은 응답은 절대 화면에 반영하지 않고 버림.
    if(!res.ok){
      // ★ 2026-09-25 긴급 수정(현장 지적 — "배치를 골랐는데 내용이 안 뜬다") —
      //   예전엔 조회가 실패해도 화면엔 아무 표시가 없어서, 클릭이 안 먹힌
      //   건지 서버 오류인지 구분할 방법이 전혀 없었음. 이제 실패하면 보드
      //   영역에 실제 오류 내용을 그대로 보여줌 — 다음 폴링(라이브는 8초,
      //   조회 모드도 자동 갱신됨)에서 성공하면 이 메시지는 자동으로 사라짐.
      const dot = document.getElementById('liveDot');
      if(dot) dot.className = 'status-dot off';
      const board = document.getElementById('board');
      if(board) board.innerHTML = `<div class="empty-state" style="color:#FF4D6D"><h2>⚠ 배치 정보를 불러오지 못했습니다</h2><p>${(res.error||'알 수 없는 오류').replace(/</g,'&lt;')}</p><p style="margin-top:6px; color:var(--text-dim);">잠시 후 자동으로 다시 시도합니다</p></div>`;
      return;
    }
    // ★ 2026-07-23 수정: manual 모드일 땐 batchLabel에 id='liveDot'인 도트가 없으므로
    //   (amber 'manual' 도트로 대체됨) null 체크 후 있을 때만 갱신.
    const dot = document.getElementById('liveDot');
    if(dot) dot.className = 'status-dot live';
    document.getElementById('doneCount').textContent = `${res.doneCount} / ${res.totalCount}`;
    document.getElementById('doneBar').style.width =
      (res.totalCount > 0 ? (res.doneCount / res.totalCount * 100) : 0) + '%';
    // ★ 2026-09-28 신규 — res._fresh(Apps Script 직접 조회로 방금 받아온 정확한 값)면
    // mirror/board_scanFast 보정치를 또 더하지 않음(이미 최신 값이라 중복 가산 방지).
    const slotsForRender = res._fresh ? res.slots : _applyFastScanDelta_(res.slots);
    renderBoard(slotsForRender, true);
    // ★ 2026-09-30 신규 — ②번 자동전환 트리거(모든 슬롯 초록→핑크 전환 완료).
    //   manualBatchOverride(수동으로 지난 배치 고정 중)일 땐 절대 호출 안 함 —
    //   작업자의 수동 선택이 항상 우선. fire-and-forget으로 호출(다음 폴링을
    //   막지 않음) — 전환이 필요하면 내부에서 알아서 pollOnce()를 다시 부름.
    if(!manualBatchOverride) checkAutoAdvanceOnFullyTaken_(slotsForRender);
  }catch(e){
    // ★ 2026-07-17 신규: 폴링 중 예상 못한 오류가 나도 콘솔에만 남기고
    //   다음 8초 뒤 폴링은 그대로 이어지게 함(화면이 아예 멈추지 않도록)
    console.error('pollOnce failed:', e);
  }
}

document.getElementById('btnSwitchBatchTV').onclick = async (e) => {

  //   ~15초)하지 않고, 이미 Firestore 미러로 계속 최신 상태를 유지 중인
  //   getOpenBatchesData_()를 사용 — 미러 연결 중이면 즉시(0초에 가깝게) 뜸.
  //   미러가 아직 준비 안 됐거나 끊겼으면 그 안에서 자동으로 직접 조회로 대체됨.
  const res = await getOpenBatchesData_();
  if(!res.ok){ dd.innerHTML = `<div class="tb-switch-empty" style="color:#FF4D6D">불러오기 실패</div>`; return; }
  const list = res.batches || [];
  // ★ 2026-09-11 신규 — 서버(getOpenBatches)가 최신순 정렬해서 주지만(재배포
  //   전 기기 대비, 그리고 지난 배치 목록에도 이미 적용된 것과 동일한 방어),
  //   클라이언트에서도 한 번 더 실제 시각값으로 방어적 재정렬.
  list.sort((a, b) => {
    let ta = new Date(a.createdAt).getTime(); if (isNaN(ta)) ta = new Date(a.date).getTime() || 0;
    let tb = new Date(b.createdAt).getTime(); if (isNaN(tb)) tb = new Date(b.date).getTime() || 0;
    return tb - ta;
  });
  if(!list.length){

    //   보이다가 그 다음부터 목록에서 빠짐(서버 getOpenBatches가 그렇게 걸러줌).
    const tag = isCurrent

      : (b.date === today ? `<span class="tb-sw-tag" style="background:var(--green-bg); color:var(--green)">오늘</span>` : `<span class="tb-sw-tag" style="background:var(--amber-bg); color:var(--amber)">다른 날짜</span>`);
    return `<div class="tb-switch-row" data-batch="${b.batchId}" data-date="${b.date}">

      dd.querySelectorAll('[data-batch]').forEach(r => {
        if(r === row){

      //   예전엔 누르자마자 목록 전체가 바로 사라져서 클릭이 인식됐는지 알 방법이
      //   없었음. 이제 고른 행을 즉시 "선택됨 · 불러오는 중"으로 바꾸고 나머지
      //   행은 흐리게 비활성화한 뒤, 실제로 화면이 다 뜨는 것까지 기다렸다가
      //   그제서야 목록을 닫음 — 클릭이 먹혔다는 게 눈에 바로 보임.
      container.querySelectorAll('[data-batch]').forEach(r => {
        if(r === row){
          r.classList.add('tb-sw-selected');
          const tagEl = r.querySelector('.tb-sw-tag, .tb-sw-loading-tag');
          if(tagEl){ tagEl.className = 'tb-sw-loading-tag'; tagEl.textContent = '⏳ 불러오는 중...'; }
        } else {
          r.classList.add('tb-sw-dimmed');
        }
      });
      manualBatchOverride = { batchId: row.dataset.batch, date: row.dataset.date };
      document.getElementById('manualBanner').classList.add('show');
      startViewOnlyTimer(); // ★ 10분 뒤 자동 복귀 카운트다운 시작(계속 보기로 고정도 가능)
      await pollOnce(); // 고른 배치로 즉시 갱신 — 이게 끝날 때까지 기다린 뒤에 목록을 닫음
      document.getElementById('batchHistoryDropdownTV').classList.remove('open');
    };
  });
}

// ★ 2026-09-30 신규(현장 지적 — "'다른 배치'는 바로 뜨는데 '지난 배치'는
// '불러오는 중...'이 한 번 보이고서야 뜬다") — 원인: "다른 배치"는 이미
// 실시간으로 계속 최신 상태를 받아두는 Firestore 미러(getOpenBatchesData_)를
// 읽어서 사실상 0초에 뜨는 반면, "지난 배치"(최근 14일)는 누를 때마다 매번
// Apps Script Web App에 새로 왕복 호출을 해서 1~3초 정도 걸렸던 것.
// 서버에 이 목록 전용 미러가 따로 없어서(추가하려면 FirestoreSync.gs를 새로
// 배포해야 함) 완전히 동일하게 만들 순 없지만, 클라이언트에서 마지막으로
// 받아온 결과를 잠깐 기억해뒀다가 재사용하는 방식으로 체감 속도를 맞춘다:
//   · 캐시가 있으면 "불러오는 중" 없이 그 자리에서 즉시 목록을 보여줌
//     ("다른 배치"와 동일한 체감).
//   · 캐시가 45초 넘게 지났으면, 보여주는 화면은 그대로 둔 채 뒤에서 조용히
//     새로 받아와서 캐시와 (열려 있다면) 화면을 갱신함.
//   · 캐시가 아예 없는 경우(이 기기에서 이번 세션 중 처음 여는 경우)에만
//     예전처럼 "불러오는 중..."이 잠깐 보임 — 페이지 로드 후 조용히 한 번
//     미리 받아두므로(아래 _prefetchTvHistory14_), 실제로는 거의 항상 이미
//     캐시가 있는 상태로 시작함.
let _tvHistory14Cache = null; // { list, fetchedAtMs }
let _tvHistoryDisplayMode = null; // '14' | 'calendar' | null(닫힘) — 배경 갱신이 화면을 다시 그려도 되는지 판단용
const TV_HISTORY_CACHE_TTL_MS = 45000;

function renderTvHistory14List_(list){
  const dd = document.getElementById('batchHistoryDropdownTV');
  _tvHistoryDisplayMode = '14';
  const moreBtn = `<div class="tb-switch-more" id="tbHistoryMoreBtn">🔍 더 예전 배치 찾기 (달력에서 날짜로 찾기)</div>`;
  if(!list.length){
    dd.innerHTML = `<div class="tb-switch-empty">최근 14일 안에 배치 기록이 없습니다</div>${moreBtn}`;
  } else {
    dd.innerHTML = list.map(b => tvHistoryRowHtml_(b)).join('') + moreBtn;
  }
  tvHistoryWireRows_(dd);
  const moreEl = document.getElementById('tbHistoryMoreBtn');
  if(moreEl) moreEl.onclick = (ev) => { ev.stopPropagation(); loadBatchHistoryList(365); };
}

function _sortBatchListNewestFirst_(list){
  // ★ 2026-09-04 신규 — 서버가 이미 최신순 정렬해서 주지만(재배포 전 기기 대비)
  //   클라이언트에서도 한 번 더 실제 시각값으로 방어적 재정렬.
  return list.slice().sort((a, b) => {
    let ta = new Date(a.createdAt).getTime(); if (isNaN(ta)) ta = new Date(a.date).getTime() || 0;
    let tb = new Date(b.createdAt).getTime(); if (isNaN(tb)) tb = new Date(b.date).getTime() || 0;
    return tb - ta;
  });
}

// 백그라운드로 14일 목록을 새로 받아와서 캐시를 갱신 — 화면에 로딩 표시를
// 전혀 띄우지 않고, 지금 14일 목록이 열려 있는 경우에만 조용히 다시 그림.
async function _refreshTvHistory14Cache_(){
  try{
    const res = await gasQueryWithRetry('getBatchHistoryList', { days: 14 });
    if(!res || !res.ok) return;
    const list = _sortBatchListNewestFirst_(res.batches || []);
    _tvHistory14Cache = { list, fetchedAtMs: Date.now() };
    const dd = document.getElementById('batchHistoryDropdownTV');
    if(dd && dd.classList.contains('open') && _tvHistoryDisplayMode === '14'){
      renderTvHistory14List_(list);
    }
  }catch(e){ console.warn('[지난 배치] 배경 갱신 실패(다음 클릭 때 다시 시도):', e); }
}
// ★ 페이지를 연 직후 한 번 조용히 미리 받아둠 — 그러면 작업자가 실제로
// "지난 배치" 버튼을 처음 누르는 순간에는 이미 캐시가 준비돼 있어서
// "불러오는 중..."이 거의 보이지 않음. 초기 슬롯 데이터 로딩과 겹치지
// 않도록 약간 늦춰서 시작.
setTimeout(_refreshTvHistory14Cache_, 3000);

async function loadBatchHistoryList(days){
  const dd = document.getElementById('batchHistoryDropdownTV');

  if(days === 14 && _tvHistory14Cache){
    // 캐시가 있으면 "불러오는 중" 없이 즉시 렌더 — "다른 배치"와 동일한 체감 속도.
    dd.classList.add('open');
    renderTvHistory14List_(_tvHistory14Cache.list);
    if(Date.now() - _tvHistory14Cache.fetchedAtMs > TV_HISTORY_CACHE_TTL_MS){
      _refreshTvHistory14Cache_(); // 화면은 그대로 둔 채 뒤에서 조용히 새로고침
    }
    return;
  }

  dd.innerHTML = `<div class="tb-switch-empty">불러오는 중...</div>`;
  dd.classList.add('open');
  _tvHistoryDisplayMode = null;

  const res = await gasQueryWithRetry('getBatchHistoryList', { days });
  if(!res.ok){ dd.innerHTML = `<div class="tb-switch-empty" style="color:#FF4D6D">불러오기 실패</div>`; return; }
  const list = _sortBatchListNewestFirst_(res.batches || []);

  if(days >= 365){
    // ★ 2026-09-04 신규(현장 요청) — 1년치를 끝없이 스크롤하는 목록 대신 달력으로
    //   보여줌. 서버 호출은 지금(days=365)과 완전히 동일하게 딱 한 번만 하고,
    //   그 결과를 화면에서 날짜별로 묶어서 달력으로 그리는 것뿐이라 속도엔
    //   전혀 영향 없음.
    _tvHistoryDisplayMode = 'calendar';
    _tvHistoryFullList = list;
    const mostRecentKey = list.length ? tvHistoryDateKey_(list[0]) : tvTodayKey_();
    _tvCalendarMonth = new Date(mostRecentKey + 'T00:00:00');
    _tvCalendarSelectedDate = null;
    renderTvHistoryCalendar();
    return;
  }

  // days === 14 (캐시가 없던 이번 세션 첫 조회) — 결과를 캐시에 저장해두고 렌더.
  // ★ 2026-08-25 신규(매니저 요청) — 계속 쌓이면 지저분하니 기본은 최근 14일치만.
  //   그래도 더 예전 것이 필요한 드문 경우를 위해 맨 아래에 "더 예전 배치 찾기"를
  //   달아둠(누르면 달력으로 전환).
  _tvHistory14Cache = { list, fetchedAtMs: Date.now() };
  renderTvHistory14List_(list);
}

function renderTvHistoryCalendar(){
  const dd = document.getElementById('batchHistoryDropdownTV');
  const y = _tvCalendarMonth.getFullYear();
  const m = _tvCalendarMonth.getMonth();

  const countsByDay = {};
  _tvHistoryFullList.forEach(b => {
    const key = tvHistoryDateKey_(b);
    countsByDay[key] = (countsByDay[key] || 0) + 1;
  });

  const first = new Date(y, m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayKey = tvTodayKey_();

  let cells = '';
  for(let i = 0; i < startWeekday; i++) cells += `<div class="tb-cal-cell tb-cal-empty"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const key = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const cnt = countsByDay[key] || 0;
    const cls = ['tb-cal-cell'];
    if(cnt > 0) cls.push('has-batch');
    if(key === todayKey) cls.push('is-today');
    if(key === _tvCalendarSelectedDate) cls.push('is-selected');
    cells += `<div class="${cls.join(' ')}" ${cnt > 0 ? `data-day="${key}"` : ''}>
      <span>${d}</span>
      ${cnt > 0 ? `<span class="tb-cal-dot">${cnt}건</span>` : ''}
    </div>`;
  }

  const weekdayLabels = ['일','월','화','수','목','금','토'].map(w => `<div class="tb-cal-wd">${w}</div>`).join('');

  let listHtml;
  if(_tvCalendarSelectedDate){
    const dayBatches = _tvHistoryFullList.filter(b => tvHistoryDateKey_(b) === _tvCalendarSelectedDate);
    listHtml = !dayBatches.length
      ? `<div class="tb-switch-empty">이 날짜엔 배치 기록이 없습니다</div>`
      : `<div style="margin-top:10px; border-top:1px solid var(--border); padding-top:10px;">
          <div style="font-size:11px; color:var(--text-dim); margin-bottom:6px;">${_tvCalendarSelectedDate} · ${dayBatches.length}건</div>
          ${dayBatches.map(b => tvHistoryRowHtml_(b)).join('')}
        </div>`;
  } else {
    listHtml = `<div class="tb-switch-empty" style="padding-top:10px;">배치가 있는 날짜(파란색 표시)를 눌러보세요</div>`;
  }

  dd.innerHTML = `
    <div class="tb-cal-header">
      <button class="tb-cal-nav" id="tbCalPrev" type="button">◀</button>
      <div class="tb-cal-title">${y}년 ${m + 1}월</div>
      <button class="tb-cal-nav" id="tbCalNext" type="button">▶</button>
    </div>
    <div class="tb-cal-grid">${weekdayLabels}${cells}</div>
    ${listHtml}
    <div class="tb-switch-more" id="tbHistoryBackBtn">← 최근 14일 목록으로</div>
  `;

  document.getElementById('tbCalPrev').onclick = (e) => { e.stopPropagation(); _tvCalendarMonth = new Date(y, m - 1, 1); _tvCalendarSelectedDate = null; renderTvHistoryCalendar(); };
  document.getElementById('tbCalNext').onclick = (e) => { e.stopPropagation(); _tvCalendarMonth = new Date(y, m + 1, 1); _tvCalendarSelectedDate = null; renderTvHistoryCalendar(); };
  document.getElementById('tbHistoryBackBtn').onclick = (e) => { e.stopPropagation(); loadBatchHistoryList(14); };
  dd.querySelectorAll('[data-day]').forEach(cell => {
    cell.onclick = (e) => { e.stopPropagation(); _tvCalendarSelectedDate = cell.dataset.day; renderTvHistoryCalendar(); };
  });
  tvHistoryWireRows_(dd);
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('batchHistoryDropdownTV');
  if(dd && dd.classList.contains('open') && !e.target.closest('#btnBatchHistoryTV') && !e.target.closest('#batchHistoryDropdownTV')){
    dd.classList.remove('open');
  }
});

/* ★ 2026-08-07 신규(매니저 요청) — 지난 배치를 보는 상태로 TV를 켜둔 채
 * 잊어버리는 것을 막는 자동 복귀. TV 현황판은 작업자들이 보면서 물건을 넣는
 * 화면이라, 옛날 배치가 떠 있으면 엉뚱한 슬롯에 넣는 사고로 이어질 수 있음.
 *  · 10분이 지나면 자동으로 "지금 작업 중인 배치"로 돌아감
 *  · 남은 시간을 초 단위로 보여줘서 갑자기 바뀌어도 당황하지 않게 함
 *  · 화면을 만지면(클릭·터치·키·마우스 이동) 다시 10분으로 초기화 —
 *    사람이 보고 있는 동안에는 바뀌지 않음
 *  · 버튼을 누르면 기다리지 않고 즉시 복귀 (예전 그대로)
 * ★ 2026-08-24 신규 — 작업자가 "📌 계속 보기" 버튼으로 자동복귀를 아예 꺼둘 수
 *   있음(예: 옛날 배치 이슈를 오래 들여다봐야 할 때). TV 자체는 터치·마우스
 *   이동이 거의 없어서(사람이 그냥 서서 보기만 함) 위 "화면을 만지면 초기화"
 *   방식만으로는 실제로 매 10분마다 되돌아가는 불편이 있었음 — 그 보완책.
 *   켜져 있는 동안엔 배너에 "고정됨"이 계속 표시돼서, 매니저가 다른 배치 화면인
 *   걸 잊고 방치하는 원래 사고 방지 목적은 여전히 유지됨(그냥 숨기지 않음).
 */
const VIEW_ONLY_AUTO_BACK_MS = 10 * 60 * 1000; // 10분
let viewOnlyDeadline = 0;
let viewOnlyTimer = null;
let viewOnlyPinned = false; // ★ 2026-08-24 신규 — true면 자동복귀 카운트다운을 멈추고 계속 고정 표시

function backToLiveNow(){
  manualBatchOverride = null;
  currentBatchId = null; // ★ 강제 초기화해야 다음 폴링이 배치가 바뀐 걸로 인식해서 라벨을 다시 그림
  _defaultBatchLocked = false; // ★ 2026-09-30 신규 — 복귀 시 "완료 안 된 배치 중 최신"을 다시 한번 새로 고름
  _waitingForNextBatchAfterCompletion = false; // ★ 복귀 시 대기 상태도 함께 초기화
  document.getElementById('manualBanner').classList.remove('show');
  stopViewOnlyTimer();
  viewOnlyPinned = false; // 복귀했으니 고정 상태도 초기화(다음에 다른 배치 볼 때 기본값부터 시작)
  updatePinButtonUI();
  pollOnce();
}

function stopViewOnlyTimer(){
  if(viewOnlyTimer){ clearInterval(viewOnlyTimer); viewOnlyTimer = null; }
  const el = document.getElementById('backToLiveCountdown');
  if(el) el.textContent = '';
}

function updatePinButtonUI(){
  const btn = document.getElementById('btnPinViewOnly');
  if(!btn) return;
  if(viewOnlyPinned){
    btn.textContent = '📌 고정됨(해제하기)';
    btn.style.background = 'var(--amber-bg)';
    btn.style.color = 'var(--amber)';
    btn.style.borderColor = 'var(--amber)';
  } else {
    btn.textContent = '📌 계속 보기';
    btn.style.background = 'var(--surface2)';
    btn.style.color = 'var(--text-dim)';
    btn.style.borderColor = 'var(--border2)';
  }
}

function togglePinViewOnly(){
  viewOnlyPinned = !viewOnlyPinned;
  updatePinButtonUI();
  if(viewOnlyPinned){
    const el = document.getElementById('backToLiveCountdown');
    if(el) el.textContent = '(고정됨 · 자동복귀 꺼짐)';
  } else {
    viewOnlyDeadline = Date.now() + VIEW_ONLY_AUTO_BACK_MS; // 다시 켜면 10분부터 재시작
  }
}
document.getElementById('btnPinViewOnly').onclick = togglePinViewOnly;

function startViewOnlyTimer(){
  viewOnlyDeadline = Date.now() + VIEW_ONLY_AUTO_BACK_MS;
  viewOnlyPinned = false; // 새로 다른 배치를 선택할 때마다 고정은 기본 꺼짐 상태로 시작
  updatePinButtonUI();
  if(viewOnlyTimer) clearInterval(viewOnlyTimer);
  viewOnlyTimer = setInterval(() => {
    if(!manualBatchOverride){ stopViewOnlyTimer(); return; }
    if(viewOnlyPinned) return; // ★ 고정된 동안은 카운트다운도, 자동복귀도 멈춤
    const left = viewOnlyDeadline - Date.now();
    const el = document.getElementById('backToLiveCountdown');
    if(left <= 0){ backToLiveNow(); return; }
    if(el){
      const m = Math.floor(left/60000), sec = Math.floor(left/1000)%60;
      el.textContent = '(' + m + ':' + String(sec).padStart(2,'0') + ' 후 자동 복귀)';
    }
  }, 1000);
}

// 사람이 화면을 보고 조작 중이면 자동 복귀를 미룸 (고정 중엔 어차피 카운트 안 하므로 무해)
['click','touchstart','keydown','mousemove'].forEach(ev => {
  document.addEventListener(ev, () => {
    if(manualBatchOverride && !viewOnlyPinned) viewOnlyDeadline = Date.now() + VIEW_ONLY_AUTO_BACK_MS;
  }, { passive: true });
});

document.getElementById('btnBackToLive').onclick = backToLiveNow;


// ★ 2026-11-10 — 창 크기·글꼴이 바뀌면 SKU/PCS 줄을 다시 맞춤(카드 다시 그리지 않음)

  let _t = null;
  const refit = () => { clearTimeout(_t); _t = setTimeout(() => { try { const b = document.getElementById('board'); if(b) fitMetaRows_(b.querySelectorAll('.card-metarow.mr-grid'), 12); } catch(e){} }, 120); };
  window.addEventListener('resize', refit);
  try { if(document.fonts && document.fonts.ready) document.fonts.ready.then(refit); } catch(e){}
