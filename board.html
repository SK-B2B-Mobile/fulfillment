<!DOCTYPE html>
<html lang="ko">
<head>
<script>
/* ★ 2026-11-10 - 서버 조회 쌓임 방지(gasGuard). 화면 모양·기능 변화 없음.
 *   문제(11-09 17:13~, 11-10 07:14): 구글 시트가 몇 분 멈추면 화면이 20~25초 뒤 기다림을 끊는데,
 *   Apps Script 쪽 실행은 끝까지 돌고 있는 상태에서 다음 조회(폴링)·JSONP 대체 요청을 또 보내
 *   같은 조회가 서버에 수십 개씩 쌓임 → 멈춤이 풀린 뒤에도 20분 넘게 먹통.
 *   해결: Apps Script 로 가는 '읽기(get·list·ver…)' 요청만, 같은 요청은 서버에서 실제로 끝날 때까지
 *   한 번에 1개만 보내고(그동안 온 같은 요청은 1개로 묶어 바로 뒤에 1번만 보냄), 화면이 기다림을 끊어도
 *   진짜 요청은 끝까지 추적(최대 6분). 저장(POST)·다른 주소는 전혀 건드리지 않음.
 *   비상 시: 주소 끝에 ?gg=off 를 붙이거나 localStorage 'sk_gasguard_off'='1' → 예전과 100% 동일.
 */
(function(){
  try{
    if (window.__GG) return;
    var OFF = false;
    try{ OFF = /[?&]gg=off\b/.test(location.search) || localStorage.getItem('sk_gasguard_off') === '1'; }catch(e){}
    var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
    var HOST = 'https://script.google.com/macros/';
    var READ_OP = /^(get|list|ver$|check|search|lookup|load)/i;
    var HARD_CAP_MS = 330000;   // Apps Script 최대 실행 6분 안쪽
    var slots = {};             // key -> { running: Promise<Response>|null, queued: Promise<Response>|null }
    var stats = { started: 0, joined: 0, queued: 0, skippedJsonp: 0 };

    function parse(url){
      try{
        var u = new URL(String(url), location.href);
        if (String(u.href).indexOf(HOST) !== 0) return null;
        var op = u.searchParams.get('op') || '';
        if (!op || !READ_OP.test(op)) return null;
        var keys = []; u.searchParams.forEach(function(v, k){ if (k !== 't' && k !== '_ts' && k !== 'callback' && k !== '_') keys.push(k + '=' + v); });
        keys.sort();
        return u.origin + u.pathname + '?' + keys.join('&');
      }catch(e){ return null; }
    }
    function isGet(init){ var m = init && init.method ? String(init.method).toUpperCase() : 'GET'; return m === 'GET'; }

    function startReal(key, input, init){
      var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      var opts = {}; if (init) { for (var k in init) { if (k !== 'signal') opts[k] = init[k]; } }
      if (ctrl) opts.signal = ctrl.signal;
      var cap = setTimeout(function(){ try{ if (ctrl) ctrl.abort(); }catch(e){} }, HARD_CAP_MS);
      stats.started++;
      var p = nativeFetch(input, opts);
      var s = slots[key];
      var done = function(){ clearTimeout(cap); if (s.running === p) s.running = null; };
      p.then(done, done);
      s.running = p;
      return p;
    }

    // 화면(호출한 쪽)의 기다림 끊기(signal)는 그 화면에만 적용 - 진짜 요청은 계속 추적
    function forCaller(p, init){
      var sig = init && init.signal;
      var cloned = p.then(function(r){ return r.clone(); });
      if (!sig) return cloned;
      return new Promise(function(res, rej){
        var abortErr = function(){ try{ return new DOMException('The user aborted a request.', 'AbortError'); }catch(e){ var er = new Error('AbortError'); er.name = 'AbortError'; return er; } };
        if (sig.aborted) { rej(abortErr()); return; }
        var onAbort = function(){ rej(abortErr()); };
        sig.addEventListener('abort', onAbort);
        cloned.then(function(r){ sig.removeEventListener('abort', onAbort); res(r); }, function(e){ sig.removeEventListener('abort', onAbort); rej(e); });
      });
    }

    function guardedFetch(input, init){
      var url = (typeof input === 'string') ? input : (input && input.url);
      var key = (!OFF && nativeFetch && isGet(init) && !(input && typeof input !== 'string' && input.method && String(input.method).toUpperCase() !== 'GET')) ? parse(url) : null;
      if (!key) return nativeFetch(input, init);
      var s = slots[key] || (slots[key] = { running: null, queued: null });
      if (!s.running){
        return forCaller(startReal(key, input, init), init);
      }
      if (!s.queued){
        stats.queued++;
        var prev = s.running;
        s.queued = prev.then(function(){}, function(){}).then(function(){
          s.queued = null;
          return s.running ? s.running : startReal(key, input, init);
        });
      } else {
        stats.joined++;
      }
      return forCaller(s.queued, init);
    }

    // JSONP(스크립트 태그) 조회도 같은 요청이 서버에서 도는 동안은 겹쳐 보내지 않음:
    //   앞 요청이 끝날 때까지 기다렸다가(최대 waitMs) 보냄 - 못 기다리면 예전 JSONP 시간 초과와 같은 실패로 끝냄.
    function jsonp(url, waitMs, starter){
      var key = OFF ? null : parse(url);
      if (!key) return starter();
      var s = slots[key] || (slots[key] = { running: null, queued: null });
      var idle = function(){ return !s.running && !s.queued && !s.jsonpBusy; };
      var go = function(){
        s.jsonpBusy = true; stats.jsonpRun = (stats.jsonpRun || 0) + 1;
        var p = Promise.resolve().then(starter);
        var fin = function(){ s.jsonpBusy = false; };
        p.then(fin, fin);
        return p;
      };
      if (idle()) return go();
      stats.skippedJsonp++;
      return new Promise(function(res, rej){
        var t0 = Date.now(), limit = Math.max(1000, Number(waitMs) || 15000);
        (function tick(){
          if (idle()) { go().then(res, rej); return; }
          if (Date.now() - t0 >= limit) { rej(new Error('jsonp timeout (server busy - previous request still running)')); return; }
          setTimeout(tick, 250);
        })();
      });
    }

    window.__GG = {
      off: OFF,
      jsonp: jsonp,
      busy: function(url){ if (OFF) return false; var key = parse(url); return !!(key && slots[key] && (slots[key].running || slots[key].queued)); },
      stats: function(){ var running = 0; for (var k in slots) if (slots[k].running) running++; return { running: running, started: stats.started, queued: stats.queued, joined: stats.joined, jsonpWaited: stats.skippedJsonp, jsonpRun: stats.jsonpRun || 0 }; }
    };
    if (!OFF && nativeFetch) window.fetch = guardedFetch;
  }catch(e){ /* 실패하면 예전 방식 그대로 */ }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Fulfillment · 총량피킹 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070D; --surface:#0D1220; --surface2:#131B30;
  --border:#212B45;
  --border2:#2A3555;
  --text:#EDF1F9; --text-dim:#8A93AC;
  --amber:#F59E0B; --amber-bg:rgba(245,158,11,0.12);
  --green:#22C55E; --green-bg:rgba(34,197,94,0.12);
  --gray:#3A4560; --gray-bg:rgba(58,69,96,0.25);
  --sans:'Inter',-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; height:100%; overflow:hidden;}

/* ═══════════════ 상단 헤더 ═══════════════ */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 40px; border-bottom:2px solid var(--border); background:var(--surface);}
.tb-left{display:flex; align-items:center; gap:20px;}
.tb-logo{width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg,#8B5CF6,#3B82F6); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px;}
.tb-title{font-size:26px; font-weight:800; letter-spacing:-0.01em;}
.tb-sub{font-family:var(--mono); font-size:14px; color:var(--text-dim); margin-top:2px;}
.tb-right{display:flex; align-items:center; gap:36px;}
.tb-stat{text-align:right;}
.tb-stat-label{font-family:var(--mono); font-size:12px; color:var(--text-dim); letter-spacing:0.08em; text-transform:uppercase;}
.tb-stat-value{font-family:var(--mono); font-size:34px; font-weight:800; line-height:1.1;}
.tb-clock{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--text-dim); min-width:200px; text-align:right;}
.tb-progress-outer{width:280px;}
.tb-progress-bar{height:10px; background:var(--surface2); border-radius:5px; overflow:hidden; margin-top:6px;}
.tb-progress-bar > div{height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); transition:width 0.6s;}

.status-dot{width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:8px;}
.status-dot.live{background:var(--green); box-shadow:0 0 12px var(--green);}
.status-dot.off{background:var(--gray);}
.status-dot.manual{background:var(--amber); box-shadow:0 0 12px var(--amber);}

/* ★ 2026-07-23 신규 — TV 자체 "다른 배치 조회" 버튼/드롭다운
   (batch.html의 활성 배치 전환과 별개 · 여기서 배치를 골라도
   다른 기기/작업자 폰에는 전혀 영향 없음, TV 혼자만 조회) */
/* ★ 2026-09-30 1차 수정(현장 지적 — 배너와 버튼이 너무 붙어 있고 버튼이 잘 안
   보임) — align-self:flex-start로 버튼을 배너 포함 전체 영역의 맨 위에 고정. */
/* ★ 2026-09-30 2차 수정(현장 재지적 — 버튼이 너무 위쪽으로 쏠려서 전체적으로
   균형이 안 맞아 보이고, 테두리도 여전히 잘 안 보이며, 크기도 좀 더 커야 함) —
   버튼을 .tb-titlerow(제목+배치정보+Built by 3줄 블록)에만 같이 묶어서, 배너가
   뜨든 안 뜨든(배너는 이제 이 줄 아래로 완전히 분리됨) 항상 그 3줄 블록 높이
   기준으로만 세로 중앙정렬 되게 함 — flex-start 트릭이 더는 필요 없음.
   버튼 크기도 한 단계 키우고(패딩/글자 확대), 테두리를 더 밝은 톤으로 바꿔서
   어두운 배경에서 경계가 또렷이 보이도록 함. */
.tb-titlerow{display:flex; align-items:center; gap:20px;}
.tb-switch-wrap{position:relative;}
.tb-switch-btn{font-family:var(--sans); font-size:14.5px; font-weight:700; color:#F5F8FF; background:var(--surface2); border:1.5px solid #46527A; border-radius:10px; padding:11px 22px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.03);}
.tb-switch-btn:hover{background:var(--border2); color:var(--text); border-color:var(--amber);}
.tb-switch-dd{display:none; position:absolute; top:calc(100% + 8px); left:0; z-index:200; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px; min-width:340px; box-shadow:0 10px 30px rgba(0,0,0,0.5); max-height:calc(100vh - 160px); overflow-y:auto;}
.tb-switch-dd.open{display:block;}
.tb-switch-row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 8px; border-radius:8px; cursor:pointer;}
.tb-switch-row:hover{background:var(--surface2);}
.tb-switch-row .tb-sw-id{font-family:var(--mono); font-weight:800; font-size:14px;}
.tb-switch-row .tb-sw-meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
.tb-switch-row .tb-sw-tag{font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; white-space:nowrap;}
.tb-switch-empty{padding:12px 8px; font-size:12px; color:var(--text-dim);}
.tb-switch-more{padding:10px 8px; margin-top:4px; border-top:1px solid var(--border); font-size:12px; color:#3EB8F5; text-align:center; cursor:pointer;}
/* ★ 2026-09-25 신규(현장 지적) — "배치를 눌러도 선택했는지 안 했는지 헷갈린다"
 * 문제 수정. 예전엔 누르자마자 목록 박스 전체가 바로 사라져서 클릭이 실제로
 * 먹혔는지 확인할 방법이 전혀 없었음. 이제 고른 행은 곧바로 "선택됨/불러오는
 * 중" 표시로 바뀌고, 나머지 행은 흐리게 비활성화되며, 실제로 그 배치 화면이
 * 다 뜬 뒤에야 목록이 닫힘 — 클릭이 인식됐다는 게 눈으로 바로 보임. */
.tb-switch-row.tb-sw-selected{background:var(--surface2); cursor:default; pointer-events:none;}
.tb-switch-row.tb-sw-selected .tb-sw-id{color:#3B82F6;}
.tb-switch-row.tb-sw-dimmed{opacity:0.35; pointer-events:none; cursor:default;}
.tb-sw-loading-tag{font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; white-space:nowrap; background:rgba(59,130,246,0.15); color:#3B82F6;}
/* ★ 2026-09-04 신규(현장 요청) — "1년 전체"를 끝없이 스크롤하는 목록 대신
   달력으로. 데이터는 지금과 완전히 동일하게 한 번만 받아오고(getBatchHistoryList
   days=365), 화면에서 날짜별로 묶어서 그리는 것뿐이라 서버 호출·속도엔 영향 없음. */
.tb-cal-header{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 8px;}
.tb-cal-nav{background:transparent; border:1px solid var(--border); border-radius:6px; color:var(--text); padding:4px 10px; cursor:pointer; font-size:12px;}
.tb-cal-nav:hover{border-color:#3EB8F5; color:#3EB8F5;}
.tb-cal-title{font-size:13px; font-weight:700;}
.tb-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.tb-cal-wd{font-size:10px; color:var(--text-dim); text-align:center; padding:2px 0;}
.tb-cal-cell{position:relative; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:6px; font-size:12px; color:var(--text-dim2);}
.tb-cal-cell.tb-cal-empty{visibility:hidden;}
.tb-cal-cell.has-batch{background:rgba(62,184,245,0.12); color:var(--text); cursor:pointer; font-weight:700;}
.tb-cal-cell.has-batch:hover{background:rgba(62,184,245,0.22);}
.tb-cal-cell.is-today{box-shadow:inset 0 0 0 1px var(--amber);}
.tb-cal-cell.is-selected{background:#3EB8F5; color:#04283B;}
.tb-cal-dot{font-size:9px; margin-top:1px; line-height:1;}
.tb-switch-more:hover{text-decoration:underline;}
.manual-banner{display:none; align-items:center; flex-wrap:wrap; row-gap:6px; gap:10px; background:var(--amber-bg); border:1px solid var(--amber); color:var(--amber); font-family:var(--mono); font-weight:700; font-size:13px; padding:8px 16px; border-radius:8px; margin-top:8px;}
.manual-banner.show{display:flex;}
.manual-banner button{font-family:var(--sans); font-size:12px; font-weight:700; background:none; border:1px solid var(--amber); color:var(--amber); border-radius:6px; padding:4px 10px; cursor:pointer;}
.manual-banner button:hover{background:var(--amber); color:#1a1300;}

/* ═══════════════ 미배분 경보 배너 (★ 2026-08-05 신규) ═══════════════
   "다른 고객사에겐 스캔됐는데 이 고객사는 완전히 0인" 패턴을 발견하면 뜸.
   빨간 계열로 눈에 확 띄게 — 방치하면 며칠씩 안 채워진 채 숨어있던 문제라
   조용한 배지가 아니라 확실히 알아차릴 수 있는 배너가 필요함. */
.unfulfilled-banner{display:none; align-items:center; gap:10px; background:rgba(239,68,68,0.14); border:1px solid #FF4D6D; color:#FF4D6D; font-family:var(--mono); font-weight:700; font-size:13px; padding:8px 16px; border-radius:8px; margin-top:8px; cursor:pointer;}
.unfulfilled-banner.show{display:flex;}
.unfulfilled-banner:hover{background:rgba(239,68,68,0.22);}
.unfulfilled-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:9000; align-items:center; justify-content:center;}
.unfulfilled-modal-overlay.show{display:flex;}
.unfulfilled-modal{background:var(--surface); border:1px solid #FF4D6D; border-radius:14px; width:min(720px, 92vw); max-height:80vh; display:flex; flex-direction:column; overflow:hidden;}
.unfulfilled-modal-head{padding:18px 22px; border-bottom:1px solid var(--border2); display:flex; align-items:center; justify-content:space-between;}
.unfulfilled-modal-head h3{margin:0; color:#FF4D6D; font-size:16px;}
.unfulfilled-modal-head button{background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1;}
.unfulfilled-modal-body{padding:14px 22px; overflow-y:auto;}
.unfulfilled-modal-note{font-size:12px; color:var(--text-dim); line-height:1.6; margin-bottom:14px; padding:10px 12px; background:var(--surface2); border-radius:8px;}
.unfulfilled-row{padding:10px 0; border-bottom:1px solid var(--border2); font-size:13px;}
.unfulfilled-row .ur-top{display:flex; justify-content:space-between; font-weight:700;}
.unfulfilled-row .ur-slot{color:var(--amber); font-family:var(--mono);}
.unfulfilled-row .ur-meta{color:var(--text-dim); font-size:12px; margin-top:3px; font-family:var(--mono);}

/* ═══════════════ 슬롯 그리드 ═══════════════ */
/* ★ 2026-08-18 신규 — 하단 여백(padding-bottom)을 넉넉히 줌. 배치 고객사가
   30개를 넘어 "추가 배정 구역"(31번 이상)이 생기면, 스크롤을 끝까지 내려도
   그 마지막 줄의 "패킹존 이동" 체크박스가 화면 맨 아래 가장자리에 거의 딱
   붙어버려서(여유 공간 없음) 터치가 잘 안 먹는 문제가 있었음. */
.board{padding:26px 36px 200px 36px; height:calc(100vh - 108px); overflow-y:auto;}
.zone-label{font-family:var(--mono); font-size:15px; color:var(--text-dim); letter-spacing:0.1em; margin:18px 0 12px; text-transform:uppercase;}
.zone-label:first-child{margin-top:0;}
.grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:16px;}
.grid.small{grid-template-columns:repeat(5, 1fr);}

.card{background:var(--surface); border:2px solid var(--border); border-radius:16px; padding:18px 20px; min-height:190px; display:flex; flex-direction:column; transition:all 0.4s;}
.card.waiting{opacity:0.55;}
.card.active{border-color:var(--amber); background:var(--amber-bg); animation:pulse 1.5s ease-in-out infinite;}
/* ★ 2026-07-13 변경: 완료 슬롯을 테두리만 초록으로 강조하던 것에서, 칸 전체를
   초록색으로 꽉 채우도록 변경 — 멀리서도(TV 화면 특성상) 한눈에 "다 됐다"가
   확 들어오도록. 텍스트는 초록 배경 위에서 잘 읽히는 진한 색으로 전부 맞춤. */
.card.done{border-color:var(--green); background:var(--green);}
.card.flash{animation:flashDone 1.8s ease-out 2;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.4);} 50%{box-shadow:0 0 0 10px rgba(245,158,11,0);}}
@keyframes flashDone{0%{box-shadow:0 0 40px var(--green);} 100%{box-shadow:0 0 0 rgba(34,197,94,0);}}

.card-top{display:flex; justify-content:space-between; align-items:flex-start;}
.card-slot{font-family:var(--mono); font-size:48px; font-weight:800; color:var(--text-dim);}
.card.active .card-slot{color:var(--amber);}
.card.done .card-slot{color:#04140D;}
.card-ship{font-family:var(--mono); font-size:19px; font-weight:800; padding:6px 12px; border-radius:6px; letter-spacing:0.04em;}
/* ★ 2026-07-13 신규: 배송타입(UPS/PU/TK)별 색상 구분 — batch.html과 동일한 배색 사용 */
.card-ship.ship-UPS{background:rgba(139,92,246,0.18); color:#B39CFF;}
.card-ship.ship-PU{background:rgba(34,211,238,0.18); color:#67E4F5;}
.card-ship.ship-TK{background:rgba(163,230,53,0.20); color:#BEF264; box-shadow:inset 0 0 0 1px rgba(190,242,100,0.45);} /* ★ 2026-11-11 v8 — 진행 중 카드 테두리(주황)와 겹쳐 안 보이던 TK 를 라임색으로 */
/* ★ 2026-10-02 신규 — 'PU & TK'도 sales.html/batch.html과 동일한 핑크색으로
   구분. 이전엔 ship-other(회색)로 PU/TK/UPS와 구분 없이 뭉뚱그려 보였음. */
.card-ship.ship-PUTK{background:rgba(244,114,182,0.18); color:#F6A8D1;}
.card-ship.ship-other{background:rgba(58,69,96,0.35); color:var(--text-dim);}
.card.done .card-ship{background:rgba(4,20,13,0.18); color:#04140D;}
.card-cust{font-size:30px; font-weight:700; margin-top:10px; line-height:1.2; flex:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.card.done .card-cust{color:#04140D;}
/* ★ 2026-07-23 신규 — 인보이스 번호는 실물 박스 라벨과 대조하는 용도라 TV에도 필요하다는
   현장 요청으로 추가. card-cust(고객사명)보다는 작지만, 다른 메타 정보보다는 눈에 띄게. */
.card-invoice{font-family:var(--mono); font-size:20px; font-weight:800; color:var(--text-dim); margin-top:2px; letter-spacing:0.02em;}
.card.done .card-invoice{color:#04140D; opacity:0.85;}
.card-bottom{margin-top:12px;}
.card-qty{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
.card.active .card-qty, .card.done .card-qty{color:var(--text);}
.card.done .card-qty{color:#04140D;}
.card-metarow{display:flex; justify-content:space-between; font-family:var(--mono); font-size:24px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
.card.active .card-metarow, .card.done .card-metarow{color:var(--text);}
.card.done .card-metarow{color:#04140D;}
.card-sku{opacity:0.85;}
.card-bar{height:11px; background:rgba(255,255,255,0.08); border-radius:5px; overflow:hidden;}
.card-bar > div{height:100%; background:var(--amber); transition:width 0.5s;}
.card.done .card-bar{background:rgba(4,20,13,0.18);}
.card.done .card-bar > div{background:#04140D;}
/* ★ 2026-07-23 신규 — "패킹존 이동" 체크박스 (구 .card-done-tag 정적 문구를 대체).
   clearSlot(슬롯비우기)과 무관한 순수 표시용 상태. 체크하면 카드 전체가 블루로
   바뀌어서, 초록(=완료했지만 아직 패킹존으로 안 옮김, 신경 써야 함)과 한눈에 구분됨. */
.card-pack-check{display:none; align-items:center; gap:8px; cursor:pointer; margin-top:10px;}
.card.done .card-pack-check{display:flex;}
.card.done .card-pack-check .label{font-family:var(--mono); font-size:18px; font-weight:800; color:#04140D; white-space:nowrap;}
/* ★ 2026-07-24 수정 — 완료(초록) 카드와 똑같은 방식: 테두리만이 아니라
   카드 전체 배경을 진한 핑크로 꽉 채움(라인=배경 완전히 통일). 텍스트도
   초록카드처럼 어두운 색으로. 애니메이션도 훨씬 강하고 눈에 띄게(밝기+그림자
   크게 진동, 주기도 짧게). */
.card.done.moved{background:#EC4899; border-color:#EC4899;
  animation: packMovedGlow 1.6s ease-in-out infinite;
}
@keyframes packMovedGlow{
  0%, 100%{ background:#EC4899; border-color:#EC4899; box-shadow: 0 0 10px 2px rgba(236,72,153,0.35); }
  50%{ background:#FF6FBF; border-color:#FFB3DD; box-shadow: 0 0 45px 12px rgba(255,111,191,0.95); }
}
.card.done.moved .card-slot, .card.done.moved .card-cust, .card.done.moved .card-invoice,
.card.done.moved .card-metarow, .card.done.moved .card-sku{color:#04140D !important;}
.card-pack-check .box{width:22px; height:22px; border-radius:5px; border:2px solid #04140D; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.card.done.moved .card-pack-check .box{border-color:#04140D; background:#04140D;}
.card-pack-check .box svg{display:none; width:14px; height:14px;}
.card.done.moved .card-pack-check .box svg{display:block;}
.card.done.moved .card-pack-check .label{color:#04140D !important;}
/* ★ 2026-08-04 신규 — 3단계째: 출고 작업자가 실제로 가져간 상태(taken).
   핑크 카드를 한 번 더 누르면 이 상태가 됨. 초록/핑크와 같은 설계 언어
   (밝은 배경 + 진한 글자)를 유지해서 글씨·숫자가 확실히 보이게 함.
   요청대로 애니메이션 없음 — 가만히 있는 고정 파란색. */
.card.done.taken{background:#3EB8F5; border-color:#3EB8F5; animation:none;}
.card.done.taken .card-slot, .card.done.taken .card-cust, .card.done.taken .card-invoice,
.card.done.taken .card-metarow, .card.done.taken .card-sku{color:#04140D !important;}
.card.done.taken .card-bar{background:rgba(4,20,13,0.18);}
.card.done.taken .card-bar > div{background:#04140D;}
.card.done.taken .card-issue-badge{color:#04140D; background:rgba(4,20,13,0.18); border-color:rgba(4,20,13,0.4);}
.card.done.taken .card-pack-check .box{border-color:#04140D; background:#04140D;}
.card.done.taken .card-pack-check .box svg{display:block;}
.card.done.taken .card-pack-check .label{color:#04140D !important;}
/* ★ 2026-08-24 신규 — 오출고 방지: 최종 4단계째 "2ND VERIFICATION COMPLETE"(보라).
   ★★★ 파랑(taken)의 기존 의미는 절대 안 바뀜 — .card.done.taken 클래스는 그대로
   유지된 채, 이 규칙이 그 위에 색만 오버라이드해서 얹힘(선택자 우선순위로 이김).
   파랑 다음의 마지막 단계이며, 검증이 끝나야만 붙는 class="verified"로만 켜짐.
   ★ 주황(진행중 active 상태와 색이 겹쳐 헷갈릴 수 있음)이 아니라 보라를 사용 —
   기존 5색(회색/주황/초록/핑크/파랑) 어디와도 안 겹치는 "인증 완료" 느낌의 색. */
.card.done.taken.verified{background:#8B5CF6; border-color:#8B5CF6; animation:none;}
.card.done.taken.verified .card-slot, .card.done.taken.verified .card-cust, .card.done.taken.verified .card-invoice,
.card.done.taken.verified .card-metarow, .card.done.taken.verified .card-sku{color:#FFFFFF !important;}
.card.done.taken.verified .card-bar{background:rgba(255,255,255,0.22);}
.card.done.taken.verified .card-bar > div{background:#FFFFFF;}
.card.done.taken.verified .card-issue-badge{color:#FFFFFF; background:rgba(255,255,255,0.2); border-color:rgba(255,255,255,0.45);}
.card.done.taken.verified .card-pack-check .box{border-color:#FFFFFF; background:#FFFFFF;}
.card.done.taken.verified .card-pack-check .box svg{display:block; stroke:#8B5CF6 !important;}
.card.done.taken.verified .card-pack-check .label{color:#FFFFFF !important;}
.card-empty{display:flex; align-items:center; justify-content:center; height:100%; font-family:var(--mono); font-size:20px; color:var(--text-dim); opacity:0.4;}

.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; gap:16px;}
.empty-state h2{font-size:28px; color:var(--text-dim);}
.empty-state p{font-family:var(--mono); font-size:16px; color:var(--text-dim); opacity:0.6;}

/* ★ 2026-07-16 신규 — 이슈(EXP/NF/Damaged/OOS) 뱃지 + 상세 모달 */
.card-top-right{display:flex; align-items:center; gap:8px;}
.card-issue-badge{font-family:var(--mono); font-size:16px; font-weight:800; color:#FF4D6D; background:rgba(255,77,109,0.15); border:1.5px solid rgba(255,77,109,0.5); border-radius:8px; padding:3px 9px; cursor:pointer;}
.card-issue-badge:hover{background:rgba(255,77,109,0.28);}
.card.done .card-issue-badge{color:#04140D; background:rgba(4,20,13,0.18); border-color:rgba(4,20,13,0.4);}

.issue-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:100; align-items:center; justify-content:center;}
.issue-modal-overlay.open{display:flex;}
.issue-modal{background:var(--surface); border:2px solid var(--border); border-radius:18px; width:min(920px, 94vw); max-height:86vh; display:flex; flex-direction:column; overflow:hidden;}
.issue-modal-head{display:flex; justify-content:space-between; align-items:center; padding:22px 26px; border-bottom:2px solid var(--border);}
.issue-modal-head h3{font-size:24px; font-weight:800;}
.issue-modal-close{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:38px; height:38px; border-radius:10px; font-size:16px; cursor:pointer;}
.issue-modal-body{padding:18px 26px; overflow-y:auto; display:flex; flex-direction:column; gap:12px;}
.issue-modal-row{background:rgba(255,77,109,0.06); border:1px solid rgba(255,77,109,0.3); border-radius:12px; padding:14px 18px;}
/* ★ 2026-11-05 신규 — 이슈 즉시 반영(저장 중/저장됨/실패) 표시 */
.issue-modal-row.iss-row-pending{border-style:dashed; border-color:rgba(245,158,11,0.6); background:rgba(245,158,11,0.06);}
.issue-modal-row.iss-row-fail{border-color:#ef4444; background:rgba(239,68,68,0.10);}
.issue-modal-row.iss-row-deleting{opacity:.5;}
.issue-modal-row.iss-row-deleting .issue-modal-name, .issue-modal-row.iss-row-deleting .issue-modal-qty{text-decoration:line-through;}
.iss-pend{margin-top:8px; font-size:13px; font-weight:700; border-radius:8px; padding:7px 10px; line-height:1.5;}
.iss-pend.saving{color:#fbbf24; background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.35);}
.iss-pend.saved{color:#4ade80; background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.35);}
.iss-pend.fail{color:#fca5a5; background:rgba(239,68,68,0.12); border:1px solid #ef4444;}
.iss-pend-err{font-weight:500; font-size:12px; opacity:.9; word-break:break-all;}
.iss-pend-actions{display:flex; gap:8px; margin-top:8px;}
.iss-pend-retry,.iss-pend-dismiss,.iss-items-retry{cursor:pointer; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:700; border:1px solid #ef4444; background:transparent; color:#fca5a5;}
.iss-pend-retry{background:#ef4444; color:#fff;}
.iss-items-retry{margin-top:8px; border-color:#f59e0b; color:#fbbf24;}
.issue-new-form-submit[disabled]{opacity:.55; cursor:default;}
.issue-modal-row-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.issue-modal-reason{font-family:var(--mono); font-size:15px; font-weight:800; color:#FF4D6D;}
.issue-modal-qty{font-family:var(--mono); font-size:20px; font-weight:800;}
.issue-modal-name{font-size:17px; font-weight:700; margin-bottom:4px;}
.issue-modal-meta{font-family:var(--mono); font-size:13px; color:var(--text-dim);}
.issue-modal-note{margin-top:6px; font-size:14px; color:var(--text-dim); font-style:italic;}
.issue-modal-edit-btn{margin-top:10px; width:100%; padding:9px; background:none; border:1px solid var(--border2); border-radius:8px; color:var(--text-dim); font-size:13px; font-weight:700; cursor:pointer;}
.issue-modal-edit-btn:hover{background:rgba(255,255,255,0.06); color:var(--text);}

/* ★ 2026-07-23 신규 — TV에서도 카드를 클릭해 이슈를 조회/추가할 수 있게 함
   (기존엔 이미 이슈가 있는 카드의 배지를 눌러야만 "조회"만 가능했음) */
.card{cursor:pointer;}
.issue-modal-empty{font-size:14px; color:var(--text-dim); text-align:center; padding:10px 0;}
.issue-new-form{background:rgba(255,255,255,0.03); border:1px solid var(--border2); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.issue-new-form-title{font-size:13px; color:var(--text-dim); font-weight:800;}
.issue-new-form label{font-size:12px; color:var(--text-dim); font-weight:700;}
.issue-new-form select, .issue-new-form input{width:100%; padding:10px 12px; background:var(--surface); border:1px solid var(--border2); border-radius:8px; color:var(--text); font-size:14px; font-family:var(--sans); margin-top:4px;}
.issue-new-form-row{display:flex; gap:10px;}
.issue-new-form-row > div{flex:1;}
.issue-new-form-submit{margin-top:2px; padding:12px; background:rgba(255,77,109,0.15); border:1px solid #FF4D6D; color:#FF4D6D; border-radius:8px; font-size:14px; font-weight:800; cursor:pointer;}
.issue-new-form-submit:hover{background:rgba(255,77,109,0.25);}
.issue-edit-form{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
.issue-edit-form select, .issue-edit-form input{width:100%; padding:9px 10px; background:var(--bg); border:1px solid var(--border2); border-radius:6px; color:var(--text); font-size:14px; box-sizing:border-box;}
.issue-edit-actions{display:flex; gap:8px;}
.issue-edit-cancel, .issue-edit-save{flex:1; padding:9px; border-radius:6px; border:none; font-weight:700; font-size:13px; cursor:pointer;}
.issue-edit-cancel{background:var(--surface2); color:var(--text-dim); border:1px solid var(--border2);}
.issue-edit-save{background:#FF4D6D; color:#fff;}
.issue-edit-save:disabled{opacity:0.6;}
.issue-edit-delete{margin-top:4px; width:100%; padding:8px; background:none; border:1px dashed rgba(255,77,109,0.4); border-radius:6px; color:#FF4D6D; font-size:12px; font-weight:600; cursor:pointer;}
.issue-edit-delete:hover{background:rgba(255,77,109,0.1);}
.issue-edit-delete:disabled{opacity:0.6;}

/* ═══════════════ ★ 2026-08-24 신규 — 패킹 검증 모달(오출고 방지) ═══════════════ */
.pack-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:200; align-items:center; justify-content:center;}
.pack-modal-overlay.open{display:flex;}
.pack-modal{background:var(--surface); border:2px solid #8B5CF6; border-radius:18px; width:min(880px, 94vw); max-height:92vh; display:flex; flex-direction:column; overflow:hidden;}
.pack-modal-head{padding:20px 26px; border-bottom:2px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.pack-modal-head h3{font-size:22px; font-weight:800;}
.pack-modal-head .sub{font-family:var(--mono); font-size:13px; color:var(--text-dim); margin-top:4px;}
.pack-modal-close{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); width:38px; height:38px; border-radius:10px; font-size:16px; cursor:pointer;}
.pack-modal-scanrow{padding:16px 26px; border-bottom:1px solid var(--border2); display:flex; gap:10px; align-items:center; background:rgba(139,92,246,0.08);}
.pack-modal-scanrow input{flex:1; padding:16px 18px; font-size:20px; font-family:var(--mono); font-weight:700; background:var(--bg); border:2px solid #8B5CF6; border-radius:10px; color:var(--text);}
.pack-modal-scanrow input:focus{outline:none; box-shadow:0 0 0 3px rgba(139,92,246,0.35);}
.pack-modal-progress{padding:12px 26px; display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:14px; font-weight:700; color:var(--text-dim); border-bottom:1px solid var(--border2);}
.pack-modal-progress .n{font-size:22px; color:var(--text); font-weight:800;}
.pack-modal-progress-bar{height:8px; background:var(--surface2); border-radius:4px; overflow:hidden; margin:0 26px;}
.pack-modal-progress-bar > div{height:100%; background:linear-gradient(90deg,#F59E0B,#8B5CF6); transition:width 0.4s;}
.pack-modal-body{padding:14px 26px; overflow-y:auto; flex:1;}
.pack-line{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-radius:10px; border:1px solid var(--border2); margin-bottom:8px; background:rgba(255,255,255,0.02);}
.pack-line.done{border-color:rgba(139,92,246,0.5); background:rgba(139,92,246,0.1);}
.pack-line-name{font-size:15px; font-weight:700;}
.pack-line-meta{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:2px;}
.pack-line-qty{font-family:var(--mono); font-size:18px; font-weight:800; white-space:nowrap;}
.pack-line.done .pack-line-qty{color:#8B5CF6;}
.pack-line-check{font-size:20px; margin-left:10px;}
.pack-modal-flash{position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; transition:opacity 0.15s;}
.pack-modal-flash.show-ok{background:rgba(139,92,246,0.4); opacity:1;}
.pack-modal-flash.show-bad{background:rgba(239,68,68,0.45); opacity:1;}
.pack-modal-msg{padding:10px 26px; font-size:14px; font-weight:700; text-align:center;}
.pack-modal-msg.ok{color:#A78BFA;}
.pack-modal-msg.bad{color:#FF4D6D;}
.pack-modal-footer{padding:16px 26px; border-top:2px solid var(--border); display:flex; gap:10px;}
.pack-modal-footer button{flex:1; padding:14px; border-radius:10px; font-size:15px; font-weight:800; cursor:pointer; border:none;}
.pack-btn-print{background:var(--surface2); color:var(--text); border:1px solid var(--border2) !important;}
.pack-print-group{position:relative; flex:1; display:flex;}
.pack-print-group .pack-btn-print{flex:1; border-radius:10px 0 0 10px !important;}
.pack-print-toggle{width:34px; flex:0 0 34px; background:var(--surface2); border:1px solid var(--border2); border-left:none; border-radius:0 10px 10px 0; color:var(--text-dim); cursor:pointer; font-size:11px;}
.pack-print-menu{display:none; position:absolute; bottom:100%; left:0; right:0; margin-bottom:6px; background:var(--surface2); border:1px solid var(--border2); border-radius:8px; overflow:hidden; z-index:20;}
.pack-print-menu.open{display:block;}
.pack-print-menu button{width:100%; text-align:left; padding:10px 12px; background:none; border:none; color:var(--text); font-size:12.5px; cursor:pointer; border-radius:0 !important;}
.pack-print-menu button:hover{background:rgba(255,255,255,0.08);}
.pack-btn-complete{background:#8B5CF6; color:#FFFFFF;}
.pack-btn-complete:disabled{opacity:0.35; cursor:not-allowed;}
.pack-btn-force{background:none; border:1px dashed rgba(255,77,109,0.5) !important; color:#FF4D6D; font-size:11px !important; font-weight:600 !important; flex:0 0 auto !important; padding:14px 12px !important;}
.pack-worker-row{padding:10px 26px 0; display:flex; gap:10px; align-items:center;}
.pack-worker-row label{font-size:12px; color:var(--text-dim); font-weight:700; white-space:nowrap;}

<!-- ═══════════════════════════════════════════════════════════
     ★ 2026-09 신규 — Firestore 미러 구독 (v2 부분 이전)
     ------------------------------------------------------------
     board.html이 실제로 호출하던 getActiveBatch/getBatch/getOpenBatches/
     getSlotProgress/getUnfulfilledSkuAlerts 함수의 "로직"은 전혀 안 바꿈.
     Apps Script(FirestoreSync.gs)가 1분마다 그 함수들의 결과를 그대로
     Firestore mirror/* 문서에 복사해두고, 이 페이지는 그 문서를 실시간
     구독(onSnapshot)만 함 — 원본 계산은 여전히 Google Sheets 기준.
     이 스크립트는 type="module"이라 문서 파싱이 끝난 뒤(하단 classic
     <script>보다 실행이 늦을 수도 빠를 수도 있음) 실행되므로, 아래 classic
     스크립트 쪽에서는 window._subscribeMirror가 아직 없을 수 있다고 보고
     짧은 간격으로 기다렸다가 붙는 방식(_waitForMirrorInit)을 씀.
     ═══════════════════════════════════════════════════════════ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBG4HmlCg4CoJPoCbOi-ZE6wQwY2u88XeA",
    authDomain: "sk-b2b-fulfillment.firebaseapp.com",
    projectId: "sk-b2b-fulfillment",
    storageBucket: "sk-b2b-fulfillment.firebasestorage.app",
    messagingSenderId: "1053449174138",
    appId: "1:1053449174138:web:d1f81b0c05abe6fcf4cfc3",
    measurementId: "G-QBTQ1E86Y6"
  };

  try {
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);

    // classic <script>(아래)에서 이 함수를 통해 mirror 문서를 구독함.
    // docPath 예: 'board_activeBatch', 'board_batch', 'board_slotProgress' 등.
    // ★ 2026-09-28 신규(긴급) — 실제 장애로 확인됨: Apps Script의 하루 UrlFetch
    // 호출 한도가 초과되면(오늘 실제로 발생), 서버가 Firestore에 아무것도 새로
    // 못 쓰게 되어 이 미러 문서들이 전부 "마지막으로 성공했던 시점"에 멈춰버림.
    // 브라우저는 Firestore에 여전히 정상 연결돼 있어서(읽기는 이 한도와 무관)
    // FIRESTORE_MIRROR_OK는 계속 true로 남고, 결과적으로 "오래된 값을 정상인 것
    // 처럼" 계속 보여주는 사고가 났음(SKU/PCS 숫자가 실제보다 훨씬 낮게 표시됨).
    // 이제 문서마다 "실제로 값이 바뀐(=서버 쓰기가 성공한) 마지막 시각"을
    // 이 브라우저 시계 기준으로 따로 기록해두고(_mirrorFreshness), 이걸로
    // "이 데이터가 너무 오래됐는지"를 판단할 수 있게 함(아래 window._mirrorAgeMs).
    // 서버 시각 문자열을 파싱하지 않고 순수히 "이 브라우저가 마지막으로 변화를
    // 감지한 시각"만 쓰므로 시간대 문제와 무관하게 항상 정확함.
    window._mirrorFreshness = {}; // docPath -> { lastUpdatedAt: 서버가 적어둔 문자열, seenAtMs: 이 값이 마지막으로 "바뀐" 걸 감지한 브라우저 시각 }
    window._mirrorAgeMs = function(docPath){
      const f = window._mirrorFreshness[docPath];
      return f ? (Date.now() - f.seenAtMs) : Infinity; // 한 번도 못 받았으면 무한대(=항상 오래된 것으로 취급)
    };
    window._subscribeMirror = function(docPath, onUpdate){
      const ref = doc(db, 'mirror', docPath);
      onSnapshot(ref, (snap) => {
        if(!snap.exists()) return;
        try{
          const raw = snap.data();
          const serverUpdatedAt = raw.updatedAt || null;
          const prev = window._mirrorFreshness[docPath];
          if(!prev || prev.lastUpdatedAt !== serverUpdatedAt){
            window._mirrorFreshness[docPath] = { lastUpdatedAt: serverUpdatedAt, seenAtMs: Date.now() };
          }
          const payload = JSON.parse(raw.data);
          onUpdate(payload);
        }catch(e){ console.error('[mirror] JSON 파싱 실패 (' + docPath + '):', e); }
      }, (err) => {
        console.error('[mirror] onSnapshot 에러 (' + docPath + '):', err);
      });
    };

    // ★ 2026-09-24 신규(Board 실시간 반영 Phase 1) — mirror/board_scanFast 문서는
    // 위 _subscribeMirror와 달리 "data" JSON 문자열로 안 감싸져 있음(batch.html이
    // Firestore increment()로 slots.<슬롯번호> 필드를 직접 누적해나가는 원시
    // 필드 구조라서). 그래서 이 문서 전용으로 별도의 얕은 구독 함수를 둠 —
    // 원본 계산(정본 값)은 전혀 안 건드리고, 화면에 "정본 값 + 최근 보정치"를
    // 잠깐 더해서 보여주기 위한 용도로만 씀(아래 classic 스크립트 참고).
    window._subscribeScanFastNative = function(onUpdate){
      const ref = doc(db, 'mirror', 'board_scanFast');
      onSnapshot(ref, (snap) => {
        onUpdate(snap.exists() ? snap.data() : null);
      }, (err) => {
        console.error('[fastScan] onSnapshot 에러:', err);
      });
    };

    console.log('✅ Firestore 미러 연결 준비 완료');
  } catch(e) {
    // Firestore 연결 자체가 실패해도(네트워크 차단 등) 이 페이지가 완전히
    // 멈추면 안 되므로, window._subscribeMirror를 그냥 안 만들어두고 끝냄.
    // 아래 classic 스크립트가 이걸 감지해서 예전 방식(Apps Script 직접
    // 폴링)으로 자동으로 계속 동작함.
    console.error('❌ Firestore 초기화 실패 — 기존 방식(Apps Script 직접 폴링)으로 계속 동작합니다:', e);
  }
</script>

<script>
// ═══════════════════════════════════════════════════════════
// ★★★ CONFIG — 반드시 채워야 작동합니다 (batch.html과 동일한 값) ★★★
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbykK9DWjem9ORHxfR_mpdZl5DVh-en0D6JpCdIuel305QmfqxoNU_NqSnjkhFk401hI/exec',
};
const GAS_READY = CONFIG.GAS_URL.startsWith('https://script.google.com/');

// ★ 2026-09 신규 — Firestore 미러 캐시. window._subscribeMirror가 데이터를
// 채워주고, 아래 pollOnce()/pollUnfulfilledAlerts()는 (연결에 성공했으면)
// 네트워크 호출 대신 이 캐시를 읽음. FIRESTORE_MIRROR_OK가 true일 때만
// 캐시를 신뢰하고, 그렇지 않으면 기존 gasQuery 직접 호출로 자동 대체됨.
let FIRESTORE_MIRROR_OK = false;
// ★ 2026-09-30 수정 — slotProgress/unfulfilledAlerts(둘 다 전역 단일 배치용)
// 필드는 더 이상 안 씀(이유: 위 getSlotProgressForBatch_, 아래
// getUnfulfilledAlertsForBatch_ 함수 주석 참고). 배치별 데이터는 전부
// *ByBatch에 배치ID로 구분해서 저장.
let _mirrorCache = { activeBatch:null, batch:null, openBatches:null, slotProgressByBatch:{}, unfulfilledAlertsByBatch:{} };

/* ═══════════════════════════════════════════════════════════
 * ★ 2026-09-25 신규(현장 요청 — "다른 배치로 전환할 때 최대한 빨리") —
 * "조회 모드"(manualBatchOverride, "다른 배치"/"지난 배치"에서 고른 임의의
 * 배치)는 지금까지 mirror/board_slotProgress(활성 배치 전용)를 못 쓰고 매번
 * Apps Script에 직접 getSlotProgress를 호출했음 — 배치가 크면 캐시가 없는
 * 상태에서 시트 전체를 훑어야 해서 수 초~20초 가까이 걸렸던 원인.
 *
 * 서버(FirestoreSync.gs)가 이제 열린 배치 상위 8개(최근 생성 순)에 대해
 * mirror/slotProgress_{batchId} 문서를 1분마다 미리 채워두므로, 조회 모드로
 * 들어갈 때 그 배치 전용 문서를 구독해서 있으면 즉시(보통 1초 이내) 쓰고,
 * 3초 안에 안 오면(14일 지난 진짜 오래된 배치이거나 아직 이번 1분 주기가 안
 * 돈 경우) 기존처럼 직접 호출로 안전하게 대체한다.
 *
 * ★ 2026-09-30 긴급 수정(현장 버그 — "보고 있던 배치가 갑자기 죽었다가
 * 다시 살아난다") — 원인을 찾음: 평소(실시간) 모드는 이 배치 전용 미러가
 * 아니라 mirror/board_slotProgress라는 "서버가 정한 단 하나의 활성 배치"용
 * 전역 문서만 읽고 있었다. 그런데 이 전역 문서는 서버(FirestoreSync.gs)가
 * ①매니저가 지정한 활성 배치, ②없으면 오늘 배치, ③그것도 없고 열린 배치가
 * 정확히 1개일 때만 그 배치를 쓰고, 그 외(열린 배치가 2개 이상인데 활성
 * 배치도 없는 — 바로 지금 이 창고의 실제 상황!)에는 슬롯을 통째로 빈
 * 배열로 써버린다. 그러니 1분 동기화 주기마다 "이 기기가 실제로 보고 있는
 * 배치"와 무관하게 화면이 통째로 비었다 채워졌다를 반복한 것 — 오늘 우리가
 * board.html에 만든 "기기별 독립 배치 선택" 기능과 애초에 안 맞는 낡은
 * 전역 문서였다.
 * 해결: 실시간 모드도 조회 모드와 완전히 동일하게, 이미 서버가 열린 배치
 * 전체에 대해 1분마다 채워주는 배치 전용 문서(mirror/slotProgress_{batchId})
 * 만 쓰도록 통일한다. 전역 board_slotProgress는 더 이상 읽지 않음 — 그래서
 * "몇 개의 배치가 열려있는지", "서버가 어느 배치를 활성으로 보는지"와 완전히
 * 무관하게, 이 기기가 지금 보기로 정한 배치의 데이터만 항상 정확하게 표시됨.
 * ═══════════════════════════════════════════════════════════ */
let _subscribedSlotProgressBatchIds = new Set();
let _pendingSlotProgressResolvers = {}; // batchId -> [resolve, ...]
function _ensureBatchSlotProgressSubscription(batchId){
  if(!FIRESTORE_MIRROR_OK || !window._subscribeMirror) return;
  if(_subscribedSlotProgressBatchIds.has(batchId)) return;
  _subscribedSlotProgressBatchIds.add(batchId);
  window._subscribeMirror('slotProgress_' + batchId, (p) => {
    _mirrorCache.slotProgressByBatch[batchId] = p;
    const resolvers = _pendingSlotProgressResolvers[batchId];
    if(resolvers && resolvers.length){
      resolvers.forEach(r => r(p));
      _pendingSlotProgressResolvers[batchId] = [];
    }
    // ★ 2026-09-30 수정 — 예전엔 조회 모드(manualBatchOverride)일 때만 바로
    //   다시 그렸음. 이제 실시간 모드도 이 배치 전용 문서를 쓰므로, "지금 이
    //   기기가 실제로 보고 있는 배치"(조회 모드든 평소 모드든) 값이 막
    //   도착했으면 두 경우 모두 즉시 다시 그림 — 다음 30초 폴링까지 안 기다림.
    const viewingBatchId = manualBatchOverride ? manualBatchOverride.batchId : currentBatchId;
    if(String(viewingBatchId) === String(batchId)) pollOnce();
  });
}
// ★ 2026-09-30 통합 — 예전엔 "실시간 모드"(getSlotProgressLiveData_, 전역
// board_slotProgress 사용)와 "조회 모드"(getSlotProgressOverrideData_, 배치
// 전용 미러 사용)가 서로 다른 소스를 썼다. 위에서 설명한 버그의 근본 원인이
// 바로 그 불일치였으므로, 이제 두 모드 모두 이 함수 하나로 통일 — 항상
// "그 배치 전용" 미러(mirror/slotProgress_{batchId})를 먼저 쓰고, 없거나
// (신선도 검사 결과) 너무 오래됐으면 Apps Script 직접 호출로 안전하게 대체.
// ★ 2026-09-28 원래 board_slotProgress에 쓰던 신선도 기준을 그대로 이전 —
// Apps Script 쪽 1분 동기화가 정상이면 이 값은 항상 90초 이내로 갱신돼 있어야
// 함. 그보다 오래됐다면(예: Firestore 쓰기 쿼터 초과) 더 이상 신뢰하지 않고
// Apps Script Web App을 브라우저가 직접 호출해서 정확한 값을 새로 받아옴.
const SLOT_PROGRESS_STALE_MS = 90 * 1000;
async function getSlotProgressForBatch_(batchId){
  if(FIRESTORE_MIRROR_OK && window._subscribeMirror){
    _ensureBatchSlotProgressSubscription(batchId);
    const cached = _mirrorCache.slotProgressByBatch[batchId];
    if(cached){
      // ★ 2026-09-28 신규(board_slotProgress에 쓰던 신선도 검사를 여기로 이전) —
      //   Apps Script 쪽 1분 동기화가 정상이면 이 값은 항상 90초 이내로 갱신돼
      //   있어야 함. 그보다 오래됐다면(예: Firestore 쓰기 쿼터 초과) 이 배치의
      //   미러는 더 이상 신뢰하지 않고 직접 조회로 대체.
      const ageMs = window._mirrorAgeMs ? window._mirrorAgeMs('slotProgress_' + batchId) : Infinity;
      if(ageMs < SLOT_PROGRESS_STALE_MS) return cached;
      console.warn('[slotProgress] ' + batchId + ' 미러가 ' + Math.round(ageMs/1000) + '초 동안 안 바뀜 — 직접 조회로 대체(정확성 우선)');
    } else {
      // 이 배치를 이 기기에서 처음 구독하는 순간 — 최대 3초까지 첫 값 도착을 기다림
      const fromMirror = await new Promise(resolve => {
        if(!_pendingSlotProgressResolvers[batchId]) _pendingSlotProgressResolvers[batchId] = [];
        _pendingSlotProgressResolvers[batchId].push(resolve);
        setTimeout(() => resolve(null), 3000); // 3초 안에 안 오면 포기하고 직접 호출로 대체
      });
      if(fromMirror) return fromMirror;
    }
    try {
      const fresh = await gasQuery('getSlotProgress', { batchId });
      // ★ 직접 조회 결과는 이미 "지금 이 순간"의 정확한 값이므로, 호출부에서
      // mirror/board_scanFast의 낙관적 "보정치"를 또 더하면(_applyFastScanDelta_)
      // 이미 반영된 스캔이 중복으로 더해져 실제보다 부풀려질 수 있음. _fresh
      // 플래그로 표시해서, 호출부가 이 경우엔 보정치를 건너뛰도록 함.
      if(fresh && fresh.ok) return Object.assign({}, fresh, { _fresh: true });
    } catch(e){ console.warn('[slotProgress] ' + batchId + ' 직접 조회도 실패 — 오래됐더라도 마지막 미러 값 사용:', e); }
    return _mirrorCache.slotProgressByBatch[batchId] || { ok:false }; // 직접 조회까지 실패하면 최후 수단으로 오래된 값이라도 반환
  }
  return await gasQuery('getSlotProgress', { batchId: batchId });
}

// ★ 2026-09-24 신규(Board 실시간 반영 Phase 1) — batch.html이 스캔 직후 곧바로
// Firestore에 직접 더해놓는 "임시 보정치"(mirror/board_scanFast). 정본 값
// (_mirrorCache.slotProgress, 1분 주기)이 아직 못 따라온 구간만 잠깐 메워서
// 보여주는 용도이며, 아래 syncToFirestore가 매 분 정본을 새로 쓸 때마다

// 그대로 캐시해뒀다가 renderBoard 직전에만 참고함.
let _scanFastCache = null;

// ★ 2026-09-24 신규 — slots 배열에 _scanFastCache를 살짝 덧씌워서(개수만),
// TV가 다음 1분 정본 갱신을 기다리지 않고 방금 스캔된 수량을 바로 보여주게 함.
//   · 대상 배치가 다르면(다른 배치를 보정치가 가리키면) 아무것도 안 건드림.
//   · 절대 "완료(초록/done)"로는 승격하지 않음 — SKU별 완료 판정(doneSku)은
//     서버(정본)만 계산하므로, 여기서 섣불리 초록으로 바꾸면 2026-07-29에 실제
//     있었던 사고("수량은 찼는데 특정 SKU가 안 채워졌는데도 완료로 표시")를
//     그대로 재현할 위험이 있음 — 그래서 waiting → active까지만 밀어올리고,
//     effectiveTotal을 넘겨서 보여주지도 않음(Math.min으로 캡).
// ★ 2026-09-28 긴급 수정 — mirror/board_scanFast는 모든 배치가 함께 쓰는 문서라,
// 예전엔 slots.<슬롯번호>가 배치 구분 없이 그냥 더해져서 다른 배치를 동시에
// 스캔 중인 작업자의 수량이 지금 보고 있는 배치의 같은 슬롯 번호에 잘못 얹히는
// 사고가 실제로 발생함(batch.html의 정확한 값과 TV 화면이 크게 어긋났음).
// 이제 slots가 배치ID로 한 번 더 감싸져 있으므로(slots.<batchId>.<슬롯번호>),
// 반드시 현재 배치의 하위 맵만 읽어서 다른 배치의 증분이 섞이지 않게 함.
// ★ 2026-11-13 v9 긴급 수정 — 예전엔 정본(미러에서 받은 슬롯 목록)을 '그 자리에서' 고쳐서(s.scanned += 보정치),
//   화면을 다시 그릴 때마다(스캔이 들어올 때마다 여러 번) 보정치가 계속 '또' 더해졌음 → 막대가 끝까지 찼다가,
//   정본이 새로 도착하면(1분 안팎) 원래 값으로 돌아가는 현상(11-13 15:17 실측: 실제 120 인데 TV 147·144·141·138).
//   이제 슬롯을 복사해서 그 복사본에만 더함 → 정본은 그대로, 몇 번을 다시 그려도 '정본 + 보정치 한 번'.
function _applyFastScanDelta_(slots){
  if(!_scanFastCache || !slots || !slots.length) return slots;
  const deltas = (_scanFastCache.slots && _scanFastCache.slots[String(currentBatchId || '')]) || {};
  return slots.map(s0 => {
    const d = Number(deltas[String(s0.slotNum)]) || 0;
    if(d <= 0) return s0;
    if(typeof s0.scanned !== 'number' || typeof s0.effectiveTotal !== 'number') return s0;
    const boosted = Math.min(s0.effectiveTotal, s0.scanned + d);
    if(boosted <= s0.scanned) return s0;
    const s = Object.assign({}, s0); // 복사본만 고침
    s.scanned = boosted;
    if(s.status === 'waiting') s.status = 'active'; // done 승격은 절대 안 함(위 설명 참고)
    return s;
  });
}

function _waitForMirrorInit(tries){
  tries = tries || 0;
  if(window._subscribeMirror){
    FIRESTORE_MIRROR_OK = true;
    window._subscribeMirror('board_activeBatch', (p) => { _mirrorCache.activeBatch = p; if(!manualBatchOverride) pollOnce(); });
    window._subscribeMirror('board_batch',        (p) => { _mirrorCache.batch = p; });
    window._subscribeMirror('board_openBatches',  (p) => { _mirrorCache.openBatches = p; try{ checkDeletedFromOpenList_(p); }catch(e){} });
    // ★ 2026-09-30 제거 — mirror/board_slotProgress(서버가 정한 "단 하나의
    // 활성 배치"용 전역 문서) 구독을 완전히 뺐다. 이게 "보던 배치가 갑자기
    // 죽었다 살아나는" 버그의 원인이었음(자세한 설명은 위 getSlotProgressForBatch_

    // 필요할 때마다 알아서 pollOnce()를 불러준다.
    // ★ 2026-09-30 제거 — mirror/board_unfulfilledAlerts(전역 단일 배치용)도
    // 동일한 이유로 뺐다. "미배분 제품" 배너도 이제 배치 전용 문서
    // (unfulfilledAlerts_{batchId}, _ensureBatchUnfulfilledAlertsSubscription)로만
    // 구독되고, 그 구독 콜백이 필요할 때마다 알아서 pollUnfulfilledAlerts()를 불러준다.
    if(window._subscribeScanFastNative){
      // ★ 2026-09-24 신규 — 이게 이번 기능의 핵심. 배치 전용 슬롯 진행 미러와
      // 똑같이, 이 값이 바뀔 때마다 즉시 pollOnce()를 한 번 더 불러서 화면을
      // 바로 다시 그린다. FIRESTORE_MIRROR_OK 상태에서는 pollOnce() 안의
      // getSlotProgressForBatch_가 네트워크 호출 없이 로컬 캐시(_mirrorCache)만
      // 읽으므로(=Apps Script/Sheets에 추가 부담 0), 스캔마다 이게 자주 불려도

      window._subscribeScanFastNative((p) => { _scanFastCache = p; if(!manualBatchOverride) pollOnce(); });
    }

    return;
  }
  if(tries > 100){ // 약 5초 기다려도 안 뜨면 예전 방식(Apps Script 직접 폴링)으로 계속

  }

_waitForMirrorInit();

 * 하나만 읽었는데, 열린 배치가 2개 이상이고 활성 배치도 안 정해져 있으면

async function getUnfulfilledAlertsForBatch_(batchId){

/* ★ 2026-10-19 신규(현장 요청) — 삭제된 배치 실시간 정리.
 *  이 화면은 "어느 배치를 볼지"를 기기마다 독립적으로 정하지만(기존 원칙 유지), 그 배치가 삭제되면
 *  서버가 내려주는 deletedBatchIds(mirror/board_openBatches)로 즉시 알아채서 슬롯·기억값을 모두 비우고
 *  열린 배치 중 최신으로 넘어가거나(없으면) 대기 화면으로 간다. 정상 "완료"된 배치는 해당 없음. */
const _deletedBatchIds = new Set();
const _batchExistCheckAt = {};
function forgetRememberedBatch_(id){
  try{
    const raw = JSON.parse(localStorage.getItem(LAST_BATCH_KEY) || 'null');
    if(!raw || !id || String(raw.id) === String(id)) localStorage.removeItem(LAST_BATCH_KEY);
  }catch(e){}
  if(!id || String(LAST_BATCH_ID) === String(id)) LAST_BATCH_ID = null;
}
function purgeDeletedBatch_(id){
  id = String(id || '');
  if(!id) return;
  _deletedBatchIds.add(id);
  forgetRememberedBatch_(id);
  const viewing = manualBatchOverride ? String(manualBatchOverride.batchId) : String(currentBatchId);
  if(viewing !== id && String(currentBatchId) !== id && String(liveBatchId) !== id) return; // 내가 보던 배치가 아니면 기억값만 정리
  console.warn('🗑 보던 배치 ' + id + ' 가 삭제됨 — 화면을 정리하고 다른 배치/대기 화면으로 이동합니다');
  try{ _slotsByInvoice = {}; renderBoard([], false); }catch(e){}
  try{ document.getElementById('doneCount').textContent = '0 / 0'; document.getElementById('doneBar').style.width = '0%'; }catch(e){}
  liveBatchId = null;
  backToLiveNow(); // 수동 조회 모드 해제 + 다시 "열린 배치 중 최신"으로 판정 (없으면 대기 화면)
}
function checkDeletedFromOpenList_(p){
  if(!p || !p.ok || !Array.isArray(p.deletedBatchIds)) return;
  p.deletedBatchIds.forEach(id => _deletedBatchIds.add(String(id)));
  if(LAST_BATCH_ID && _deletedBatchIds.has(String(LAST_BATCH_ID))) forgetRememberedBatch_(LAST_BATCH_ID);
  const v = manualBatchOverride ? manualBatchOverride.batchId : currentBatchId;
  if(v && _deletedBatchIds.has(String(v))) purgeDeletedBatch_(v);
}
// 삭제 버튼을 거치지 않고 시트에서 Batches 행을 직접 지운 경우의 안전망: 열린 목록에 없는 배치만, 5분에 한 번 서버에 존재 여부를 확인.
async function verifyBatchStillExists_(id){
  id = String(id || '');
  if(!id) return;
  const now = Date.now();
  if(now - (_batchExistCheckAt[id] || 0) < 300000) return;
  _batchExistCheckAt[id] = now;
  try{
    const r = await gasQuery('getBatch', { batchId: id });
    if(r && r.ok === false && /not found/i.test(String(r.error || ''))) purgeDeletedBatch_(id);
  }catch(e){ /* 네트워크 문제는 삭제로 오판하지 않음 */ }
}

// ★ 2026-08-19 신규(긴급) — 오늘 하루 종일 batch.html/board.html/sk-worker
//   전부에서 "Access to fetch ... blocked by CORS policy" 에러가 간헐적으로
//   발생. 직접 주소 접속(navigation)은 항상 정상 응답하는데 fetch()만 계속
//   막히는 걸로 봐서, Apps Script의 script.google.com→script.googleusercontent.com
//   리다이렉트 구간에서 CORS 허용 헤더가 불안정하게 실리는 구글 쪽 고질적인
//   문제로 보임(서버 자체는 정상 — 직접 접속하면 항상 200 OK가 나옴).
//   <script> 태그로 데이터를 받아오는 JSONP 방식은 애초에 CORS 검사 대상이
//   아니라서 이 문제를 원천적으로 피해감. sk-worker에 이미 있던 방식과 동일.
//   서버(Code.gs json_())가 이미 callback= 파라미터를 지원하고 있어서 별도
//   서버 수정 없이 바로 적용 가능.
let _jsonpCounter = 0;
// ★ 2026-11-10 — 같은 조회가 서버에서 아직 도는 중이면 겹쳐 보내지 않음(gasGuard, 맨 위 스크립트 참고)
function jsonpGet(url, timeoutMs){ if (window.__GG && window.__GG.jsonp) return window.__GG.jsonp(url, timeoutMs || 15000, function(){ return jsonpGetRaw_(url, timeoutMs); }); return jsonpGetRaw_(url, timeoutMs); }
function jsonpGetRaw_(url, timeoutMs){
  return new Promise((res, rej) => {
    const cbName = '__jsonp_' + (++_jsonpCounter) + '_' + Date.now();
    const timer = setTimeout(() => { cleanup(); rej(new Error('jsonp timeout')); }, timeoutMs || 15000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cbName]; }catch(e){}
      const s = document.getElementById(cbName);
      if(s && s.parentNode) s.parentNode.removeChild(s);
    }
    window[cbName] = (data) => { cleanup(); res(data); };
    const script = document.createElement('script');
    script.id = cbName;
    script.onerror = () => { cleanup(); rej(new Error('jsonp error')); };
    const sep = url.indexOf('?') >= 0 ? '&' : '?';
    script.src = url + sep + 'callback=' + cbName;
    document.head.appendChild(script);
  });
}

async function gasQueryWithRetry(op, params, retries){
  // ★ 2026-08-19 재수정(긴급) — 재시도 2번(총 3번 시도)이 혼잡할 때 요청을
  //   과도하게 증폭시키는 게 확인돼서, 1번(총 2번 시도)으로 줄이고 지터를
  //   크게 넣어서 여러 기기가 정확히 같은 타이밍에 몰려서 재시도하지 않게 함.
  //   이제 이 함수는 "사람이 직접 누른 동작"(다른 배치 선택, 슬롯 클릭 등)에만
  //   쓰임 — 반복 폴링 안에서는 안 씀(그쪽은 다음 폴링이 알아서 재시도 역할을 함).
  const maxRetries = (retries === undefined) ? 1 : retries;
  let res = await gasQuery(op, params);
  for(let attempt = 1; !res.ok && attempt <= maxRetries; attempt++){
    const jitter = Math.floor(Math.random() * 2000);
    await new Promise(r => setTimeout(r, 3000 * attempt + jitter)); // 3초+지터
    res = await gasQuery(op, params);
  }
  return res;
}

async function gasQuery(op, params){
  if(!GAS_READY) return { ok:false, error:'GAS_URL 미설정' };
  const qs = new URLSearchParams(Object.assign({op, _ts: Date.now()}, params||{})).toString();
  try{
    // ★ 2026-07-17 수정: TV처럼 오래 켜두는 화면에서 브라우저가 예전 응답을
    //   캐싱해서 재사용하는 바람에 데이터가 안 바뀌는 것처럼 보이던 문제 수정.
    //   매번 다른 타임스탬프를 붙이고, fetch 자체도 캐시를 쓰지 말라고 명시.
    const res = await fetch(`${CONFIG.GAS_URL}?${qs}`, { cache: 'no-store' });
    return await res.json();
  }catch(e){
    // ★ 2026-08-19 신규 — fetch가 CORS 등으로 실패하면 JSONP로 한 번 더 시도
    console.warn('gasQuery fetch 실패, JSONP로 재시도:', op, e);
    try{
      return await jsonpGet(`${CONFIG.GAS_URL}?${qs}`);
    }catch(e2){
      console.error('gasQuery 완전 실패(fetch+JSONP 둘다):', op, e2);
      return { ok:false, error:String(e2) };
    }
  }
}
// ★ 2026-07-22 신규 — 이슈 되돌리기(undoIssue) 등 저장/변경 작업용 POST 호출
// ★ v5 신규 — 영업 상세조회 사본(salesInvDetail_) 갱신을 저장 응답 뒤에 따로 요청(화면 변화 없음, 기다리지 않음).
//   실패하면 3초 뒤 한 번 더, 그래도 실패하면 서버의 1분 주기 동기화가 채움.
function _bgInvMirror_(list){
  try{
    (Array.isArray(list) ? list : []).slice(0, 10).forEach(inv => {
      const v = String(inv || '').trim();
      if(!v) return;
      gasCall('syncInvoiceMirror', { invoice: v }).then(r => {
        if(!r || !r.ok) setTimeout(() => { gasCall('syncInvoiceMirror', { invoice: v }).catch(() => {}); }, 3000);
      }).catch(() => {});
    });
  }catch(e){ /* 무시 */ }
}
async function gasCall(op, data){
  if(!GAS_READY) return { ok:false, error:'GAS_URL 미설정' };
  try{
    const fd = new FormData();
    fd.append('op', op);
    // ★ v5 — 완료 버튼 저장은 "영업 상세 사본은 응답 뒤로" 요청(mirrorLater). 서버가 미뤘으면 응답의 mirrorInv 로 곧바로 따로 갱신 요청.
    fd.append('data', JSON.stringify(op === 'setPackingMoved' ? Object.assign({}, data || {}, { mirrorLater: 1 }) : (data || {})));
    // ★ 2026-07-22 신규: 타임아웃이 없어서 서버 응답이 늦으면 "처리 중..."
    //   상태로 무한정 멈춰있던 문제 수정 — 20초 넘으면 실패로 보고 사용자가
    //   다시 시도할 수 있게 함.
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 20000);
    const res = await fetch(CONFIG.GAS_URL, { method:'POST', body: fd, signal: controller.signal });
    clearTimeout(timer);
    const out = await res.json();
    if(op === 'setPackingMoved' && out && out.ok && Array.isArray(out.mirrorInv)) _bgInvMirror_(out.mirrorInv);
    return out;
  }catch(e){
    console.error('gasCall failed:', op, e);
    const msg = (e && e.name === 'AbortError') ? '서버 응답이 너무 늦어서 중단했습니다(20초 초과). 다시 시도해주세요.' : String(e);
    return { ok:false, error: msg };
  }
}

// 30초마다 폴링한다"는 전제로 정해진 여유(1.5배)였다. 그런데 지금은 Firestore
// 미러 구조라, 폴링이 대부분 "서버가 1분(=60초)마다 한 번씩 새로 써주는 캐시
// 문서"를 읽을 뿐이다. 즉 실제 서버 반영 확인 주기는 최대 60초 이상 걸릴 수
// 있는데, 50초 만에 포기하고 "아직 못 따라온" 미러 값을 진짜인 것처럼 믿어버려서
// (저장 자체는 이미 성공했는데도) 화면만 핑크로 되돌아가는 사고가 난 것.
// 해결 2단계: ①시간을 넉넉히(정상 미러 주기 1회를 확실히 넘기도록) 늘리고,
// ②그래도 못 따라오면 아래 _verifyPendingPackMoveDirectly_()로 미러를 거치지
// 않고 서버에 직접 한 번 더 물어봐서, 실제로 저장 안 된 "진짜 실패"만 되돌린다.
const PENDING_PACK_MAX_MS = 75000;

// ★ 2026-08-14 신규 — 패킹존 이동 상태가 서버와 30초 넘게 안 맞을 때 눈에 보이게 알림.
//   콘솔 경고만으로는 창고 TV 앞에서 아무도 못 봄.
function showSyncFailToast(customerName){
  const id = 'syncFailToast';
  let el = document.getElementById(id);
  if(!el){
    el = document.createElement('div');
    el.id = id;
    el.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:9999; background:#7a0000; color:#fff; padding:14px 22px; border-radius:10px; font-size:14px; font-weight:700; box-shadow:0 6px 24px rgba(0,0,0,0.5); border:1px solid #ff4d4d; max-width:80vw; text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = `⚠️ "${customerName}" 패킹존 이동 표시가 서버에 저장되지 않았습니다 — 다시 눌러주세요`;
  el.style.display = 'block';
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 8000);
}

// ★ 2026-09-30 신규(위 PENDING_PACK_MAX_MS 수정과 짝) — 낙관적으로 표시해둔
// 패킹존 이동 값이 미러에서 오래도록(75초) 확인이 안 되면, 곧바로 "실패"로
// 단정해서 되돌리는 대신 Firestore 미러를 건너뛰고 Apps Script에 직접
// getSlotProgress를 한 번 더 물어본다(togglePackingMoved의 실패 처리에서
// 이미 쓰던 것과 완전히 동일한 "직접 확인" 패턴). 서버에 실제로는 잘
// 저장돼 있는데 미러만 아직 못 따라온 것이라면(가장 흔한 경우 — 1분 동기화
// 주기가 밀렸을 때) pending을 계속 유지해서 화면이 절대 틀리게 되돌아가지
// 않게 하고, 직접 확인해도 진짜 반영이 안 돼 있을 때만(정말 드문 진짜 실패)
// 그때 되돌린다. invoice별로 동시에 여러 번 확인을 안 보내도록 가드함.
let _pendingPackMoveVerifying = new Set();
async function _verifyPendingPackMoveDirectly_(invoice, pendingEntry, batchIdAtCheck){
  if(_pendingPackMoveVerifying.has(invoice)) return;
  _pendingPackMoveVerifying.add(invoice);
  try{
    const check = await gasQuery('getSlotProgress', { batchId: batchIdAtCheck });
    const checkSlot = check && check.ok && (check.slots || []).find(s => s.invoice === invoice);
    const checkStage = checkSlot ? (checkSlot.takenOut ? 'taken' : checkSlot.movedToPacking ? 'moved' : 'none') : null;
    if(checkStage === pendingEntry.stage){
      // 미러만 아직 못 따라왔을 뿐, 서버엔 이미 정확히 저장돼 있음 — 절대 되돌리지 않음.
      // 타이머를 다시 미뤄서, 다음 미러 갱신이 따라잡을 때까지 재확인을 과도하게 반복 안 함.
      pendingEntry.ts = Date.now();
      console.log('✅ [패킹존 이동] 미러 지연 확인 — 서버엔 이미 정상 저장되어 있어 화면 유지:', invoice, pendingEntry.stage);
    } else {
      console.warn('⚠ [패킹존 이동] 서버 직접 확인 결과도 반영 안 돼 있음 — 진짜 실패로 판단, 되돌림:', invoice, '기대값:', pendingEntry.stage, '실제값:', checkStage);
      delete _pendingPackMoves[invoice];
      showSyncFailToast((_slotsByInvoice[invoice] && _slotsByInvoice[invoice].customer) || invoice);
      pollOnce(); // 실제 서버 값으로 화면을 정확히 맞춤
    }
  }catch(e){
    console.warn('[패킹존 이동] 직접 확인 자체 실패 — 다음 재확인 때 다시 시도:', invoice, e);
  }finally{
    _pendingPackMoveVerifying.delete(invoice);
  }
}

// ★ 2026-08-04 신규 — 슬롯의 현재 패킹 단계: none(초록) / moved(핑크) / taken(파랑)
function packStageOf(slot){
  return slot.takenOut ? 'taken' : slot.movedToPacking ? 'moved' : 'none';
}

// ★ 2026-07-23 신규 — "패킹존 이동" 체크박스 토글. clearSlot(슬롯비우기)과 무관한
// 순수 표시용 상태 변경이라, 서버에 저장만 하고 슬롯 재배정 로직은 전혀 안 건드림.
// ★ 2026-08-04 확장 — 2단계(초록↔핑크 토글)에서 3단계로 확장:
//   초록(완료) →클릭→ 핑크("패킹존 이동 필요" = 출고팀이 가져가야 함)
//   →클릭→ 파랑("패킹존 이동 완료" = 출고팀이 실제로 가져감) — ★ 기존 의미 그대로
//   서버에는 stage('moved'|'taken')로 전달 — 기존 setPackingMoved op를 확장한 것이라
//   Code.gs 라우팅 수정 없이 동작. (moved 파라미터만 보내는 옛 클라이언트도 계속 호환됨)
// ★ 2026-08-24 재설계(오출고 방지) — 파랑(taken) 상태에서 한 번 더 누르는 동작은
//   이제 이 함수를 거치지 않고(document click 위임에서 먼저 가로채서) 대신
//   "최종 2차 검증" 모달을 엶. 이 함수는 오직 none→moved, moved→taken 두 전진
//   방향만 담당 — 아래 cur==='taken' 되돌리기 확인 분기는 이 함수가 그 상태로
//   호출되는 경로가 없어져서 사실상 도달 불가능하지만, 혹시 모를 예외적 호출
//   경로에 대비해 안전장치로 그대로 남겨둠(제거해도 되지만 방어적으로 유지).
async function togglePackingMoved(invoice){
  const slot = _slotsByInvoice[invoice];
  if(!slot) return;
  const cur = packStageOf(slot);
  const next = (cur === 'none') ? 'moved' : (cur === 'moved') ? 'taken' : 'moved';
  // ★ 2026-08-14 신규(매니저 요청) — 파랑("이동 완료" = 출고팀이 실제로 가져감)
  //   상태에서 그 자리를 한 번 더 누르면 아무 확인 없이 조용히 핑크로 되돌아갔음.
  //   TV가 터치스크린이라 지나가던 사람이 스치듯 건드리거나 확인차 한 번 더
  //   눌러도 그대로 취소돼버린 사고가 실제로 있었음(8/12). "이미 출고 완료로
  //   표시된 걸 취소"하는 방향만 확인을 받고, 앞으로 진행하는 방향(초록→핑크,
  //   핑크→블루)은 지금처럼 그대로 바로 처리되게 둠.
  if(cur === 'taken'){
    if(!confirm(`정말 되돌리시겠습니까?\n\n"${slot.customer || invoice}"는 이미 출고팀이 가져간 것으로(블루) 표시돼 있습니다.\n다시 누르면 "이동 필요"(핑크) 상태로 돌아가서, 출고팀이 다시 가져가야 하는 것처럼 보이게 됩니다.`)) return;
  }
  const prevMoved = slot.movedToPacking, prevTaken = slot.takenOut;
  _pendingPackMoves[invoice] = { stage: next, ts: Date.now() }; // ★ 폴링이 이 값을 되돌리지 못하게 보류 등록(만료시간 포함)
  slot.movedToPacking = true;               // moved/taken 둘 다 "이동 표시는 켜진" 상태
  slot.takenOut = (next === 'taken');
  renderBoard(Object.values(_slotsByInvoice)); // 낙관적 갱신 — 서버 응답 기다리지 않고 즉시 화면 반영
  // ★ 2026-08-18 신규 — 배치 막바지에 여러 슬롯이 짧은 시간 안에 몰려서 눌리면,
  //   서버 쪽 문서 락 경합으로 첫 시도가 "일시적으로" 실패하는 경우가 있었음
  //   (32개가 거의 동시에 완료되며 실제로 발생). 곧바로 초록으로 되돌리지 않고,
  //   짧은 간격을 두고 최대 2번 더 자동 재시도한 뒤에도 계속 실패해야만
  //   원래 값으로 되돌림 — 대부분의 일시적 경합은 재시도 안에서 조용히 복구됨.
  let res = await gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: next });
  for(let attempt = 1; !res.ok && attempt <= 2; attempt++){
    await new Promise(r => setTimeout(r, 1200 * attempt)); // 1.2초, 2.4초 대기 후 재시도
    res = await gasCall('setPackingMoved', { batchId: currentBatchId, invoice, stage: next });
  }
  if(!res.ok){
    // ★ 2026-09-01 긴급 수정 — "블루로 바뀌었다가 잠시 후 다시 핑크로 돌아간다"는
    //   현장 사고의 진짜 원인. gasCall(POST)이 실패로 보여도(TypeError: Failed to
    //   fetch 등, CORS/네트워크 문제로 응답만 못 받은 경우 포함) 실제로는 서버에
    //   이미 저장이 끝났을 수 있음 — 이 경우 저장은 성공했는데 클라이언트만 실패로
    //   착각해서 화면을 되돌리면, 다음 폴링에서 서버의 진짜 값(taken)이 다시
    //   와도 이미 되돌려진 화면과 안 맞아 깜빡이거나(이번 경우처럼) 신뢰가 깨짐.
    //   그래서 진짜로 되돌리기 전에, 조회(GET — JSONP 우회가 이미 있어 POST보다
    //   훨씬 안정적)로 서버의 실제 현재 상태를 한 번 더 직접 확인함. 이미
    //   반영돼 있으면 절대 되돌리지 않고 성공으로 인정하고 끝냄.
    let actuallySucceeded = false;
    try{
      const check = await gasQuery('getSlotProgress', { batchId: currentBatchId });
      const checkSlot = check && check.ok && (check.slots || []).find(s => s.invoice === invoice);
      const checkStage = checkSlot ? (checkSlot.takenOut ? 'taken' : checkSlot.movedToPacking ? 'moved' : 'none') : null;
      actuallySucceeded = (checkStage === next);
    }catch(e){ /* 확인 자체도 실패하면 안전하게 아래에서 되돌림 */ }
    if(actuallySucceeded){
      console.warn('⚠ setPackingMoved 응답은 실패였지만 서버 확인 결과 이미 정상 반영되어 있어 되돌리지 않음:', invoice);
      // _pendingPackMoves는 그대로 둠 — 다음 정상 폴링이 확인하고 스스로 정리함
      return;
    }
    console.warn('⚠ setPackingMoved 재시도 후에도 실패:', invoice, res.error);
    delete _pendingPackMoves[invoice]; // 실패 시 보류 해제하고 원상복구
    slot.movedToPacking = prevMoved;
    slot.takenOut = prevTaken;
    renderBoard(Object.values(_slotsByInvoice));
  }
  // 성공 시엔 _pendingPackMoves를 여기서 지우지 않음 — 다음 폴링이 서버 값을 읽어와서
  // 이 값과 실제로 일치하는 걸 renderBoard 안에서 확인하는 순간 자동으로 정리됨.
  // 이렇게 해야 폴링 타이밍과 무관하게 항상 정확한(그리고 절대 되돌아가지 않는) 화면 유지.
}

function cardHtml(slot){
  if(!slot){
    return `<div class="card"><div class="card-empty">비어있음</div></div>`;
  }
  // ★ 2026-07-23 신규 — 예전엔 여기서 slot.totalQty(이슈 반영 전 원래 수량)를 분모로
  //   썼는데, 완료(초록) 판정 자체는 서버가 effectiveTotal(이슈로 빠진 수량 뺀 실제
  //   필요수량) 기준으로 이미 계산해서 보내주고 있어서, "초록불인데 숫자는 100%가
  //   아닌" 것처럼 보이거나 batch.html(웹)과 분모 숫자가 서로 달라 혼란스러웠음.
  //   이제 TV도 effectiveTotal을 분모로 써서 웹과 항상 같은 숫자를 보여줌.
  const target = (slot.effectiveTotal !== undefined && slot.effectiveTotal !== null) ? slot.effectiveTotal : slot.totalQty;
  const pct = target > 0 ? Math.min(100, slot.scanned / target * 100) : 0;
  const flashClass = (prevStatus[slot.slotNum] && prevStatus[slot.slotNum] !== 'done' && slot.status === 'done') ? ' flash' : '';
  const numLabel = /^\d+$/.test(String(slot.slotNum)) ? String(slot.slotNum).padStart(2,'0') : String(slot.slotNum);
  // ★ 2026-07-16 신규: 이슈(EXP/NF/Damaged/OOS)가 하나라도 있으면 뱃지 표시.
  //   클릭하면 어떤 바코드가 몇 개 빠졌는지 상세 목록 팝업.
  const issueBadge = slot.issueQty > 0
    ? `<span class="card-issue-badge" data-invoice="${slot.invoice}">⚠ ${slot.issueQty.toLocaleString()}</span>`
    : '';
  // ★ 2026-08-24 신규(오출고 방지 재설계) — 초록/핑크/파랑의 기존 의미와 전환
  //   방식은 절대 안 바꿈(takenOut = "패킹존으로 물리적으로 가져감", 원래 그대로).
  //   주황(verified)은 파랑 위에 "얹는" 마지막 단계일 뿐 — 클래스도 taken은
  //   그대로 유지하고 verified만 추가로 붙여서 색만 오버라이드함.
  const packStage = slot.packVerified ? 'verified' : (slot.takenOut ? 'taken' : slot.movedToPacking ? 'moved' : 'none');
  const verifiedClass = slot.packVerified ? ' verified' : '';
  let packLabel = '검수완료 · 이동준비';
  if(packStage === 'moved') packLabel = '패킹존 이동 필요';
  else if(packStage === 'taken') packLabel = '패킹존 이동 완료'; // ★ 2026-08-24 원복 — 원래 짧은 문구 그대로(길게 붙였다가 카드 높이가 들쭉날쭉해져서 레이아웃이 깨졌음). 2차 검증은 눌러보면 바로 알 수 있음.
  else if(packStage === 'verified') packLabel = '최종 2차 검증완료'; // ★ 짧은 한글 라벨로 변경(영문 긴 문구도 같은 문제 유발)
  return `<div class="card ${slot.status}${slot.takenOut?' taken':slot.movedToPacking?' moved':''}${verifiedClass}${flashClass}" data-invoice="${slot.invoice}">
    <div class="card-top">
      <span class="card-slot">${numLabel}</span>
      <div class="card-top-right">
        ${issueBadge}
        <span class="card-ship ${shipClass(slot.shipVia)}">${shipLabel(slot.shipVia)}</span>
      </div>
    </div>
    <div class="card-cust">${slot.customer || ''}</div>
    <div class="card-invoice">${slot.invoice || ''}</div>
    <div class="card-bottom">
      <div class="card-metarow mr-grid">
        <span class="mr-l">SKU</span><span class="mr-d">${(slot.doneSku||0).toLocaleString()}</span><span class="mr-s">/</span><span class="mr-t">${(slot.totalSku||0).toLocaleString()}</span>
        <span class="mr-l">PCS</span><span class="mr-d">${slot.scanned.toLocaleString()}</span><span class="mr-s">/</span><span class="mr-t">${target.toLocaleString()}</span>
      </div>
      <div class="card-bar"><div style="width:${pct}%"></div></div>
      <div class="card-pack-check" data-pack-invoice="${slot.invoice}" data-pack-stage="${packStage}">
        <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></span>
        <span class="label">${packLabel}</span>
      </div>
    </div>
  </div>`;
}

// ★ 2026-07-16 신규 — 이슈 뱃지 클릭 시 상세 팝업
const ISSUE_REASON_OPTS = [
  {v:'EXP', label:'EXP · 유통기한'}, {v:'NF', label:'NF · 재고없음'},
  {v:'DMG', label:'DMG · 파손'}, {v:'OOS', label:'OOS · 품절'},
  {v:'SKUMIS', label:'SKUMIS · SKU 불일치'},
  // ★ 2026-07-24 신규 — 실제로는 정상 출고됐는데 작업자가 스캔만 깜빡한 경우.
  //   진짜 결품/품질 문제와 헷갈리지 않게 별도 사유로 구분.
  {v:'MISS', label:'MISS · 스캔 누락(실제 출고됨)'},
  // ★ 2026-08-18 신규 — 세일즈팀이 출고 직전/도중에 특정 제품만 빼달라고

        prefix = '⚠ ';

      } else if(issueQty > 0){

const _iis = {};            // 'batchId|invoice' -> { items, at, sig }

// ★ 2026-11-05 신규 — 시각 표시 통일("MM-DD HH:mm", 이 기기 현지 시간). 서버가 시트 값을 Date 그대로 보내면
//   "2026-11-06T01:14:19.000Z"(UTC)나 "Thu Nov 05 2026 17:14:19 GMT-0800" 형식으로 와서 날짜가 하루 넘어가 보이던 문제 수정.
function _fmtShortTime(t){
  if(t == null || t === '') return '';
  const str = String(t).trim();
  const m = str.match(/^(\d{4})-(\d{2})-(\d{2})[ ](\d{2}):(\d{2})/); // 이미 'yyyy-MM-dd HH:mm(:ss)' — 그대로
  if(m) return `${m[2]}-${m[3]} ${m[4]}:${m[5]}`;
  const d = (t instanceof Date) ? t : new Date(str);
  if(!isNaN(d.getTime())){
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

}
function _issEsc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function _iisFetch(batchId, invoice){

// 보드가 뜬 뒤 SKU 목록을 한 개씩 천천히 미리 받아둠(진행 중 슬롯 먼저)

function _iisSchedulePrefetch(){
  if(_iisPrefRunning || !_iisPrefEnabled) return;
  _iisPrefRunning = true;
  (async () => {
    try{
      await _issSleep(3000);
      if(_workersCache === null){ try{ await ensureWorkersLoaded(); }catch(e){} }
      for(let guard = 0; guard < 400; guard++){
        const b = currentBatchId;
        if(!b) break;
        if(document.hidden){ await _issSleep(5000); continue; }
        const rank = s => s.status === 'active' ? 0 : s.status === 'waiting' ? 1 : 2;
        const cand = Object.values(_slotsByInvoice)
          .filter(s => s.invoice && (s.status === 'active' || s.status === 'waiting') && !s.packVerified && !_iis[_iisKey(b, s.invoice)] && (_iisPrefFail[_iisKey(b, s.invoice)] || 0) < 2)
          .sort((x, y) => rank(x) - rank(y));

        const inv = cand[0].invoice;
        const ok = await _iisFetch(b, inv);

async function _iisRefreshOpen(b, invoice, delayMs){

  const seq = ++_iisModalReqSeq;
  _iisRefreshing = key;
  try{
    if(delayMs) await _issSleep(delayMs);
    if(seq !== _iisModalReqSeq) return;
    let ok = await _iisFetch(b, invoice);
    // ★ 최종검사 반영 — 더 나중 요청이 생겼어도, 아직 "불러오는 중"이면 받아온 목록을 바로 보여줌
    if(ok && seq !== _iisModalReqSeq && _issItemsLoading && _issueModalInvoice === invoice && currentBatchId === b && _iis[key]){
      _iisApply(_iis[key].items); _issItemsLoading = false; _issItemsFailed = false; _issRerender();
    }
    if(!ok && seq === _iisModalReqSeq){
      await _issSleep(2500 + Math.floor(Math.random() * 1500));
      if(seq !== _iisModalReqSeq) return;
      ok = await _iisFetch(b, invoice);
    }
    if(seq !== _iisModalReqSeq || _issueModalInvoice !== invoice || currentBatchId !== b) return;
    const c = _iis[key];
    if(c){ _iisApply(c.items); _issItemsLoading = false; _issItemsFailed = false; } // 미리받기가 먼저 채웠어도 사용
    else { _issItemsLoading = false; _issItemsFailed = true; }
    _issRerender();

  }
}

// ★ 리뷰 반영 — 한글 입력 조합 중이거나 드롭다운(사유·작업자)이 열린 상태에서는 화면을 다시 그리지 않고
//   조합이 끝나거나 드롭다운에서 나올 때 한 번 그림(글자 깨짐·드롭다운 닫힘 방지). 직접 누른 동작은 즉시.
let _issComposing = false, _issDeferred = false, _issDeferredAt = 0;
document.addEventListener('compositionstart', () => { _issComposing = true; }, true);
document.addEventListener('compositionend', () => { _issComposing = false; if(_issDeferred) setTimeout(() => _issRerender(), 0); }, true);
document.addEventListener('focusout', () => { _issComposing = false; if(_issDeferred) setTimeout(() => _issRerender(), 0); }, true);
function _issBusyTyping(){
  const a = document.activeElement, body = document.getElementById('issueModalBody');
  if(!a || !body || !body.contains(a)) return false;
  if(_issComposing) return true;
  return a.tagName === 'SELECT' && !a.hasAttribute('size'); // 펼쳐지는 드롭다운
}
function _issRerender(force){
  if(!_issueModalInvoice) return;
  if(!force && _issBusyTyping()){ if(!_issDeferred) _issDeferredAt = Date.now(); _issDeferred = true; return; }
  if(force) _issComposing = false;
  _issDeferred = false;
  const st = _issCapture();
  renderIssueModalBody();
  _issRestore(st);
}
function _issRerenderIf(invoice, batchId){
  if(_issueModalInvoice === invoice && (!batchId || batchId === currentBatchId)) _issRerender();
}

// ── 화면에 보일 이슈 목록 = 서버 값 + 저장 중/저장됨/실패 표시 ──
function _issEffective(invoice){
  const slot = _slotsByInvoice[invoice];
  const b = currentBatchId;
  const base = ((slot && slot.issues) || []).map(i => Object.assign({}, i));
  const out = [];
  base.forEach(i => {
    const d = _issPend.dels[i.issueId];
    if(d && d.batchId === b){ if(d.st === 'saved') return; i._del = d; }
    const e = _issPend.edits[i.issueId];
    if(e && e.batchId === b){ i._edit = e; if(e.st !== 'fail'){ i.reason = e.reason; i.qty = e.qty; i.note = e.note; } }
    out.push(i);
  });
  const ids = new Set(base.map(i => String(i.issueId)));
  _issPend.adds.forEach(a => {
    if(a.batchId !== b || a.invoice !== invoice) return;
    if(a.issueId && ids.has(String(a.issueId))) return; // 서버 목록에 이미 들어옴 — 한 번만 보이게
    out.push(Object.assign({}, a.payload, { issueId: a.issueId || a.tmpId, time: a.timeStr, _add: a }));
  });
  return out;
}
function _issPendHtml(kind, p){
  const label = kind === 'add' ? '등록' : kind === 'edit' ? '수정' : '삭제';
  const key = kind === 'add' ? p.tmpId : p.issueId;
  if(p.st === 'saving'){
    const sec = Math.max(0, Math.floor((Date.now() - p.at) / 1000));
    return `<div class="iss-pend saving">⏳ ${label} 저장 중…${p.tries > 1 ? ` (재시도 ${p.tries - 1})` : ''} · 다른 작업 계속하셔도 됩니다 <span class="iss-pend-sec" data-at="${p.at}">${sec >= 3 ? `· ${sec}s` : ''}</span></div>`;
  }
  if(p.st === 'saved') return `<div class="iss-pend saved">✓ ${label} 저장됨</div>`;
  const hint = kind === 'add' ? '아직 등록되지 않았습니다.' : kind === 'edit' ? '이전 값 그대로입니다.' : '삭제되지 않았습니다.';
  return `<div class="iss-pend fail">⚠ ${label} 실패 — ${hint}<br><span class="iss-pend-err">${_issEsc(_issErrText(p.err))}</span>
    <div class="iss-pend-actions"><button class="iss-pend-retry" data-kind="${kind}" data-key="${_issEsc(key)}">↻ 다시 시도</button><button class="iss-pend-dismiss" data-kind="${kind}" data-key="${_issEsc(key)}">닫기</button></div></div>`;
}
function _issErrText(e){
  const s = String(e || '알 수 없는 오류');
  if(/qty exceeds/i.test(s)) return '필요수량 초과: ' + s;
  if(/server_busy|lock|timed out|too many/i.test(s)) return '서버가 바쁩니다. 잠시 후 다시 시도하세요. (' + s + ')';
  return s;
}
function _issViewSig(invoice){
  try{
    return JSON.stringify(_issEffective(invoice).map(i => [i.issueId, i.reason, i.qty, i.note,
      i._add ? i._add.st : '', i._edit ? i._edit.st : '', i._del ? i._del.st : ''])) + '|' + _issItemsLoading + _issItemsFailed + '|' + Object.keys(_invoiceItemStatusByBarcode).length + '|' + (_workersCache ? _workersCache.length : -1);
  }catch(e){ return String(Math.random()); }
}
